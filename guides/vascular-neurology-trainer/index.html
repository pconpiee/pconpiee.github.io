{id:"i07",deck:"Imaging",tier:2,tags:["CT","ischaemia","MRI"],q:"Multiple small bright dots are scattered bilaterally along the cortex on these diffusion-weighted images, rather than one confluent territorial lesion. What mechanism does this distribution suggest, as opposed to a single large-vessel occlusion?",a:"<b>Multifocal bilateral watershed (borderzone) infarction</b> — numerous small foci of restricted diffusion are strung along the border zones between major arterial territories in both hemispheres and the cerebellum, giving a 'string of beads' appearance.<br>This pattern is produced by <b>hypoperfusion or showers of small emboli</b> reaching the most distal, poorly collateralised territory boundaries simultaneously — typically from global hypotension/cardiac arrest, severe bilateral carotid disease, or a proximal source showering multiple vessels.<br>It contrasts with a single wedge-shaped MCA-territory infarct, which points to one occluded vessel rather than a global perfusion or multi-embolic process.<br>Recognising this pattern should prompt a search for a cardiac or systemic cause rather than assuming one culprit artery.",img:[{f:"PMC3420568_CRIM.NM2011-834308.001.png",cap:"Diffusion-weighted imaging shows multiple zones of diffusion restriction in the watershed regions of both cerebral hemispheres and in the left cerebellar hemisphere.",src:"Dujardin S et al., Case reports in neurological medicine (2011)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3420568",lic:"CC BY",alt:"Four axial diffusion-weighted images show multiple small, rounded foci of restricted diffusion (bright signal) scattered along the cortex and subcortical white matter of both cereb"}]},
{id:"i08",deck:"Imaging",tier:2,tags:["CT","ischaemia","MRI"],q:"At two slice levels, a small cortical/subcortical focus is bright on DWI, dark on the corresponding ADC map, but the T2 image looks near normal. What does this triad of findings tell you about lesion location and timing?",a:"<b>Acute right anterior–middle cerebral artery border-zone (watershed) infarction</b> — the lesion sits in the frontal border zone between the ACA and MCA territories, a classic location for hypoperfusion-related infarcts.<br>Restricted diffusion (bright DWI with corresponding low ADC signal) reflects cytotoxic oedema from failed ion pumps in ischaemic tissue, confirming this is a <b>genuinely acute</b> infarct rather than an old lesion.<br>The T2-weighted image showing little change indicates the infarct is early, since T2/FLAIR hyperintensity typically lags diffusion change by several hours — a DWI-positive, T2-normal lesion is time-stamped as hyperacute.<br>The border-zone location should prompt evaluation for a proximal flow-limiting stenosis or hypotensive episode rather than assuming embolic occlusion of a single named vessel.",img:[{f:"PMC4027650_jmd-6-1-17-4f1.png",cap:"Diffusion-weighted (A) and fluid-attenuated inversion recovery (B) MR images demonstrate acute small infarctions in the right border zone between the anterior and middle cerebral artery.",src:"Kim DW et al., Journal of movement disorders (2013)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4027650",lic:"CC BY-NC",alt:"At two axial slice levels, paired diffusion-weighted and apparent diffusion coefficient images show a small focus in the right frontal cortex/subcortical border zone that is bright"}]},
{id:"i09",deck:"Imaging",tier:2,tags:["CT","ischaemia","MRI"],q:"This patient has a confirmed occlusion of the M1 segment of the MCA, yet the diffusion-weighted images show only a small area of restricted diffusion in the lentiform nucleus and insula, rather than the whole MCA territory. What imaging/physiological factor explains such a small infarct core despite a proximal large-vessel occlusion?",a:"<b>Good leptomeningeal (pial) collateral flow</b> limits the infarct core despite a proximal M1 occlusion.<br>The small area of restricted diffusion — bright on DWI, low signal on the corresponding ADC map — is confined to the dorsal lentiform nucleus and insula, structures supplied by end-arteries (lenticulostriate perforators) with little collateral supply.<br>The surrounding MCA cortical territory is preserved because retrograde flow from adjacent pial-to-pial anastomoses kept it above the infarction threshold, consistent with the near-normal T2 sequence.<br>This illustrates why collateral grade, not occlusion site alone, is a major determinant of salvageable tissue and a key factor in patient selection for thrombectomy.",img:[{f:"PMC4556517_pone.0137292.g001.png",cap:"Typical pattern of a well-collateralized patient.78y old female with left-sided M1-occlusion and a very good pial collateralization (Higashida grade 4); two transverse sections from the acute MRI: DWI (A,D), ADC maps (B,E) and T2w images (C,F). Diffusion restriction was seen in the dorsal part of the lentiform nucleus and the adjacent insula (white arrows in D, E).",src:"Verma RK et al., PloS one (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4556517",lic:"CC BY",alt:"Two axial slice levels with DWI, ADC and T2 images show a small area of restricted diffusion (bright DWI, dark ADC) confined to the dorsal lentiform nucleus and adjacent insula, wi"}]},
{id:"i10",deck:"Imaging",tier:2,tags:["CT","ischaemia","MRI"],q:"Compare this M1-occlusion patient's diffusion images with a lentiform-only infarct case: here the restricted diffusion involves the lentiform nucleus, insula, and most of the MCA cortical territory. Given the occlusion is at the same site, what single variable most plausibly explains the much larger infarct core?",a:"<b>Poor pial collateral flow</b> is the key variable explaining the larger infarct core.<br>With a proximal M1 occlusion and weak leptomeningeal anastomoses, cortical MCA territory that would otherwise be kept alive by retrograde collateral perfusion instead drops below the ischaemic threshold and infarcts, so restricted diffusion extends well beyond the perforator territory into multiple cortical zones.<br>This is the imaging counterpart of a low collateral grade on catheter angiography or CT/MR perfusion.<br>It matters clinically because poor collaterals predict faster core growth, a smaller salvageable penumbra, and worse outcomes even after successful recanalisation, underscoring why collateral assessment guides urgency and expected benefit of thrombectomy.",img:[{f:"PMC4556517_pone.0137292.g002.png",cap:"Typical pattern of a poorly-collateralized patient.39y old female with right-sided M1-occlusion and a poor collateralization grade (Higashida grade 1); DWI (A,D), ADC maps (B,E) and T2w images (C,F). Diffusion restriction (A, B, D and E) is detected in the lentiform nucleus, insula, M1, M2, M4, M5 and M6 according to ASPECTS.",src:"Verma RK et al., PloS one (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4556517",lic:"CC BY",alt:"The same DWI/ADC/T2 layout as a paired case shows extensive restricted diffusion spanning the lentiform nucleus, insula, and multiple MCA cortical regions on the right, far more ex"}]},
{id:"i11",deck:"Imaging",tier:2,tags:["CT","ischaemia","MRI"],q:"A small, sharply-marginated bright focus is seen on this diffusion-weighted image adjacent to the lateral ventricle. What vessel territory does a lesion in this location typically arise from, and what stroke subtype does this suggest?",a:"<b>Small left thalamocapsular infarct</b> — a discrete focus of restricted diffusion in the thalamus/internal capsule region, supplied by small deep perforating arteries rather than a major cortical vessel.<br>Its small, well-circumscribed shape and deep location are typical of a <b>lacunar infarct</b>, usually caused by small-vessel (perforator) disease related to chronic hypertension or diabetes rather than embolism from a proximal large-vessel source.<br>Because these vessels supply compact but eloquent structures (thalamus, internal capsule), even a small lesion like this can produce a disproportionately significant clinical deficit (e.g. a pure sensory or sensorimotor stroke).<br>This appearance should prompt work-up for small-vessel risk factors rather than an extensive cardioembolic/large-vessel screen alone.",img:[{f:"PMC4735078_gr3.png",cap:"Diffusion weighted MRI revealing small left thalamocapsular acute infarct.",src:"Hayes L et al., IDCases (2014)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4735078",lic:"CC BY-NC-ND",alt:"Single axial diffusion-weighted image shows a small, well-defined focus of restricted diffusion (bright signal) in the left thalamocapsular region adjacent to the lateral ventricle"}]},
{id:"i12",deck:"Imaging",tier:2,tags:["CT","ischaemia","MRI"],q:"This patient has bright foci on DWI in two different locations. How would you use the ADC map to work out which of these lesions is the new acute event and which is an old, previous stroke?",a:"<b>ADC signal separates acute from chronic infarction</b> — a genuinely acute lesion shows restricted diffusion: bright on DWI with correspondingly <b>low</b> signal on the ADC map, because cytotoxic oedema restricts water movement.<br>An old infarct undergoes encephalomalacia and gliosis over time, so free water increases and the ADC signal becomes <b>high</b> (T2 shine-through can still make it look bright on DWI, but the ADC confirms it is not restricted).<br>Here the right-sided lesion is dark on ADC (truly restricted, i.e. acute), while the left-sided abnormality is bright on ADC, marking it as an old, chronic infarct rather than a new event.<br>This DWI/ADC pairing is essential whenever a patient has had a prior stroke, since DWI hyperintensity alone cannot distinguish new ischaemia from an old lesion.",img:[{f:"PMC4935817_ni-2016-2-6617-g002.png",cap:"Axial view of brain magnetic resonance imaging, diffusion-weighted and apparent diffusion coefficient sequence: watershed acute ischemic infarction between apparent diffusion coefficient – multiple correspondence analysis and multiple correspondence analysis – principal component analysis territories in right side; hypersignality in diffusion-weighted and hyposignality in apparent diffusion coefficient is…",src:"Almasi M et al., Neurology international (2016)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4935817",lic:"CC BY-NC",alt:"Three axial diffusion-weighted images (top row) and their corresponding ADC maps (bottom row) show a bright DWI focus on the right that is dark on the matching ADC map, alongside a"}]},
{id:"i13",deck:"Imaging",tier:2,tags:["CT","ischaemia"],q:"These four CT panels range from an unremarkable scan through two small deep hypodensities to a large area of low attenuation in panel D. What vascular distribution does the abnormality in panel D follow, and how does its shape differ mechanistically from the small lesions in panels B and C?",a:"<b>Panel D shows a large right middle cerebral artery (MCA) territorial infarct</b> — a wedge-shaped area of hypoattenuation spanning the fronto-temporo-parietal cortex and adjacent white matter, following the surface distribution of a major cortical artery.<br>Panels B and C show tiny, rounded hypodensities in the caudate and centrum semiovale respectively — <b>lacunar infarcts</b> caused by occlusion of small, deep perforating arteries, which supply only a small, discrete volume of tissue.<br>The difference in shape reflects the difference in vessel size and territory: a large wedge implies occlusion of a proximal named artery supplying a whole cortical territory, whereas a punctate lesion implies an isolated end-artery/perforator occlusion.<br>Distinguishing these patterns matters because large territorial infarcts raise concern for large-vessel occlusion amenable to thrombectomy, while a lacunar pattern points toward chronic small-vessel disease as the underlying aetiology.",img:[{f:"PMC5325848_10840_2016_206_Fig3_HTML.png",cap:"Non-contrast enhanced cerebral CT scan of patients after TALV lead implantation: a no abnormality; b 6 mm lacuna in the right-sided nucleus caudatus, c 4 mm hypodensity in left-sided centrum semiovale, d middle cerebral artery occlusion with right-sided fronto-temporo-parietale extension",src:"Kis Z et al., Journal of interventional cardiac electrophysiology : an international journal of arrhythmias and pacing (2017)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5325848",lic:"CC BY",alt:"Four axial non-contrast CT panels show, in sequence, an essentially normal-appearing scan, a small hypodense focus in the caudate nucleus, a small hypodensity in the centrum semiov"}]},
{id:"i14",deck:"Imaging",tier:2,tags:["MRI","ischaemia","mixed"],q:"Panel A is a FLAIR image and panel B a CT angiogram of the neck. What vascular process in panel B could explain a posterior-circulation infarct like the one suggested in panel A, and which artery is affected?",a:"<b>Vertebral artery dissection</b>.<br>Panel B shows smooth luminal narrowing with a hazy, tapered segment of the right vertebral artery - the classic 'string sign' of dissection rather than atherosclerotic stenosis.<br>Dissection here can embolise or reduce flow to the posterior circulation, producing infarcts such as the paramedian thalamic lesion suggested on the FLAIR image - a well-recognised cause of stroke in younger patients.",img:[{f:"PMC2885997_1471-2415-10-14-2.png",cap:"Diagnostic imaging results. (A) Magnetic Resonance Imaging Axial T2 FLAIR section showing a left occipital infarct (arrow) and also a right paramedian thalamic infarct (arrowhead). (B) Coronal view of the right vertebral artery on CT angiogram showing thinning of the artery (arrowhead) and shadowing of the dissected section of the vertebral artery (arrows).",src:"Matti AI et al., BMC ophthalmology (2010)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2885997",lic:"CC BY",alt:"An axial FLAIR image with a small high-signal focus near the right paramedian thalamic midline (the left occipital finding described in the caption is too subtle to confirm at this"}]},
{id:"i15",deck:"Imaging",tier:2,tags:["MRI","ischaemia"],q:"This T2 image is centred on the medulla. Based on the arrow, which brainstem syndrome does a lesion in this location classically produce, and what vessel is usually responsible?",a:"<b>Lateral medullary (Wallenberg) syndrome</b>, most often due to occlusion of the <b>vertebral artery</b> or the posterior inferior cerebellar artery (PICA).<br>The arrow marks a focal signal change in the right lateral medulla, the territory supplied by these vessels.<br>Clinically this produces crossed sensory loss (ipsilateral face, contralateral body), ipsilateral Horner's syndrome, ataxia, dysphagia and vertigo, reflecting damage to structures that all pass through this small region.",img:[{f:"PMC3073801_crg0001-0135-f04.png",cap:"MRI T2 sequence showing a hyperintense lesion (arrow) in the right lateral medullary region.",src:"Castillo AL et al., Case reports in gastroenterology (2007)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3073801",lic:"CC BY-NC-ND",alt:"Axial T2 image at the level of the medulla with an arrow pointing to a subtle area of increased signal in the right lateral medulla."}]},
{id:"i16",deck:"Imaging",tier:2,tags:["MRI","ischaemia"],q:"The area of abnormal high signal occupies the right occipital lobe. Which cerebral artery territory does this correspond to, and what visual field deficit would you expect?",a:"<b>Right posterior cerebral artery (PCA) territory</b>.<br>The occipital lobe is supplied by the PCA, so an infarct confined to this lobe produces a <b>left homonymous hemianopia</b>, often with macular sparing because the occipital pole receives some collateral supply from the middle cerebral artery.<br>PCA infarcts are frequently embolic and can be mistaken clinically for an ophthalmological problem because motor and sensory function are typically preserved.",img:[{f:"PMC4531634_kjim-18-4-244-9f1.png",cap:"Axial FLAIR MR image and diffusion-weighted MR image show high signal intensity lesion in the right posterior cerebral artery territory (arrow).",src:"Lee CM et al., The Korean journal of internal medicine (2003)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4531634",lic:"CC BY-NC",alt:"A single low-resolution axial MRI slice showing a clearly demarcated area of high signal occupying the right occipital lobe."}]},
{id:"i17",deck:"Imaging",tier:2,tags:["MRI","ischaemia","mixed"],q:"The diffusion-restricting lesion sits in the paramedian midbrain and thalamus, and the MRA shows an abnormal proximal posterior cerebral artery on the same side. What perforating artery variant, if occluded, could explain a lesion in this distribution?",a:"This distribution is classic for occlusion of the <b>artery of Percheron</b>, a variant single perforating trunk arising from one P1 segment that supplies the paramedian thalami and rostral midbrain.<br>The high signal on the diffusion image with corresponding restriction, alongside attenuation of the proximal PCA on MRA, supports a proximal posterior circulation source.<br>Recognising this pattern matters because it can cause reduced consciousness, vertical gaze palsy and memory disturbance, and is easily missed if only the cortex is reviewed.",img:[{f:"PMC5402517_JNRP-8-313-g001.png",cap:"Brain magnetic resonance imaging-diffusion-weighted imaging axial view (a and b) bright signal change in the right paramedian midbrain and anteromedial thalamus (red arrow); apparent diffusion coefficient axial view (d and e) corresponding dark signal change (red arrow); magnetic resonance angiography of intracranial arteries shows thinning of right posterior cerebral artery (red arrow)(c)",src:"Mahale RR et al., Journal of neurosciences in rural practice (2017)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5402517",lic:"CC BY-NC-SA",alt:"Two small axial DWI panels with a subtle focus of high signal near the midline in the paramedian midbrain/thalamus, matching low signal on an ADC-style panel, plus an MR angiogram"}]},
{id:"i18",deck:"Imaging",tier:2,tags:["MRI","ischaemia"],q:"One of these two DWI images shows a focal high-signal lesion in the medial cerebellum. Which cerebellar artery territory does this represent, and what is a key clinical risk of a large infarct in this location?",a:"<b>Medial branch of the posterior inferior cerebellar artery (PICA)</b> territory, supplying the caudal medial cerebellum near the vermis, as shown by the wedge of restricted diffusion.<br>Even though PICA infarcts often present with relatively mild symptoms (dizziness, ataxia, vomiting), the key danger is <b>oedema causing mass effect on the fourth ventricle and brainstem</b>, which can lead to acute hydrocephalus or brainstem compression - so patients need close neurological observation even when the initial deficit looks minor.",img:[{f:"PMC2706413_jcn-5-65-g002.png",cap:"MRI finding in a patient with infarction in the territory of the medial branch of the PICA. Diffusion-weighted axial images (A and B) of the brain MRI showed an acute infarct in the left medial caudal cerebellum. PICA: posterior inferior cerebellar artery.",src:"Lee H., Journal of clinical neurology (Seoul, Korea) (2009)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2706413",lic:"CC BY-NC",alt:"Two axial DWI panels of the posterior fossa; one panel shows a wedge-shaped area of high signal in the medial left cerebellar hemisphere near the vermis, absent on the comparison p"}]},
{id:"i19",deck:"Imaging",tier:2,tags:["MRI","ischaemia"],q:"Both thalami show symmetric abnormal signal on this scan. What vascular explanation accounts for a bilateral, symmetric thalamic lesion like this, given that the thalami are usually supplied by separate arteries on each side?",a:"A <b>bilateral paramedian thalamic infarct</b>, most often caused by occlusion of the <b>artery of Percheron</b> - an anatomical variant where a single trunk from one P1 segment supplies both paramedian thalami.<br>Because one vessel supplies both sides, occlusion produces the symmetric 'butterfly'-shaped bithalamic lesion seen here rather than a unilateral infarct.<br>Clinically this presents with altered consciousness, vertical gaze abnormalities and memory impairment, and should be suspected whenever bilateral thalamic signal change is seen without another obvious cause.",img:[{f:"PMC2767135_1752-1947-0003-0000007392-2.png",cap:"Axial (right and left) and coronal (center) trace diffusion-weighted magnetic resonance images, obtained 20 hours after the onset of symptoms, show bilateral thalamic areas of high signal intensity (white arrows) compatible with acute bilateral paramedian thalamic infarcts. Rostral midbrain infarct is limited to right periaqueductal gray matter (empty white arrows).",src:"López-Serna R et al., Journal of medical case reports (2009)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2767135",lic:"CC BY",alt:"Three axial/coronal DWI-type images with scanner header text; the centre coronal panel shows faint symmetric high signal in both thalami near the midline, marked with small arrowhe"}]},
{id:"i20",deck:"Imaging",tier:2,tags:["MRI","ischaemia"],q:"The lesions here are small, punctate, and arranged along the deep white matter rather than forming one confluent territorial infarct. What mechanism does this pattern suggest, as opposed to embolic occlusion of a single named artery?",a:"This is the <b>watershed (borderzone) infarct pattern</b>, seen along the boundary between adjacent arterial territories (here, the internal watershed zone).<br>Rather than a single embolus blocking one named vessel, this pattern points to <b>systemic hypoperfusion</b> - for example severe carotid stenosis with a distal pressure drop, or an episode of hypotension - because the borderzones are most vulnerable when overall perfusion pressure falls.<br>Recognising the punctate, 'string of pearls' distribution on DWI should prompt a search for proximal large-vessel stenosis or a hypotensive event rather than assuming cardioembolism.",img:[{f:"PMC2874792_1471-2377-10-30-1.png",cap:"The axial FLAIR image (1A) shows small hyperintense foci in the watershed area in the right hemisphere. Some of these foci show high signal intensity on DWI (1B) and low signal intensity at the ADC-map (1C), consistent with restrictive diffusion (arrows).",src:"Braakman HM et al., BMC neurology (2010)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2874792",lic:"CC BY",alt:"Three-panel FLAIR/DWI/ADC set showing small punctate foci of high signal in the right hemisphere, most conspicuous on the diffusion-weighted panel, in a subcortical/corona radiata"}]},
{id:"i21",deck:"Imaging",tier:2,tags:["MRI","ischaemia","DSA"],q:"The normal proximal anterior and middle cerebral arteries are poorly seen, replaced by a fine tangle of small vessels at the base of the brain. What is this angiographic appearance called, and what underlying process does it indicate?",a:"This is the <b>'puff of smoke' (moyamoya) appearance</b>, caused by progressive stenosis or occlusion of the distal internal carotid artery and proximal anterior/middle cerebral arteries.<br>The fine network seen here represents innumerable enlarged basal perforating collaterals that develop to bypass the narrowed vessels, together with transdural collaterals from the external carotid circulation.<br>This pattern defines <b>moyamoya disease</b> (or moyamoya syndrome if secondary to another condition) and predisposes to both ischaemic stroke and haemorrhage from the fragile collateral vessels.",img:[{f:"PMC3139336_JNRP-1-105-g004.png",cap:"Frontal view of a right internal carotid catheter angiogram, showing the “Puff of Smoke” appearance due to innumerable enlarged basal perforators overshadowing the attenuated anterior and middle cerebral arteries. Also, collaterals from the external carotid artery are enlarged to retrogradely fill the peripheral branches of the middle and anterior cerebral arteries",src:"Khan FY et al., Journal of neurosciences in rural practice (2010)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3139336",lic:"CC BY-NC-SA",alt:"A frontal catheter angiogram of the right internal carotid circulation showing an extensive, fine, tangled network of small collateral vessels at the base of the brain, with poor o"}]},
{id:"i22",deck:"Imaging",tier:2,tags:["MRI","ischaemia"],q:"Multiple small, rounded, well-defined high-signal foci are present in the basal ganglia on both sides. What size and vessel category defines this type of infarct, and what is the usual underlying vascular pathology?",a:"These are <b>lacunar infarcts</b> (by convention under about 15mm), caused by occlusion of small deep <b>penetrating/perforating arteries</b> supplying the basal ganglia, internal capsule, thalamus and pons.<br>The underlying pathology is typically <b>lipohyalinosis or microatheroma</b> related to chronic hypertension and diabetes, rather than embolism from the heart or a large proximal vessel.<br>Multiple bilateral lacunes like this reflect chronic small vessel disease and are a key marker of vascular risk for future stroke and vascular cognitive impairment.",img:[{f:"PMC3181915_DialoguesClinNeurosci-11-191-g005.png",cap:"Cerebrovascular pathology on axial fluid attenuated inversion recovery (FLAIR) MRI scans. Lacunar infarcts in basal ganglia on both sides.",src:"Scheltens P., Dialogues in clinical neuroscience (2009)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3181915",lic:"CC BY-NC-ND",alt:"Axial FLAIR image showing several small, discrete rounded foci of high signal within the basal ganglia bilaterally."}]},
{id:"i23",deck:"Imaging",tier:2,tags:["MRI","ischaemia"],q:"Using the R/L markers, on which side is the area of restricted diffusion, and which named cortical structure does it involve?",a:"The high-signal area is in the <b>right frontal operculum</b> (confirmed by the R/L labels), the cortex overlying the inferior frontal gyrus at the sylvian fissure.<br>This is supplied by superficial cortical branches of the <b>middle cerebral artery</b>, so an isolated opercular infarct like this typically results from embolic occlusion of a distal MCA branch rather than the MCA stem.<br>Because the operculum contributes to motor speech and orofacial control networks, involvement here (especially on the dominant side) can produce dysarthria or expressive language difficulty even when the infarct is small.",img:[{f:"PMC3588394_CRIM.MEDICINE2013-513572.001.png",cap:"Diffusion-weighted magnetic resonance imaging demonstrates right frontal opercular restricted diffusion which is diagnosed as acute opercular infarct (R: Right, L: Left).",src:"Milanlioglu A et al., Case reports in medicine (2013)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3588394",lic:"CC BY",alt:"Single axial DWI image showing a well-defined, bright area of restricted diffusion in the frontal operculum on one side, labelled with R/L markers."}]},
{id:"i24",deck:"Imaging",tier:2,tags:["MRI","ischaemia"],q:"The lesion sits in the insular cortex and adjacent white matter, bright on DWI and dark on the matched ADC map. Why is involvement of the insula specifically significant when assessing an MCA-territory stroke?",a:"The <b>insular ribbon</b> is supplied by the most distal lenticulostriate and early cortical branches of the middle cerebral artery, making it one of the first regions to show restricted diffusion in <b>proximal MCA occlusion</b>.<br>High signal on DWI with correspondingly low signal on ADC confirms true cytotoxic oedema (an acute infarct) rather than T2 shine-through.<br>Loss of the normal insular ribbon is a recognised early ischaemic sign even on CT, and its presence here indicates a genuine MCA-territory acute infarct rather than a lacunar or watershed process.",img:[{f:"PMC3788301_AIAN-16-428-g001.png",cap:"(a, b) Magnetic Resonance Imaging MRI brain Diffusion Weighted Imaging/Apparent Diffusion Coefficient DWI/ADC axial images showing acute infarct in right peri-insular and adjacent white matter",src:"Patidar Y et al., Annals of Indian Academy of Neurology (2013)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3788301",lic:"CC BY-NC-SA",alt:"Paired axial DWI and ADC images showing a bright focus of restricted diffusion (dark on the ADC) in the peri-insular region and adjacent white matter on one side."}]},
{id:"i25",deck:"Imaging",tier:2,tags:["MRI","ischaemia"],q:"This susceptibility-weighted image shows a rounded area of marked signal loss within the cerebellar infarct. What does 'blooming' on SWI/GRE sequences indicate here, and why does it matter for management?",a:"The dark, 'blooming' focus represents <b>haemosusceptibility from blood breakdown products</b> (deoxyhaemoglobin/haemosiderin), indicating <b>haemorrhagic transformation</b> of the underlying ischaemic infarct.<br>SWI and GRE sequences are exquisitely sensitive to these paramagnetic products, exaggerating their apparent size compared with the true extent of haemorrhage.<br>Identifying haemorrhagic transformation is clinically important because it can preclude or complicate anticoagulation/antiplatelet therapy and raises concern for mass effect, particularly in the confined posterior fossa where even modest haemorrhage can cause brainstem compression.",img:[{f:"PMC3992771_AIAN-17-58-g001.png",cap:"Susceptibility weighted magnetic resonance imaging shows hemorrhage (&gt; 50%) (arrow) within the left cerebellar infarct",src:"Naik D et al., Annals of Indian Academy of Neurology (2014)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3992771",lic:"CC BY-NC-SA",alt:"Single axial susceptibility-weighted image showing a well-defined round area of marked signal loss (blooming) within an area of infarction in the left cerebellum."}]},
{id:"i26",deck:"Imaging",tier:2,tags:["MRI","ischaemia"],q:"The arrow marks a signal change extending into the cerebral peduncle. Which major white matter tract passes through this structure, and what clinical deficit would you expect from a lesion here?",a:"The cerebral peduncle carries the <b>corticospinal (and corticobulbar) tract</b> as it descends from the internal capsule to the spinal cord.<br>A lesion here, as marked by the arrow extending from the brainstem into the peduncle, produces a <b>contralateral hemiparesis</b>, since fibres have not yet decussated at this level.<br>Brainstem infarcts extending into the peduncle typically arise from paramedian perforating branches of the basilar artery, and depending on which other structures are involved may produce a 'crossed' syndrome with ipsilateral cranial nerve signs and contralateral limb weakness.",img:[{f:"PMC4497994_12471_2015_717_Fig2_HTML.png",cap:"Transversal and sagittal views of the brain stem using T2-weighted magnetic resonance imaging. A left-sided brain stem infarction expands to the cerebral and cerebellar peduncle (arrows). A anterior, P posterior, R right, L left",src:"Arslan F et al., Netherlands heart journal : monthly journal of the Netherlands Society of Cardiology and the Netherlands Heart Foundation (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4497994",lic:"CC BY",alt:"Axial and sagittal T2 images of the brainstem with an arrow indicating an area of altered signal in the left side of the pons/midbrain extending toward the cerebral peduncle."}]},
{id:"i27",deck:"Imaging",tier:2,tags:["MRI","ischaemia"],q:"This patient has extensive, confluent white matter hyperintensity that notably involves the temporal lobes bilaterally. What inherited small vessel disease characteristically produces this distribution, and why is temporal lobe involvement a useful discriminator?",a:"<b>CADASIL</b> (Cerebral Autosomal Dominant Arteriopathy with Subcortical Infarcts and Leukoencephalopathy), caused by NOTCH3 mutations affecting small penetrating arteries.<br>The confluent periventricular and subcortical white matter change is nonspecific and overlaps with ordinary small vessel disease, but <b>anterior temporal lobe white matter involvement</b>, as seen here, is a relatively specific discriminating feature rarely seen in typical age-related small vessel disease.<br>CADASIL should be considered in younger patients presenting with recurrent lacunar-type strokes, migraine with aura, and progressive cognitive decline, especially with a family history.",img:[{f:"PMC4569596_13244_2015_421_Fig2_HTML.png",cap:"CADASIL. A 51-year-old female with left hand weakness, slurred speech and dysarthria with progressive cognitive decline. a &amp; b axial FLAIR and T2W images of brain demonstrate patchy confluent hyperintensities in periventricular (white dashed arrows) and subcortical white matter with typical involvement of temporal lobes (white arrow). c axial GRE image shows presence of microhaemorrhage in the subcortical…",src:"Patro SN et al., Insights into imaging (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4569596",lic:"CC BY",alt:"Multi-panel FLAIR/T2 and DWI/ADC set showing confluent white matter high signal in the periventricular and temporal lobe white matter bilaterally, plus a small focus of restricted"}]},
{id:"i28",deck:"Imaging",tier:2,tags:["MRI","ischaemia","mixed"],q:"The infarcts are in two separate, non-contiguous vascular territories on opposite sides of the brain. Given the CTA finding, what mechanism links a chest problem to this stroke pattern, and what does a 'multi-territory' pattern usually imply about the source?",a:"The CTA shows an <b>aortic dissection</b> (visible as a flap dividing true and false lumen) extending into the brachiocephalic trunk and left common carotid artery.<br>Infarcts in <b>multiple, non-contiguous arterial territories</b> - here right anterior circulation cortex and left basal ganglia - strongly suggest a <b>proximal embolic source</b> (cardiac or, as here, aortic) rather than isolated in-situ small vessel disease, because a single distal vessel occlusion cannot explain lesions on both sides of the brain.<br>This is why acute stroke of uncertain cause with a multi-territory pattern warrants imaging of the aortic arch and great vessels in addition to standard cardiac and carotid work-up.",img:[{f:"PMC4727643_Neurosciences-20-402-g001.png",cap:"Axial diffusion weighted MRI (DWI, b=1000 sec/mm2) A &amp; B) the brain and the corresponding apparent diffusion coefficient map (ADC map, insets in A &amp; B) show restricted diffusion (black and white arrows), suggestive of acute infarction, in the right frontal and parietal convexities and left basal ganglia. C) Computerized tomographic angiography of the aorta showing dissection involving the whole length of…",src:"Nandhagopal R., Neurosciences (Riyadh, Saudi Arabia) (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4727643",lic:"CC BY-NC-SA",alt:"Axial DWI/ADC panels showing separate foci of restricted diffusion in the right frontal/parietal cortex and in the left basal ganglia, together with a CT angiogram of the aorta sho"}]},
{id:"i29",deck:"Imaging",tier:2,tags:["MRI","ischaemia","mixed"],q:"Alongside the main occipital lesion, a separate focus of restricted diffusion is present in the splenium of the corpus callosum. Which artery supplies the splenium, and why does its involvement confirm the vascular territory of this stroke?",a:"The splenium of the corpus callosum is supplied by the <b>posterior pericallosal artery</b>, a branch of the <b>posterior cerebral artery (PCA)</b>.<br>Because the occipital infarct and the splenial infarct both lie within PCA branch territory, the combination confirms this is a genuine <b>PCA-territory stroke</b> rather than two unrelated lesions.<br>Splenial DWI lesions can also cause a distinctive alexia-without-agraphia syndrome when they interrupt callosal fibres connecting the visual cortex to the language-dominant hemisphere, particularly when combined with a left occipital infarct.",img:[{f:"PMC4899414_gr1.png",cap:"Axial noncontrast CT at presentation (A) shows a low attenuation infarct in the right occipital lobe (arrow). MRI demonstrates more extensive high signal areas on axial diffusion weighted images (B, D) and low signal areas on the corresponding apparent diffusion coefficient maps (C, E) consistent with diffusion restriction and acute infarcts. Infarction in the splenium of the corpus callosum (arrow, D) indicates…",src:"Liang LW et al., Gynecologic oncology reports (2016)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4899414",lic:"CC BY-NC-ND",alt:"A series of CT, DWI and ADC images demonstrating a low-attenuation/high-signal lesion in the right occipital lobe on the initial panels, with a further separate focus of restricted"}]},
{id:"i30",deck:"Imaging",tier:2,tags:["MRI","ischaemia"],q:"The lesion is visible on all three sequences: bright on FLAIR, bright on DWI, and dark on ADC. What does the combination of DWI and ADC findings confirm about the age of this infarct, and how does FLAIR positivity add to that timing?",a:"High signal on DWI with a corresponding low signal on the ADC map confirms true <b>restricted diffusion</b>, i.e. an acute ischaemic infarct with cytotoxic oedema, rather than T2 shine-through.<br>FLAIR typically only becomes positive roughly 6 hours or more after onset, so a lesion that is <b>both DWI-restricting and FLAIR-hyperintense</b>, as seen here, indicates the infarct is now more than a few hours old.<br>The large size and combined cortical/basal ganglia involvement suggest occlusion of a proximal vessel rather than a small perforator.",img:[{f:"PMC5039674_WJR-8-785-g001.png",cap:"Acute infarct. Axial FLAIR image (A) shows geographic hyperintensity involving right parieto-occipital region and basal ganglia. Diffusion weighted imaging shows restricted diffusion with high signal on b1000 image (B) and low signal intensity on apparent diffusion coefficient map (C).",src:"Baliyan V et al., World journal of radiology (2016)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5039674",lic:"CC BY-NC",alt:"Axial FLAIR, DWI and ADC images showing a large geographic area of abnormal signal - hyperintense on FLAIR, markedly hyperintense on DWI, and correspondingly hypointense on ADC - i"}]},
{id:"i31",deck:"Imaging",tier:2,tags:["MRI","ischaemia"],q:"This large area of restricted diffusion occupies most of one cerebral hemisphere and is causing midline shift. Which vessel occlusion typically produces an infarct of this size, and what is the major early complication to anticipate?",a:"An infarct of this size, involving most of one hemisphere with mass effect, typically reflects occlusion of the <b>proximal (M1) middle cerebral artery</b>, sometimes with poor collateral flow from the anterior or posterior circulation.<br>The visible effacement of the ventricle and midline shift indicate early <b>cerebral oedema</b>, and large infarcts like this carry a high risk of progressing to <b>malignant MCA syndrome</b> with raised intracranial pressure and herniation.<br>Patients with this pattern need close neurological monitoring, and in selected younger patients with deteriorating conscious level, decompressive hemicraniectomy is considered within a defined time window.",img:[{f:"PMC5402510_JNRP-8-303-g001.png",cap:"Magnetic resonance imaging with diffusion-weighted imaging showing large acute infarcts in left middle cerebral artery territory involving left basal ganglia, including insula, left temporal lobe, left parietal lobe and left posterior frontal lobe with effacement of underlying sulci, and mild contralateral midline shift",src:"Shambhavi et al., Journal of neurosciences in rural practice (2017)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5402510",lic:"CC BY-NC-SA",alt:"Single axial DWI image showing a large, well-demarcated area of high signal occupying most of the left cerebral hemisphere, with associated effacement of the adjacent ventricle and"}]},
{id:"i32",deck:"Imaging",tier:2,tags:["occlusion","DSA"],q:"This frontal catheter angiogram shows contrast opacifying a branching network of vessels, but a single trunk ends abruptly at the arrow. Which artery is occluded, and how can you tell the branching vessels above it aren't simply the ICA?",a:"<b>Internal carotid artery (ICA) occlusion</b> at its origin.<br>The contrast column tapers to a smooth, rounded 'stump' at the arrow and does not continue cranially, while the vessels branching normally above are <b>external carotid artery (ECA) branches</b> (facial, lingual, maxillary) &mdash; the cervical ICA gives off no early branches, so any early branching seen must be ECA.<ul><li>An abrupt convex stump favours thrombotic occlusion over congenital hypoplasia, which tapers gradually</li><li>Preserved ECA flow is relevant to potential collateral supply via ophthalmic/pial anastomoses</li></ul>",img:[{f:"PMC3088377_wjem12_1p0067f16.png",cap:"Internal carotid artery occlusion. Frontal projection from left cerebral angiogram delineates complete occlusion of the left internal carotid artery to the level of the common carotid artery (arrow). Note the normal opacification of the external carotid artery branches.",src:"Birenbaum D et al., The western journal of emergency medicine (2011)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3088377",lic:"CC BY-NC",alt:"Frontal catheter angiogram in which the external carotid artery branches opacify normally while the internal carotid artery ends abruptly in a smooth, rounded stump at the arrow wi"}]},
{id:"i33",deck:"Imaging",tier:2,tags:["occlusion","CTA"],q:"Both common carotid arteries show narrowing on this CTA, one focal (green arrow) and one near-occlusive (red arrow). What pattern of disease does bilateral CCA narrowing away from the bulb raise concern for, and why does that distinction matter for management?",a:"<b>Bilateral large-vessel narrowing</b> raises suspicion for an inflammatory large-vessel vasculitis (e.g. <b>Takayasu arteritis</b>) rather than typical atherosclerosis, which is usually focal, asymmetric, and centred at the carotid bulb in an older patient.<br>Smooth, bilateral CCA narrowing away from the bulb suggests a diffuse arteriopathy affecting the vessel wall circumferentially rather than a single plaque.<ul><li>Management differs: immunosuppression and serial imaging for vasculitis versus antiplatelets/statins &plusmn; endarterectomy for atherosclerosis</li></ul>",img:[{f:"PMC4976603_gr1.png",cap:"Computed tomography angiography (CTA), coronal view demonstrated focal stenosis in the right common carotid artery (CCA) (Green arrow) and near occlusion of the proximal left CCA. (Red arrow) (A). Axial view shows focal stenosis in the right internal carotid artery (ICA) (Black hollow arrow) (B).",src:"Hinojosa CA et al., International journal of surgery case reports (2016)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4976603",lic:"CC BY-NC-ND",alt:"Coronal CT angiogram showing narrowing of the right common carotid artery and near-complete narrowing of the left common carotid artery, plus an axial slice showing narrowing of th"}]},
{id:"i34",deck:"Imaging",tier:2,tags:["occlusion","mixed"],q:"The 3D CT angiogram shows a narrowed carotid segment, and the black-blood T1 MRI at the same level shows a bright focus within the vessel wall. What does that bright T1 signal represent, and why does it matter more than the percentage stenosis alone?",a:"The high T1 signal within the wall represents <b>intraplaque haemorrhage</b>, a feature of an <b>unstable ('vulnerable') plaque</b>.<br>Plaques with intraplaque haemorrhage carry a higher embolic stroke risk than the degree of luminal narrowing alone predicts, because the friable cap is prone to rupture.<ul><li>Vessel-wall imaging is increasingly used alongside luminal stenosis measurement when deciding on carotid intervention, especially in borderline (50&ndash;69%) stenosis</li></ul>",img:[{f:"PMC5334292_JDI-8-134-g002.png",cap:"Extracranial carotid artery disease. A 75‐year‐old man with symptomatic carotid artery stenosis. (a,b) Reconstructed computed tomography angiography and 3‐D computed tomography angiography show severe stenosis of the left internal carotid artery (arrows). (c) Unstable plaque is visualized as a hyperintense signal on axial fat‐suppressed black‐blood T1‐weighted image (arrow).",src:"Umemura T et al., Journal of diabetes investigation (2017)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5334292",lic:"CC BY-NC",alt:"A 3D CT angiography reconstruction showing a narrowed segment of the internal carotid artery at its origin, alongside an axial fat-suppressed black-blood T1 MRI slice showing a foc"}]},
{id:"i35",deck:"Imaging",tier:2,tags:["occlusion","MRI"],q:"This FLAIR image shows near-complete hyperintensity of one entire cerebral hemisphere with effaced sulci. What level of arterial occlusion produces a territorial infarct this large, and what does that imply about risk of complications?",a:"A lesion this extensive &mdash; spanning essentially the whole right MCA (and adjacent ACA) territory &mdash; implies occlusion of a <b>proximal large vessel</b>, such as the <b>distal ICA or M1 segment of the MCA</b>, rather than an isolated distal branch.<br>Hemisphere-filling infarcts like this carry a substantial risk of <b>malignant oedema</b> with midline shift, sometimes requiring decompressive hemicraniectomy.<ul><li>Matching infarct size/topography to occlusion level is a core way to infer 'where' the vessel lesion is from tissue imaging alone</li></ul>",img:[{f:"PMC2833309_CRM2010-407538.002.png",cap:"Axial fluid-attenuated inversion recovery magnetic resonance image showing cerebral infarction in the right cerebral hemisphere.",src:"Tamaki T et al., Case reports in medicine (2010)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2833309",lic:"CC BY",alt:"Axial FLAIR MRI showing extensive cortical and subcortical hyperintensity throughout essentially the entire right cerebral hemisphere, with loss of normal grey-white differentiatio"}]},
{id:"i36",deck:"Imaging",tier:2,tags:["occlusion","CTA"],q:"On this CTA maximum-intensity projection, the left M1 segment looks irregular and there are far fewer opacified small vessels over the left hemisphere than the right. What does the reduced number of visible distal branches tell you, beyond simply confirming the M1 lesion?",a:"The paucity of opacified distal cortical branches on the affected side reflects <b>reduced pial/leptomeningeal collateral flow</b> distal to the M1 lesion, not just the M1 abnormality itself.<br>This 'branch pruning' pattern on single-phase CTA is used as a rough marker of collateral status: fewer visible branches correlate with faster infarct growth and a smaller salvageable penumbra, which matters for thrombectomy urgency.<ul><li>Irregular rather than smoothly tapered M1 narrowing favours atherothrombotic or thromboembolic disease over a hypoplastic vessel variant</li></ul>",img:[{f:"PMC3271474_AIAN-14-304-g003.png",cap:"CT angiography at circle of Willis showing irregular narrowing of M1 portion of left middle cerebral artery (arrows) with decreased filling of left sided cortical vessels (arrowheads). Left posterior cerebral artery was normal",src:"Vidhate M et al., Annals of Indian Academy of Neurology (2011)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3271474",lic:"CC BY-NC-SA",alt:"CT angiogram maximum intensity projection at the circle of Willis showing irregular narrowing of the left M1 segment (arrows) with a visible paucity of opacified small cortical bra"}]},
{id:"i37",deck:"Imaging",tier:2,tags:["occlusion","CTA"],q:"This volume-rendered CTA marks two diameters, a and b, with the NASCET formula 100×(a−b)/a shown. Why is 'b' measured in the normal cervical ICA well beyond the bulb, rather than at the carotid bulb itself, which is often wider?",a:"NASCET deliberately uses the <b>normal, non-dilated cervical ICA distal to the bulb</b> as the denominator, because the bulb is a normal focal dilation &mdash; using it as the reference would systematically <b>underestimate</b> the true percentage stenosis.<br>Comparing the diseased segment's narrowest diameter (a) with the normal distal calibre (b) gives a reproducible measure that matches the trial evidence supporting endarterectomy at &ge;70% (and 50&ndash;69% with caveats).<ul><li>This differs from the older ECST method, which used the estimated original bulb diameter as the denominator, giving higher percentage values for the same lesion</li></ul>",img:[{f:"PMC3346995_IJVM2012-928638.001.png",cap:"Volume rendering CT angiography showing measurement of internal carotid artery stenosis. Following the NASCET criteria, a measure of the ratio at the point of greatest stenosis (small white arrow) and at the normal part of the artery beyond the carotid bulb (big white arrow) was performed.",src:"Stefanini M et al., International journal of vascular medicine (2012)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3346995",lic:"CC BY",alt:"Volume-rendered CT angiogram of the carotid bifurcation with two labelled diameter measurements, 'a' at the point of maximal stenosis and 'b' in the normal-calibre distal cervical"}]},
{id:"i38",deck:"Imaging",tier:2,tags:["occlusion","mixed"],q:"The same long-segment ICA narrowing is shown on CTA (A) and MRA (B). Why might the MRA make a stenosis look more severe than it really is, or even mimic occlusion, compared with the CTA?",a:"Time-of-flight MRA depends on <b>inflowing blood signal</b>, so slow or turbulent flow through a tight or long stenosis can cause signal dropout that <b>overestimates</b> the narrowing or falsely suggests occlusion.<br>CTA instead directly opacifies the lumen with iodinated contrast regardless of flow velocity, so it more reliably shows the true residual lumen &mdash; which is why CTA or catheter angiography is used to confirm a possible occlusion suggested on MRA before committing to treatment.<ul><li>This flow-related pitfall is a classic reason MRA and CTA/DSA findings can appear discordant</li></ul>",img:[{f:"PMC3714059_JCHIMP-2-18645-g003.png",cap:"The long segment of stenosis, but not occlusion, of the left internal carotid artery (short arrows) is more definitively demonstrated on CT angiography (A) on a sagittal maximum intensity projection than on MR angiography (B) on coronal maximum intensity projection.",src:"Mozayan M et al., Journal of community hospital internal medicine perspectives (2012)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3714059",lic:"CC BY",alt:"Panel A is a sagittal CT angiogram MIP showing a long segment of smooth luminal narrowing of the cervical internal carotid artery; panel B is a coronal MR angiogram of the same ves"}]},
{id:"i39",deck:"Imaging",tier:2,tags:["occlusion","MRA"],q:"One internal carotid artery is large and tortuous on this MRA, while the other side is simply not seen above the neck. What single process best explains both findings together?",a:"<b>Chronic occlusion of one internal carotid artery</b> (the side not seen) drives compensatory increased flow through the circle of Willis and the contralateral, patent ICA, which dilates and becomes tortuous over time &mdash; sometimes developing flow-related aneurysms, as implied here.<br>A 'normal-looking but big' vessel next to a 'missing' vessel is not two independent findings but one haemodynamic story: the patent side is doing double duty.<ul><li>This asymmetric remodelling is also part of the spectrum of moyamoya-type occlusive disease, where flow-related aneurysms on dilated collateral pathways are a recognised complication</li></ul>",img:[{f:"PMC4251022_AIAN-17-444-g003.png",cap:"Magnetic resonance (MR) angiography of circle of willis showing right ICA supraclinoid segment dilatation. Left ICA occlusion in supraclinoid segment with diffuse narrowing. A1 segment of right ACA is dilated with a tiny aneurysm from medial lenticulostriate branch",src:"Garge SS et al., Annals of Indian Academy of Neurology (2014)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4251022",lic:"CC BY-NC-SA",alt:"MR angiogram maximum intensity projection of the circle of Willis showing one internal carotid artery as a large, tortuous, well-opacified vessel, while the contralateral internal"}]},
{id:"i40",deck:"Imaging",tier:2,tags:["occlusion","MRI"],q:"The diffusion restriction here spans cortex supplied by more than one named cerebral artery territory on the same side. What level of occlusion does a multi-territory infarct pattern like this suggest, compared with an infarct confined to a single vascular territory?",a:"An infarct crossing the boundary between the <b>MCA and ACA territories</b> on one side points to occlusion <b>proximal to their bifurcation</b> &mdash; typically the <b>distal internal carotid artery ('T' occlusion)</b> &mdash; rather than an isolated M2/M3 branch occlusion, which would respect a single territory.<br>Multi-territory involvement also raises the differential of embolic showering (e.g. cardioembolic source) and predicts a larger ischaemic core with worse expected outcome without rapid recanalisation.<ul><li>Matching infarct topography to vascular territory is a way to localise the occlusion level from tissue imaging alone</li></ul>",img:[{f:"PMC4338405_CRIEM2015-503871.001.png",cap:"Diffusion-weighted imaging (a) and fluid-attenuated inversion recovery imaging (b) MRI of the patient, showing cytotoxic oedema in the right middle cerebral artery and anterior cerebral artery territories (plain arrows) and cSAH (discontinued arrow).",src:"Yger M et al., Case reports in emergency medicine (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4338405",lic:"CC BY",alt:"Panel (a) is a diffusion-weighted MRI showing bright signal spanning right frontal and parietal cortex/subcortical white matter across more than one single-branch vascular territor"}]},
{id:"i41",deck:"Imaging",tier:2,tags:["occlusion","mixed"],q:"In panel A, instead of two clean internal carotid arteries, there are bilateral tangles of fine, tortuous vessels near the skull base. What is this angiographic pattern called, and what does its bilaterality imply compared with a single occluded vessel?",a:"This is the classic <b>'puff of smoke' (moyamoya) collateral network</b> &mdash; a fine tangle of enlarged lenticulostriate and thalamoperforator collaterals that develops to bypass progressive distal ICA stenosis/occlusion.<br>Because both sides are affected rather than one focal vessel, this favours a bilateral steno-occlusive arteriopathy (moyamoya disease, or moyamoya syndrome if secondary to sickle cell disease, NF1, or cranial irradiation) rather than a single embolic occlusion.<ul><li>Absent normal, smooth bilateral ICA flow signal, replaced by this collateral 'smoke', is the key differentiator from a unilateral large-vessel occlusion</li></ul>",img:[{f:"PMC4369969_omu00601.png",cap:"(A) An MRA of the head revealing occlusions of bilateral distal ICAs and presence of moyamoya vessels. (B) Axial MRI image of the spine showing intramedullary T2-hyperintense signals.",src:"Chan NH et al., Oxford medical case reports (2014)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4369969",lic:"CC BY-NC",alt:"Panel (A) is an axial MR angiogram at the skull base showing bilateral irregular tangles of fine, tortuous collateral vessels clustered where the distal internal carotid arteries s"}]},
{id:"i42",deck:"Imaging",tier:2,tags:["occlusion","MRA"],q:"This patient had three MRAs over about a month. The vessels look near-normal on day 1, show multifocal segmental narrowing by day 9, then largely normalise by day 27. What diagnosis does this specific time-course point to, and how does it distinguish this from CNS vasculitis?",a:"This trajectory &mdash; rapid worsening over days followed by <b>spontaneous resolution within about a month</b> &mdash; is characteristic of <b>reversible cerebral vasoconstriction syndrome (RCVS)</b>.<br>The multifocal 'string of beads' pattern of alternating narrowing and normal calibre can look identical to vasculitis on a single study, but true CNS vasculitis typically <b>persists or progresses</b> over this timeframe rather than reversing &mdash; so serial imaging showing reversibility, not the single-timepoint appearance, is the key discriminator.<ul><li>RCVS is classically triggered by thunderclap headache, vasoactive drugs, or the postpartum period, and is managed with trigger removal &plusmn; calcium-channel blockers rather than immunosuppression</li></ul>",img:[{f:"PMC5388008_bcr2017219319f02.png",cap:"(A) The magnetic resonance angiography (MRA) on admission shows mild segmental stenotic changes in the right posterior cerebral artery (PCA) (arrow). (B) The MRA on day 9 shows the findings of systemic constriction, which are particularly prominent in the right middle cerebral artery and left PCA (arrow). (C) The MRA on day 27 shows improvement in the constriction findings.",src:"Chiba Y et al., BMJ case reports (2017)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5388008",lic:"CC BY-NC",alt:"Three serial MR angiograms of the same patient: an early study with mild focal narrowing of one posterior artery, a follow-up nine days later showing multiple segmental areas of na"}]},
{id:"i43",deck:"Imaging",tier:2,tags:["occlusion","mixed"],q:"This four-part figure shows a basilar occlusion at CTA and DSA, recanalisation after thrombectomy, and a DWI scan. Given that panel (c) shows successful recanalisation of the basilar artery, why does panel (d) still show bilateral DWI restriction?",a:"Successful <b>recanalisation</b> restores flow through the basilar artery but does not reverse tissue that has already infarcted, and does not guarantee every small perforating branch supplying the pons was salvaged &mdash; basilar occlusion has a very narrow window because the pons has little collateral supply.<br>The bilateral pontine/cerebellar DWI change reflects the <b>core infarct that had already occurred</b> in perforator territory before or during recanalisation, illustrating why 'time is brainstem'.<ul><li>Angiographic success (TICI grade) and clinical/imaging outcome are two separate things to assess</li></ul>",img:[{f:"PMC5425764_cee-0007-0072-g04.png",cap:"Traumatic basilar artery (BA) occlusion treated with mechanical thrombectomy. a CTA demonstrating thrombosis of the BA (arrow). b Anteroposterior DSA demonstrating BA occlusion (arrow). c Recanalization of the BA following mechanical thrombectomy. d DWI sequence demonstrating acute ischemic stroke.",src:"Foreman PM et al., Cerebrovascular diseases extra (2017)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5425764",lic:"CC BY-NC-ND",alt:"(a) Coronal CT angiogram showing an abrupt cut-off of contrast in the basilar artery; (b) frontal catheter angiogram confirming the same basilar occlusion with no contrast passing"}]},
{id:"i44",deck:"Imaging",tier:2,tags:["occlusion","DSA"],q:"Compared with a pre-treatment angiogram showing an occluded carotid terminus with no distal filling, what specific features on this post-thrombectomy image confirm a good angiographic result?",a:"This image shows <b>full, symmetric opacification of both anterior and middle cerebral artery branches</b> arising from the internal carotid terminus, with a smooth, patent-looking terminus and no residual filling defect or abrupt cut-off.<br>That combination &mdash; normal terminus contour plus complete distal branch filling &mdash; defines a <b>TICI 3 (complete reperfusion)</b> result, the best achievable angiographic outcome after mechanical thrombectomy.<ul><li>Contrast this with partial results (TICI 2a/2b), where some branches remain unfilled or filling is delayed despite the main trunk being open</li></ul>",img:[{f:"PMC5426822_cureus-0009-00000001150-i05.png",cap:"Post thrombectomy left carotid angiogram showing complete recanalization of the left carotid terminus (arrow) and normal flow in the left ACA and MCA branches.ACA - anterior cerebral artery; MCA - middle cerebral artery.",src:"Haider AS et al., Cureus (2017)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5426822",lic:"CC BY",alt:"Frontal catheter angiogram showing the internal carotid artery terminus with brisk, symmetric opacification of both anterior and middle cerebral artery branches and no filling defe"}]},
{id:"i45",deck:"Imaging",tier:2,tags:["occlusion","DSA"],q:"This catheter angiogram lacks the normal smooth outline of the major circle-of-Willis vessels, replaced instead by a fine net of small tortuous collaterals, magnified in the inset. Why is catheter angiography still considered the reference standard for staging this appearance, rather than MRA or CTA?",a:"Catheter (digital subtraction) angiography has the highest spatial and temporal resolution of the available techniques, so it resolves the very fine, low-flow collateral vessels of the <b>moyamoya 'puff of smoke' network</b> better than MRA or CTA, which may under-represent how extensive the collateralisation is.<br>This matters clinically because catheter angiography is used to formally <b>stage</b> moyamoya disease (e.g. Suzuki staging), tracking ICA stenosis progression against basal and pial collateral recruitment.<ul><li>Staging information guides timing of revascularisation surgery (e.g. STA-MCA bypass)</li></ul>",img:[{f:"PMC2678270_1471-2377-9-15-1.png",cap:"Magnetic Resonance Angiogram showing bilateral stenosis suggestive of Moya Moya Disease.",src:"Shoukat S et al., BMC neurology (2009)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2678270",lic:"CC BY",alt:"Catheter angiogram showing multiple abnormally fine, tangled collateral vessels around the base of the brain in place of the normal smooth major arterial trunks, with an inset magn"}]},
{id:"i46",deck:"Imaging",tier:2,tags:["occlusion","DSA"],q:"There's no arrow on this angiogram, yet the diagnosis is inferable from the vessel pattern alone. What two features together make this recognisable as moyamoya rather than a single focal MCA stenosis?",a:"The combination of <b>narrowing at the terminal ICA/proximal MCA</b> together with a <b>dense basal collateral network replacing the normal single MCA trunk</b> distinguishes moyamoya from a simple focal stenosis, which would show one narrowed segment feeding a normal, sparse branching pattern beyond it.<br>A solitary MCA stenosis from atherosclerosis or dissection does not recruit this degree of fine basal collateralisation; the collateral 'blush' only develops when steno-occlusive disease is chronic, progressive, and typically bilateral, as in moyamoya.<ul><li>Recognising the overall pattern, not just the stenosis, is the exam-relevant skill here</li></ul>",img:[{f:"PMC2678270_1471-2377-9-15-2.png",cap:"Angiogram showing stenosis of the supraclinoid ICA and MCA consistent with Moya Moya Disease.",src:"Shoukat S et al., BMC neurology (2009)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2678270",lic:"CC BY",alt:"Lateral catheter angiogram showing narrowing of the supraclinoid internal carotid artery and proximal middle cerebral artery, with a dense tangle of small collateral vessels at the"}]},
{id:"i47",deck:"Imaging",tier:2,tags:["occlusion","CTA"],q:"The narrowed left common carotid artery here shows smooth, circumferential wall thickening along a long segment rather than a short, eccentric plaque. Why does that distinction matter for the differential diagnosis, especially in a young patient?",a:"Smooth, <b>circumferential, long-segment</b> wall thickening reflects a process affecting the <b>entire vessel wall</b>, typical of <b>large-vessel vasculitis such as Takayasu arteritis</b> &mdash; whereas atherosclerotic disease produces focal, eccentric, often calcified plaque concentrated at branch points such as the carotid bulb.<br>In a young patient, long-segment circumferential CCA narrowing should prompt work-up for vasculitis (inflammatory markers, other vascular territories, imaging/biopsy where appropriate) rather than assuming premature atherosclerosis.<ul><li>Takayasu characteristically affects the aorta and its major branches including the carotids, often in young women</li></ul>",img:[{f:"PMC2918613_1546-0096-8-21-1.png",cap:"Cervical CT angiography shows regular thickening of the left common carotid artery and left external carotid stenosis.",src:"Gargah T et al., Pediatric rheumatology online journal (2010)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2918613",lic:"CC BY",alt:"Coronal CT angiogram of the neck showing circumferential wall thickening and luminal narrowing of the left common carotid artery over a long segment, with the contralateral right c"}]},
{id:"i48",deck:"Imaging",tier:2,tags:["haemorrhage","mixed"],q:"This is a brainstem haemorrhage that has ruptured into the fourth ventricle. On the GRE image (D) the blood in the occipital horn shows a horizontal layered appearance rather than uniform dark signal. What does this layering represent, and why does it matter clinically?",a:"<b>A blood-CSF fluid level (haematocrit effect)</b>, formed when red cells settle under gravity within CSF that is not yet clotted or organised.<br>It typically means the intraventricular blood is fresh/unclotted or that there is ongoing slow bleeding, and it is more often seen with coagulopathy or anticoagulation.<br>Recognising this layered sign on axial imaging should prompt urgent correction of any coagulopathy and close monitoring for hydrocephalus, since free-flowing blood can obstruct CSF pathways.",img:[{f:"PMC2854924_jcn-1-177-g002.png",cap:"Brain images of the patient at admission. Brain CT (A, B) and T2*-weighted GRE MRI (C, D) showed hemorrhage in the left dorsal medulla, which ruptured the dorsal medulla and extended into the fourth ventricle (arrow). The layered blood-CSF pattern of the intraventricular hemorrhage was due to backward flow of blood into the occipital horn of the left lateral ventricle (D) (arrowhead).",src:"Kwon HM et al., Journal of clinical neurology (Seoul, Korea) (2005)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2854924",lic:"CC BY-NC",alt:"CT (A,B) at posterior fossa level with a subtle marker near the dorsal medulla/fourth ventricle, and GRE MRI (C,D) showing dark susceptibility signal within the fourth ventricle wi"}]},
{id:"i49",deck:"Imaging",tier:2,tags:["haemorrhage","mixed"],q:"All four panels are from the same patient. What single underlying small-vessel disease explains a lobar haemorrhage, cortical microbleeds, superficial siderosis and posterior white matter change occurring together, and how does the microbleed distribution point away from hypertensive angiopathy?",a:"<b>Cerebral amyloid angiopathy (CAA)</b>.<br>The key discriminator is <b>location</b>: CAA deposits amyloid in cortical and leptomeningeal vessels, so haemorrhages and microbleeds cluster in a <b>lobar/cortical</b> distribution (as shown here), whereas hypertensive microangiopathy produces microbleeds in the <b>deep grey structures</b> (basal ganglia, thalamus, pons).<br>Superficial siderosis (blood tracking along sulci) is a further CAA-specific feature not seen with hypertensive disease.<br>Together these findings support CAA rather than hypertension as the cause of this patient's lobar bleed.",img:[{f:"PMC4325636_jos-17-17-g004.png",cap:"Imaging findings of CAA-related hemorrhages and white matter lesions. Fresh (arrow) and old (arrowhead) lobar macrohemorrhages in the frontal lobes on CT (A). Cortical microhemorrhages with lobar distribution (B) and focal subarachnoid hemorrhages (superficial siderosis) (C) on gradient echo T2*-weighted MRI. Posterior distribution of white matter hyperintensities (arrows on T2-weighted MRI) (D).",src:"Yamada M., Journal of stroke (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4325636",lic:"CC BY-NC",alt:"A) colour-processed CT with a hyperdense frontal lobe lesion; B) GRE MRI with several small dark punctate foci scattered through the cortex/subcortical white matter (microbleeds);"}]},
{id:"i50",deck:"Imaging",tier:2,tags:["haemorrhage","CT"],q:"Looking across these six axial slices, the ventricular system is both filled with hyperdense material and enlarged. What two separate processes does this combination indicate, and why would a clinician need both pieces of information before deciding on treatment?",a:"<b>Intraventricular haemorrhage (IVH)</b> — the hyperdense material casting the ventricles — <b>plus obstructive hydrocephalus</b>, shown by the dilated ventricular size.<br>IVH itself can obstruct CSF flow at the third ventricle, aqueduct or fourth ventricle, so the hydrocephalus here is a direct mechanical consequence of the clot rather than a separate disease process.<br>This combination is an indication for external ventricular drainage (EVD) to relieve pressure, in addition to managing the underlying source of bleeding (commonly a thalamic or basal ganglia haemorrhage extending into the ventricle).",img:[{f:"PMC1780056_1471-2377-7-1-1.png",cap:"Pre operative CT scan. Representative pre-operative CT scan of a patient showing a thalamic haemorrhage with associated hydrocephalus and blood in the third and both lateral ventricles.",src:"Yadav YR et al., BMC neurology (2007)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC1780056",lic:"CC BY",alt:"Six sequential axial CT images at different ventricular levels, each showing bright (hyperdense) material filling and expanding the lateral and third ventricles, which are dilated."}]},
{id:"i51",deck:"Imaging",tier:2,tags:["haemorrhage","CT"],q:"This haemorrhage sits within the parietal lobe rather than the basal ganglia or thalamus. In an older patient without a strong hypertension history, what does a purely lobar location suggest about the likely underlying vasculopathy, and what imaging follow-up would you specifically look for to support that diagnosis?",a:"A <b>lobar</b> location raises <b>cerebral amyloid angiopathy (CAA)</b> as the leading alternative to hypertensive small-vessel disease, which instead favours deep structures (basal ganglia, thalamus, pons, cerebellum).<br>To support CAA you would look for<ul><li>multiple lobar cerebral microbleeds on GRE/SWI</li><li>cortical superficial siderosis</li><li>absence of deep/basal ganglia microbleeds</li></ul>Confirming a lobar-predominant pattern changes management priorities (for example, more caution with anticoagulation) compared with a purely hypertensive deep bleed.",img:[{f:"PMC3122986_JNRP-2-87-g002.png",cap:"Plain axial CT image reveals large, right parietal lobe hematoma causing mild compression of posterior part of the body of ipsilateral lateral ventricle; and diffuse white matter hypodensities (leukoaraiosis)",src:"Bano S et al., Journal of neurosciences in rural practice (2011)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3122986",lic:"CC BY-NC-SA",alt:"Axial CT (right panel) showing a large, well-defined hyperdense mass in the right parietal lobe with mild compression of the adjacent lateral ventricle; a comparison slice (left pa"}]},
{id:"i52",deck:"Imaging",tier:2,tags:["haemorrhage","CT"],q:"A patient presents with thunderclap headache. The scan shows a rounded hyperdense suprasellar lesion rather than diffuse hyperdensity outlining the basal cisterns as you would expect with a ruptured aneurysm. What diagnosis does the discrete, mass-like shape of the hyperdensity suggest, and how does it change the initial work-up compared with typical aneurysmal SAH?",a:"<b>Pituitary apoplexy</b> — haemorrhage or infarction into a pituitary adenoma — should be suspected when the hyperdense blood is confined to a discrete suprasellar mass rather than spread diffusely through the cisterns and sulci as in aneurysmal SAH.<br>Recognising this pattern matters because work-up shifts towards urgent pituitary MRI, visual field/acuity assessment (chiasmal compression) and endocrine evaluation (particularly cortisol) for acute adrenal insufficiency, rather than straight to catheter angiography for an aneurysm.",img:[{f:"PMC3229812_SNI-2-169-g001.png",cap:"Non-contrast, axial CT image of the head demonstrating a 1.6-cm hyperdense suprasellar mass, and a small amount of subarachnoid hemorrhage extending into the sylvian and intrahemispheric fissures",src:"Bonfield CM et al., Surgical neurology international (2011)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3229812",lic:"CC BY-NC-SA",alt:"Single axial non-contrast CT showing a rounded, well-circumscribed hyperdense lesion in the suprasellar region, without diffuse hyperdensity outlining the surrounding cisterns."}]},
{id:"i53",deck:"Imaging",tier:2,tags:["haemorrhage","mixed"],q:"The small dark focus on the SWI image (d) is a haemorrhagic lesion in the thalamus. Given the sagittal sinus thrombosis demonstrated in panels a and b, why is a thalamic haemorrhage in this context mechanistically different from a typical hypertensive thalamic bleed, and what does that imply about the vessel territory involved?",a:"This is a <b>haemorrhagic venous infarct</b>, not a hypertensive arterial bleed.<br>Thrombosis of the sagittal sinus (seen as absent flow on the venogram) impairs venous drainage, most relevantly here via the <b>internal cerebral vein</b>, causing venous congestion, infarction and secondary haemorrhage in the thalamus it drains.<br>The clue is the <b>combination</b> of confirmed sinus thrombosis plus a haemorrhage that doesn't fit a classic arterial (lenticulostriate) hypertensive distribution — this pairing should always trigger a search for venous thrombosis rather than assuming a primary hypertensive bleed.",img:[{f:"PMC3259351_13244_2011_86_Fig6_HTML.png",cap:"Epileptic seizures and sagittal sinus thrombosis in a 3-year-old child. a Sagittal T1-weighted image demonstrates hyperintensity of the posterior third of the sagittal sinus (open arrow). b MR venography confirms the thrombosis of the posterior third of the sagittal sinus ending at the torcular (open arrow). c DWI, b = 1,000 image demonstrates a right occipital acute ischaemic lesion. d SWI minIP shows a right…",src:"Gasparotti R et al., Insights into imaging (2011)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3259351",lic:"CC BY",alt:"a) sagittal T1 with increased signal along the posterior superior sagittal sinus; b) MR venogram showing loss of flow signal in the posterior sinus; c) diffusion-weighted image wit"}]},
{id:"i54",deck:"Imaging",tier:2,tags:["haemorrhage","CT"],q:"This is a cerebellar haematoma. Beyond simply identifying the bleed, what two structures must you specifically assess on this image before deciding whether the patient needs urgent posterior fossa decompression?",a:"You must assess <b>brainstem extension/compression</b> and the <b>fourth ventricle</b> (for effacement or resulting obstructive hydrocephalus).<br>Cerebellar haemorrhages are managed surgically when they are large (typically >3 cm), compress the brainstem, or cause hydrocephalus — because the posterior fossa has little room to accommodate mass effect before brainstem herniation occurs.<br>Here the haemorrhage extends toward the middle cerebellar peduncle but does not clearly involve the brainstem or cerebellopontine cistern, which is exactly the distinction that determines urgency of surgical referral.",img:[{f:"PMC3277069_AJNS-6-123-g001.png",cap:"Axial plain CT brain demonstrating evidence of hyperdensity (60 HU suggestive of blood products) involving the left cerebellar hemisphere extending into the left middle cerebellar peduncle. There is no extension into the brainstem or cerebellopontine cistern",src:"Nayak N et al., Asian journal of neurosurgery (2011)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3277069",lic:"CC BY-NC-SA",alt:"Single axial CT showing a large, well-defined hyperdense haematoma occupying the left cerebellar hemisphere and extending toward the middle cerebellar peduncle, with the fourth ven"}]},
{id:"i55",deck:"Imaging",tier:2,tags:["haemorrhage","CT"],q:"One lateral ventricle is bright/hyperdense while the other looks normal. What does the asymmetric hyperdensity confined to the ventricular system represent, and what is the single most important next step in this patient's imaging work-up?",a:"<b>Intraventricular haemorrhage (IVH)</b> confined to the right lateral ventricle — acute blood is hyperdense on CT, exactly like the appearance seen here.<br>Isolated IVH without an obvious adjacent parenchymal haematoma should prompt a search for an underlying source such as a periventricular AVM, aneurysm, or intraventricular tumour, so the essential next step is vascular imaging (CT or MR angiography, or catheter angiography) rather than assuming a primary hypertensive bleed.",img:[{f:"PMC3299077_AIAN-15-60-g001.png",cap:"CT scan of head showing intraventricular hemorrhage in right lateral ventricle",src:"Patra S et al., Annals of Indian Academy of Neurology (2012)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3299077",lic:"CC BY-NC-SA",alt:"Single axial CT showing hyperdense (bright) material filling the right lateral ventricle (frontal horn/body) with the left ventricle appearing unaffected."}]},
{id:"i56",deck:"Imaging",tier:2,tags:["haemorrhage","mixed"],q:"The CT in panel A shows a small area of increased density next to the pons that looks like it could be a pontine haemorrhage. Panels C and D show a large vascular abnormality in the same region. What should the shape and location of the CTA finding make you reconsider about the CT appearance, and why is this distinction clinically important?",a:"The angiographic images demonstrate a <b>giant basilar artery aneurysm</b> abutting the pons, which can produce a rounded, mass-like area of increased density on plain CT that mimics a spontaneous pontine haemorrhage.<br>This matters because true hypertensive pontine haemorrhage is managed medically, whereas a giant aneurysm requires urgent vascular work-up and a completely different treatment pathway (endovascular or surgical).<br>The lesson is that any atypical, well-circumscribed or mass-like brainstem hyperdensity should prompt CTA/MRA before it is accepted as a straightforward hypertensive bleed.",img:[{f:"PMC3814923_f1000research-2-1265-g0000.png",cap:"(A) CT scan of the brain showing an area of high density in the front of the pons (arrow) similar to a pontine hemorrhage. (B) Brain MRI revealed acute brainstem infarction (arrow). (C,D) CT angiography of the head showed a giant aneurysm of the basilar artery (27 mm by 10 mm) (arrow).",src:"Yu YP et al., F1000Research (2013)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3814923",lic:"CC BY",alt:"A) axial CT at the level of the pons with a subtle area of increased density anterolateral to the pons; B) axial MRI at a similar level; C) an angiographic reconstruction with a ro"}]},
