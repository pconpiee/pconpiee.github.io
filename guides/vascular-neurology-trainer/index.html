/* Build the Anki import file from the same arrays the app studies from, so the deck can
   never drift out of sync with the cards on screen. */
const ANKI_DECKS={Foundations:'0 Foundations',Anatomy:'1 Neurovascular Anatomy',
  Syndromes:'2 Stroke Syndromes',Antithrombotics:'3 Antithrombotics',Updates:'4 What Changed 2024-26',
  Imaging:'5 Imaging and Diagnostics'};
// Anki resolves <img src="x.png"> against collection.media, so the export references
// bare filenames while the web app uses images/. Copy the images/ folder contents into
// collection.media once and the same deck works in both places.
function ankiImgs(c){
  if(!c.img || !c.img.length) return '';
  const multi=c.img.length>1;
  return c.img.map((im,i)=>(multi?'<b>'+PANEL[i]+'</b><br>':'')
    +'<img src="'+im.f+'">').join('<br>')+'<br>';
}
function ankiCredits(c){
  if(!c.img || !c.img.length) return '';
  return '<br><br><span style="font-size:12px;color:#888">'
    +c.img.map((im,i)=>(c.img.length>1?'<b>'+PANEL[i]+'</b> ':'')+im.cap
      +' — <a href="'+im.u+'">'+im.src+'</a> ('+(im.lic||'open access')+')').join('<br>')
    +'</span>';
}
function buildAnkiTSV(){
  const cl=s=>String(s).replace(/\t/g,' ').replace(/\r?\n/g,' ').trim();
  const rows=[];
  CARDS.forEach(c=>rows.push([cl(ankiImgs(c)+c.q),cl(c.a+ankiCredits(c)),'VascNeuro::'+ANKI_DECKS[c.deck],
    cl((c.tags||[]).join(' ')+' tier'+(c.tier||2))].join('\t')));
  SYNDROMES.forEach(s=>{
    rows.push([cl('Findings:<br><br>'+s.findings.map(f=>'&bull; '+f).join('<br>')+'<br><br><b>Name the syndrome and the vessel.</b>'),
      cl('<b>'+s.name+'</b><br>Vessel: '+s.vessel+'<br><br><i>Structures:</i> '+s.structures+(s.pearl?'<br><br><b>Discriminator:</b> '+s.pearl:'')),
      'VascNeuro::2 Stroke Syndromes','syndrome recognition tier2'].join('\t'));
    rows.push([cl('<b>'+s.name+'</b><br><br>Which vessel, and what are the key findings?'),
      cl('Vessel: <b>'+s.vessel+'</b><br><br>'+s.findings.map(f=>'&bull; '+f).join('<br>')+(s.pearl?'<br><br><b>Discriminator:</b> '+s.pearl:'')),
      'VascNeuro::2 Stroke Syndromes','syndrome recall tier2'].join('\t'));
  });
  DRUGS.forEach(d=>rows.push([cl('What is the molecular target and mechanism of <b>'+d.name+'</b>?'),
    cl('<b>Target:</b> '+d.target+'<br><br><b>Mechanism:</b> '+d.mech+(d.pk?'<br><br><b>Pharmacology:</b> '+d.pk:'')
      +(d.rev?'<br><br><b>Reversal:</b> '+d.rev:'')+(d.pearl?'<br><br><b>Discriminator:</b> '+d.pearl:'')),
    'VascNeuro::3 Antithrombotics','mechanism tier2'].join('\t')));
  UPDATES.forEach(u=>rows.push([cl('<b>What changed: '+u.t+'</b><br><br>What were you taught, and what do the trials now show?'),
    cl('<b>Old:</b> '+u.old+'<br><br><b>New ('+u.trial+'):</b> '+u.nw+'<br><br><b>Exam discrimination:</b> '+u.ex),
    'VascNeuro::4 What Changed 2024-26','delta tier3'].join('\t')));
  return {text:'#separator:tab\n#html:true\n#deck column:3\n#tags column:4\n'+rows.join('\n')+'\n', n:rows.length};
}
function ankiCount(){ return CARDS.length + SYNDROMES.length*2 + DRUGS.length + UPDATES.length; }
function downloadAnki(){
  const {text}=buildAnkiTSV();
  const b=new Blob([text],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='VascNeuro_AnkiDeck.txt'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportData(){

function importData(el){

// Introduce easier tiers before harder ones. Foundations (tier 1) is the remedial on-ramp:

function loadNew(){

// Which regions are confusable with which. Used to build plausible distractors:
// a brainstem case should compete against other brainstem syndromes, not against
// a spinal cord syndrome the learner can eliminate on sight.
const NEIGHBORS = {
  "Medulla":["Pons","Cerebellum"],
  "Pons":["Medulla","Midbrain","Cerebellum"],
  "Midbrain":["Pons","Posterior circulation"],
  "Cerebellum":["Medulla","Pons"],
  "Anterior circulation":["Watershed","Posterior circulation"],
  "Posterior circulation":["Midbrain","Anterior circulation"],
  "Watershed":["Anterior circulation"],
  "Spinal cord":["Medulla"],
  "Venous":["Anterior circulation","Watershed"]
};
let lq=null, lmode='vessel';
function renderLocalize(){
  const seen=Object.keys(S.synd).length;
  const acc=(()=>{const v=Object.values(S.synd);const t=v.reduce((a,b)=>a+b.n,0);const r=v.reduce((a,b)=>a+b.ok,0);return t?pct(r,t):null;})();
  $('#v-localize').innerHTML=`
    <div class="card" style="padding:13px 16px">
      <div class="row">
        <span class="note">Ask me for the:</span>
        <select id="lmode">
          <option value="vessel">Vessel</option>
          <option value="name">Syndrome name</option>
          <option value="findings">Findings (reverse)</option>
        </select>
        <button class="btn sm" onclick="nextLocal()">New case</button>
        <div class="spacer"></div>
        <span class="note">${seen} syndromes touched${acc!==null?` · ${acc}% correct`:''}</span>
      </div>
    </div>
    <div id="lbody"></div>
    <div class="card" style="margin-top:14px">
      <h2>Weakest syndromes</h2>
      <div id="lweak"></div>
    </div>`;
  $('#lmode').value=lmode;
  $('#lmode').onchange=e=>{lmode=e.target.value; nextLocal();};
  nextLocal();
}
function nextLocal(){
  // bias toward syndromes the learner gets wrong
  const weighted=[];
  SYNDROMES.forEach(s=>{
    const st=S.synd[s.name];
    const w = !st?3 : (st.n && st.ok/st.n<0.6 ? 5 : (st.ok/st.n<0.85?2:1));
    for(let i=0;i<w;i++) weighted.push(s);
  });
  lq=weighted[Math.floor(Math.random()*weighted.length)];
  drawLocal();
}
function drawLocal(){
  const s=lq;
  let stem, correct, pool, label;
  if(lmode==='vessel'){
    stem=`<b>${esc(s.name)}</b><div style="margin-top:10px;font-size:15px;color:var(--tx2)">${s.findings.map(f=>'· '+esc(f)).join('<br>')}</div>`;
    correct=s.vessel; label='Which vessel?';
    pool=[...new Set(SYNDROMES.map(x=>x.vessel))];
  } else if(lmode==='name'){
    stem=`<div style="font-size:15px;color:var(--tx2)">${s.findings.map(f=>'· '+esc(f)).join('<br>')}</div>`;
    correct=s.name; label='Name the syndrome.';
    // Distractors must be plausible or the item teaches nothing. Draw from the same region
    // first, then widen to anatomically adjacent regions rather than the whole set.
    pool=SYNDROMES.filter(x=>x.region===s.region&&x.name!==s.name).map(x=>x.name);
    if(pool.length<3){
      const near=NEIGHBORS[s.region]||[];
      pool=pool.concat(SYNDROMES.filter(x=>near.includes(x.region)&&x.name!==s.name).map(x=>x.name));
    }
    if(pool.length<3) pool=SYNDROMES.filter(x=>x.name!==s.name).map(x=>x.name);
  } else {
    stem=`<b>${esc(s.name)}</b><div style="margin-top:8px;color:var(--tx2);font-size:14px">${esc(s.vessel)}</div>`;
    correct=s.findings[0]; label='Which finding belongs to this syndrome?';
    pool=SYNDROMES.filter(x=>x.name!==s.name).flatMap(x=>x.findings);
  }
  const distract=pick(pool.filter(x=>x!==correct),3);
  const opts=shuffle([correct,...distract]);
  $('#lbody').innerHTML=`
    <div class="qbox" style="min-height:auto;padding:26px 24px">
      <div style="font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px">${esc(s.region)}</div>
      <div class="qtext" style="font-size:17px">${stem}</div>
    </div>
    <p class="prog" style="margin:14px 0 8px"><b>${label}</b></p>
    <div id="lopts">${opts.map((o,i)=>
      `<button class="opt" data-o="${esc(o)}"><b>${'ABCD'[i]}</b>${esc(o)}</button>`).join('')}</div>
    <div id="lfeed"></div>`;
  $('#lopts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerLocal(b,correct));
  drawWeak();
}
function answerLocal(btn,correct){
  const ok = btn.dataset.o===correct;
  $('#lopts').querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    if(b.dataset.o===correct) b.classList.add('correct');
    else if(b===btn) b.classList.add('wrong');
  });
  const st=S.synd[lq.name]||{n:0,ok:0};
  st.n++; if(ok) st.ok++;
  S.synd[lq.name]=st; save();
  $('#lfeed').innerHTML=`<div class="rat">
    <b>${lq.name}</b> — ${esc(lq.vessel)}<br>
    <span style="color:var(--tx2)">Structures: ${esc(lq.structures)}</span>
    ${lq.pearl?`<br><br><b>Discriminator:</b> ${esc(lq.pearl)}`:''}
    </div>
    <button class="btn" style="margin-top:12px" onclick="nextLocal()">Next case <kbd>enter</kbd></button>`;
  drawWeak();
}
function drawWeak(){
  const el=$('#lweak'); if(!el) return;
  const rows=Object.entries(S.synd).map(([k,v])=>({k,...v,acc:v.n?v.ok/v.n:1}))
    .filter(r=>r.n>=2).sort((a,b)=>a.acc-b.acc).slice(0,8);
  el.innerHTML = rows.length? `<div class="scroll"><table>
    <thead><tr><th>Syndrome</th><th>Seen</th><th>Correct</th><th></th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.k)}</td><td>${r.n}</td><td>${Math.round(100*r.acc)}%</td>
      <td style="min-width:100px"><div class="bar"><i style="width:${Math.round(100*r.acc)}%;background:${r.acc<0.6?'var(--bad)':r.acc<0.85?'var(--warn)':'var(--good)'}"></i></div></td></tr>`).join('')}
    </tbody></table></div>` : '<p class="note">Answer a few cases and the ones you keep missing will surface here.</p>';
}
document.addEventListener('keydown',e=>{
  if(cur==='localize' && e.key==='Enter' && $('#lfeed') && $('#lfeed').innerHTML) nextLocal();
});

function examStats(){
  const doms=[...new Set(VIGNETTES.map(v=>v.domain))];
  $('#exStats').innerHTML=`<div class="scroll"><table>
    <thead><tr><th>Domain</th><th>Attempted</th><th>Correct</th><th></th></tr></thead><tbody>
    ${doms.map(d=>{
      const items=VIGNETTES.filter(v=>v.domain===d);
      const at=items.filter(v=>S.vign[v.id]);
      const ok=at.filter(v=>S.vign[v.id].ok).length;
      const a=at.length?Math.round(100*ok/at.length):0;
      return `<tr><td>${esc(d)}</td><td>${at.length}/${items.length}</td><td>${at.length?a+'%':'—'}</td>
        <td style="min-width:110px"><div class="bar"><i style="width:${a}%;background:${a<60?'var(--bad)':a<80?'var(--warn)':'var(--good)'}"></i></div></td></tr>`;
    }).join('')}</tbody></table></div>`;
}
function startExam(){
  const n=+$('#exN').value, dm=$('#exD').value;
  let pool=VIGNETTES.filter(v=>dm==='all'||v.domain===dm);
  const w=[];
  pool.forEach(v=>{ const st=S.vign[v.id];
    const k = !st?2 : (st.ok?1:4);
    for(let i=0;i<k;i++) w.push(v); });
  const seen=new Set(); const items=[];
  shuffle(w).forEach(v=>{ if(!seen.has(v.id)&&items.length<n){seen.add(v.id);items.push(v);} });
  ex={items,i:0,ans:[],active:true,t0:Date.now()};
  drawExam();
}
function drawExam(){
  if(ex.i>=ex.items.length) return finishExam();
  const v=ex.items[ex.i];
  const mins=Math.floor((Date.now()-ex.t0)/60000);
  $('#v-exam').innerHTML=`
    <div class="card" style="padding:11px 16px">
      <div class="row"><span class="note">Item <b>${ex.i+1}</b> of ${ex.items.length}</span>
        <div class="bar" style="flex:1;margin:0 12px"><i style="width:${pct(ex.i,ex.items.length)}%"></i></div>
        <span class="note">${mins} min elapsed</span>
        <button class="btn ghost sm" onclick="finishExam()">End block</button></div>
    </div>
    <div class="card">
      <p style="font-size:15.5px;line-height:1.65;margin:0 0 18px">${v.stem}</p>
      <div id="exo">${v.choices.map((c,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDE'[i]}</b>${esc(c)}</button>`).join('')}</div>
    </div>`;
  $('#exo').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    ex.ans.push({id:v.id,pick:+b.dataset.i,ok:+b.dataset.i===v.answer});
    S.vign[v.id]={ok:+b.dataset.i===v.answer,d:today()}; save();
    ex.i++; drawExam();
  });
}
function finishExam(){
  ex.active=false;
  const done=ex.ans.length, ok=ex.ans.filter(a=>a.ok).length;
  const mins=Math.round((Date.now()-ex.t0)/60000);
  const wrong=ex.ans.filter(a=>!a.ok);
  $('#v-exam').innerHTML=`
    <div class="grid g3" style="margin-bottom:14px">
      <div class="stat"><div class="n" style="color:${pct(ok,done)<60?'var(--bad)':pct(ok,done)<80?'var(--warn)':'var(--good)'}">${pct(ok,done)}%</div>
        <div class="l">${ok} of ${done} correct</div></div>
      <div class="stat"><div class="n">${mins}</div><div class="l">minutes</div>
        <div class="sub">${done?(mins*60/done).toFixed(0):0} sec/item · ABPN allows <b>62</b></div></div>
      <div class="stat"><div class="n">${wrong.length}</div><div class="l">to post-mortem</div>
        <div class="sub">every miss, no exceptions</div></div>
    </div>
    <div class="warnbox"><b>Post-mortem protocol.</b> For each miss, name the failure type before you move on:
      knowledge gap, reasoning error, misread stem, or the field changed since you trained.
      The fix is different for each, and an unexamined miss is one you will repeat.</div>
    ${ex.ans.map((a,n)=>{
      const v=VIGNETTES.find(x=>x.id===a.id);
      return `<div class="card">
        <div class="row" style="margin-bottom:10px">
          <span class="tag ${a.ok?'g':'b'}">${a.ok?'Correct':'Missed'}</span>
          <span class="tag">${esc(v.domain)}</span><span class="note">Item ${n+1}</span></div>
        <p style="font-size:14.5px;line-height:1.6;margin:0 0 12px">${v.stem}</p>
        ${v.choices.map((c,i)=>`<div class="opt ${i===v.answer?'correct':(i===a.pick?'wrong':'')}"
          style="cursor:default"><b>${'ABCDE'[i]}</b>${esc(c)}</div>`).join('')}
        <div class="rat"><b>Why:</b> ${v.rationale}</div>
      </div>`;
    }).join('')}
    <button class="btn" onclick="ex=null;renderExam()">New block</button>`;
}

const NODE_NAMES={adhesion:"Platelet adhesion — GPIb-IX-V / GPVI",cox:"Cyclooxygenase-1 → thromboxane A2",

 tf:"Tissue factor / factor VIIa",fXa:"Factor Xa",fIIa:"Thrombin (factor IIa)",
 fibrin:"Fibrin and factor XIIIa",lysis:"Plasminogen → plasmin",vkor:"VKORC1 / vitamin K recycling"};
const NODE_NOTES={adhesion:"vWF binds GPIb-IX-V; collagen binds GPVI and integrin α2β1. This is the tethering step that precedes activation.",
 cox:"Membrane arachidonic acid is converted by COX-1 to thromboxane A2, which amplifies aggregation and causes vasoconstriction.",
 p2y12:"ADP released from dense granules acts through P2Y12, a Gi-coupled receptor that lowers cyclic AMP and sustains aggregation.",
 par:"Thrombin is the most potent physiological platelet agonist, acting through protease-activated receptors PAR-1 and PAR-4.",
 pde:"Cyclic AMP and cyclic GMP suppress platelet activation. Phosphodiesterase degrades them; blocking it keeps them high.",
 gp2b3a:"The final common pathway. Whatever the agonist, aggregation requires activated GPIIb/IIIa to bind fibrinogen and bridge platelets.",
 fXI:"The contact pathway, measured by the aPTT. Factor XI matters more for propagating thrombus than for normal haemostasis — the rationale for the factor XI inhibitor class.",
 tf:"Tissue factor with factor VIIa initiates coagulation in vivo. Measured by the PT and INR.",
 fXa:"Xa with Va, calcium and phospholipid forms the prothrombinase complex. A convergence point, and therefore a popular drug target.",
 fIIa:"Thrombin cleaves fibrinogen and also activates factors V, VIII, XI, XIII and platelets — an amplification hub.",

let adg='cow', amode='explore', aq=null, asel=null;
function renderAtlas(){
  const keys=Object.keys(ATLAS);
  $('#v-atlas').innerHTML=`
    <div class="dgpick">
      ${keys.map(k=>`<button class="${k===adg?'on':''}" data-d="${k}">${esc(ATLAS[k].title)}</button>`).join('')}

    </div>
    <div class="atlaswrap">
      <div class="card" style="padding:14px">
        <div id="dgbox"></div>
        <p class="note" style="margin:10px 0 0">${ATLAS[adg].caption}</p>

      </div>
      <div id="dgside"></div>
    </div>`;
  $('#v-atlas').querySelectorAll('.dgpick button[data-d]').forEach(b=>b.onclick=()=>{
    adg=b.dataset.d; asel=null; aq=null; renderAtlas();});
  $('#qmode').onclick=()=>{amode=amode==='quiz'?'explore':'quiz'; asel=null; renderAtlas();};

}
function drawDiagram(){
  $('#dgbox').innerHTML=ATLAS[adg].svg;
  $('#dgbox').querySelectorAll('.rg').forEach(g=>{
    g.onclick=()=>clickRegion(g.dataset.k);
    g.onmouseenter=()=>{ if(amode==='explore' && !asel) showRegion(g.dataset.k,true); };
  });
}
function drawLegend(){
  const L=$('#dglegend'); if(!L) return;
  let items=[];
  if(adg==='bs') items=[['var(--accent)','paramedian perforators (medial)'],['var(--warn)','circumferential arteries (lateral)']];
  else if(adg==='ax') items=[['var(--accent)','cortical territories'],['var(--purple)','lenticulostriate'],['var(--bad)','anterior choroidal']];
  else if(adg==='coag') items=[['var(--good)','final common pathway']];
  L.innerHTML=items.map(([c,t])=>`<span><i style="background:color-mix(in srgb,${c} 45%,transparent);border:1px solid ${c}"></i>${t}</span>`).join('')
    + (adg!=='coag'?'<span style="color:var(--tx3)">Schematic — proportions simplified for legibility</span>':'');
}
function regionData(k){
  const dg=ATLAS[adg];
  if(dg.regions && dg.regions[k]) return dg.regions[k];
  if(adg==='coag'){
    const ds=DRUGS.filter(d=>d.node===k);
    return {n:NODE_NAMES[k]||k, s:NODE_NOTES[k]||'', drugs:ds};
  }
  return null;
}
function regionKeys(){
  const dg=ATLAS[adg];
  if(dg.regions && Object.keys(dg.regions).length) return Object.keys(dg.regions);
  return [...new Set([...$('#dgbox').querySelectorAll('.rg')].map(g=>g.dataset.k))];
}
function sideDefault(){
  $('#dgside').innerHTML=`<div class="detail">
    <h3>${esc(ATLAS[adg].title)}</h3>
    <p style="color:var(--tx2);margin:0">Hover a region to preview it. Click to pin the detail here.</p>
    <div class="lab">Then</div>
    <p style="color:var(--tx2);margin:0">Switch to <b>Quiz me</b> and the diagram asks you to find structures instead of labelling them for you. Recognising a label is not the same skill as producing one.</p>
  </div>`;
}
function showRegion(k,preview){
  const r=regionData(k); if(!r) return;
  let html=`<div class="detail"><h3>${esc(r.n)}</h3>`;
  if(r.s) html+=`<div class="lab">Supplies / role</div><p style="margin:0">${r.s}</p>`;
  if(r.o) html+=`<div class="lab">When it closes</div><p style="margin:0">${r.o}</p>`;
  if(r.drugs && r.drugs.length){
    html+=`<div class="lab">Blocked by</div>`;
    html+=r.drugs.map(d=>`<div style="margin:7px 0"><b style="color:var(--tx)">${esc(d.name)}</b>
      <div style="font-size:12.5px;color:var(--tx2);margin-top:2px">${esc(d.mech)}</div>
      ${d.pearl?`<div style="font-size:12px;color:var(--tx3);margin-top:3px">${esc(d.pearl)}</div>`:''}</div>`).join('');
  }
  html+=`</div>`;
  $('#dgside').innerHTML=html;
}
function clickRegion(k){
  if(amode==='quiz') return answerAtlas(k);
  asel=k;
  $('#dgbox').querySelectorAll('.rg').forEach(g=>g.classList.toggle('sel',g.dataset.k===k));
  showRegion(k);
}
function nextAtlasQ(){
  const keys=regionKeys();
  if(!keys.length){ sideDefault(); return; }
  const k=keys[Math.floor(Math.random()*keys.length)];
  const r=regionData(k);
  aq={k, tries:0};
  $('#dgbox').querySelectorAll('.rg').forEach(g=>g.classList.remove('sel','ok','no'));
  const st=S.atlas||{};
  const tot=Object.values(st).reduce((a,b)=>a+b.n,0), ok=Object.values(st).reduce((a,b)=>a+b.ok,0);
  $('#dgside').innerHTML=`<div class="detail">
    <div class="lab">Find it on the diagram</div>
    <h3 style="font-size:17px;margin:4px 0 10px">${esc(r.n.split('—')[0].trim())}</h3>
    <p style="color:var(--tx2);margin:0;font-size:13px">${r.o? 'Occlusion causes: '+r.o.replace(/<[^>]+>/g,'').slice(0,150)+'…' : (r.s||'').replace(/<[^>]+>/g,'').slice(0,150)+'…'}</p>
    <div class="lab" style="margin-top:14px">Score</div>
    <p style="margin:0;color:var(--tx2)">${ok} of ${tot} correct on first click</p>
    <button class="btn ghost sm" style="margin-top:12px" onclick="nextAtlasQ()">Skip</button>
  </div>`;
}
function answerAtlas(k){
  if(!aq) return;
  const correct = k===aq.k;
  const st=S.atlas=S.atlas||{};
  if(aq.tries===0){ const e=st[aq.k]||{n:0,ok:0}; e.n++; if(correct) e.ok++; st[aq.k]=e; save(); }
  aq.tries++;
  $('#dgbox').querySelectorAll('.rg').forEach(g=>{
    if(g.dataset.k===aq.k && correct) g.classList.add('ok');
    else if(g.dataset.k===k && !correct) g.classList.add('no');
  });
  if(correct){
    const r=regionData(aq.k);
    let html=`<div class="detail"><div class="lab" style="color:var(--good)">Correct</div><h3>${esc(r.n)}</h3>`;
    if(r.s) html+=`<p style="margin:0 0 8px">${r.s}</p>`;
    if(r.o) html+=`<div class="lab">When it closes</div><p style="margin:0">${r.o}</p>`;
    if(r.drugs&&r.drugs.length) html+=`<div class="lab">Blocked by</div><p style="margin:0">${r.drugs.map(d=>esc(d.name)).join(', ')}</p>`;
    html+=`<button class="btn" style="margin-top:14px;width:100%" onclick="nextAtlasQ()">Next</button></div>`;
    $('#dgside').innerHTML=html;
  } else {
    const side=$('#dgside');
    if(!side.querySelector('.miss')) side.insertAdjacentHTML('afterbegin',
      `<div class="detail miss" style="border-color:var(--bad);margin-bottom:10px">
        <div class="lab" style="color:var(--bad)">Not that one</div>
        <p style="margin:0;color:var(--tx2)">Try again — the correct region stays unmarked until you find it.</p></div>`);
  }
}

/* ============================================================
   REFERENCE
   ============================================================ */
let rfilter='';
function renderRef(){
  $('#v-ref').innerHTML=`
    <div class="card">
      <h2>Reference tables</h2>
      <p class="sub">Look things up here, but do not mistake reading for studying — recognition is not recall.</p>
      <input type="search" id="rsearch" placeholder="Search syndromes, vessels, findings…" value="${esc(rfilter)}">
    </div>
    <div class="card"><h2>Stroke syndromes</h2><div id="refSynd"></div></div>
    <div class="card"><h2>Agents</h2><div id="refDrug"></div></div>`;
  $('#rsearch').oninput=e=>{rfilter=e.target.value.toLowerCase(); drawRef();};
  drawRef();
}
function drawRef(){
  const f=rfilter;
  const sy=SYNDROMES.filter(s=>!f||(s.name+s.vessel+s.structures+s.findings.join(' ')+s.region).toLowerCase().includes(f));
  const regions=[...new Set(sy.map(s=>s.region))];
  $('#refSynd').innerHTML = sy.length? regions.map(r=>`
    <details ${f?'open':''}><summary>${esc(r)} <span class="note">(${sy.filter(s=>s.region===r).length})</span></summary>
    <div class="scroll"><table><thead><tr><th>Syndrome</th><th>Vessel</th><th>Structures</th><th>Key findings</th></tr></thead>
    <tbody>${sy.filter(s=>s.region===r).map(s=>`<tr>
      <td><b>${esc(s.name)}</b></td><td>${esc(s.vessel)}</td><td>${esc(s.structures)}</td>
      <td>${s.findings.map(x=>esc(x)).join('<br>')}</td></tr>`).join('')}</tbody></table></div></details>`).join('')
    : '<p class="note">Nothing matches.</p>';
  const dr=DRUGS.filter(d=>!f||(d.name+d.cls+d.target+d.mech+(d.pearl||'')).toLowerCase().includes(f));
  $('#refDrug').innerHTML = dr.length? `<div class="scroll"><table>
    <thead><tr><th>Agent</th><th>Class</th><th>Target</th><th>Mechanism</th><th>Discriminator</th></tr></thead>
    <tbody>${dr.map(d=>`<tr><td><b>${esc(d.name)}</b></td><td>${esc(d.cls)}</td><td>${esc(d.target)}</td>
      <td>${esc(d.mech)}</td><td>${esc(d.pearl||'—')}</td></tr>`).join('')}</tbody></table></div>`
    : '<p class="note">Nothing matches.</p>';
}

/* ============================================================
   BOOT
   ============================================================ */
// Only stamp data-theme once the viewer has actually chosen. Until then the OS (or the artifact
// viewer's own toggle) decides, which is what someone expects on first open.
if(S.theme) document.documentElement.dataset.theme=S.theme;
$('#themeBtn').onclick=()=>{
  const cur = document.documentElement.dataset.theme
    || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  S.theme = cur==='dark'?'light':'dark';
  document.documentElement.dataset.theme=S.theme; save();
};
nav(); go('dash');
</script>
