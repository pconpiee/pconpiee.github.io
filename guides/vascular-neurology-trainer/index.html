<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vascular Neurology Board Trainer</title>
<meta name="description" content="Spaced-repetition trainer for the ABPN Vascular Neurology board exam: interactive neurovascular anatomy atlas, stroke syndrome drills, antithrombotic mechanism maps, timed question blocks, and a downloadable Anki deck.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Vascular Neurology Board Trainer">
<meta property="og:description" content="Anatomy atlas, syndrome drills, mechanism maps and timed blocks for the ABPN vascular neurology exam.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230e1117'/%3E%3Cg stroke='%234c9aff' stroke-width='2.2' fill='none' stroke-linecap='round'%3E%3Cpath d='M16 5v7'/%3E%3Cpath d='M11 12h10'/%3E%3Cpath d='M11 12L7 19'/%3E%3Cpath d='M21 12l4 7'/%3E%3Cpath d='M16 12v6'/%3E%3Cpath d='M16 18l-4 8'/%3E%3Cpath d='M16 18l4 8'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* Tokens only. Components style through these and never inside a media query, so the
   OS preference and the viewer's explicit toggle can both win in the right order. */
:root{
  --bg:#f6f8fa; --panel:#ffffff; --panel2:#eef1f6; --line:#d8dee6;
  --tx:#1c2128; --tx2:#57606a; --tx3:#8b949e;
  --accent:#0969da; --good:#1a7f37; --warn:#9a6700; --bad:#cf222e; --purple:#8250df;
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1117; --panel:#161b25; --panel2:#1d2430; --line:#2a3240;
    --tx:#e6edf5; --tx2:#9aa8bc; --tx3:#6b7889;
    --accent:#4c9aff; --good:#3fb950; --warn:#d29922; --bad:#f85149; --purple:#a371f7;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1117; --panel:#161b25; --panel2:#1d2430; --line:#2a3240;
  --tx:#e6edf5; --tx2:#9aa8bc; --tx3:#6b7889;
  --accent:#4c9aff; --good:#3fb950; --warn:#d29922; --bad:#f85149; --purple:#a371f7;
}
:root[data-theme="light"]{
  --bg:#f6f8fa; --panel:#ffffff; --panel2:#eef1f6; --line:#d8dee6;
  --tx:#1c2128; --tx2:#57606a; --tx3:#8b949e;
  --accent:#0969da; --good:#1a7f37; --warn:#9a6700; --bad:#cf222e; --purple:#8250df;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
h1 span{color:var(--tx3);font-weight:400}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--tx2);padding:7px 13px;border-radius:7px;
  cursor:pointer;font-size:13.5px;font-family:inherit;font-weight:500}
nav button:hover{background:var(--panel2);color:var(--tx)}
nav button.on{background:var(--accent);color:#fff}
.spacer{flex:1}
.hdr-meta{font-size:12.5px;color:var(--tx2);display:flex;gap:14px;align-items:center}
.hdr-meta b{color:var(--tx);font-weight:600}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--tx2);
  width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:14px}
main{max-width:1080px;margin:0 auto;padding:22px 18px 90px}
.view{display:none}.view.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:15px;font-weight:650}
.card h2+p.sub{margin:0 0 14px;color:var(--tx2);font-size:13px}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px}
.stat .n{font-size:27px;font-weight:680;letter-spacing:-.02em;line-height:1.1}
.stat .l{font-size:12px;color:var(--tx2);margin-top:3px}
.stat .sub{font-size:11.5px;color:var(--tx3);margin-top:6px}
.bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.btn{background:var(--accent);color:#fff;border:0;padding:9px 16px;border-radius:7px;
  cursor:pointer;font-size:13.5px;font-family:inherit;font-weight:550}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);color:var(--tx2);
  font-size:11px;padding:2px 8px;border-radius:20px;margin:2px 3px 2px 0;white-space:nowrap}
.tag.a{border-color:var(--accent);color:var(--accent)}
.tag.p{border-color:var(--purple);color:var(--purple)}
.tag.g{border-color:var(--good);color:var(--good)}
.tag.w{border-color:var(--warn);color:var(--warn)}
.tag.b{border-color:var(--bad);color:var(--bad)}

/* review */
.qbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:34px 28px;min-height:190px;display:flex;flex-direction:column;justify-content:center}
.qtext{font-size:20px;line-height:1.45;font-weight:520}
.abox{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);font-size:15.5px;color:var(--tx)}
.abox ul{margin:8px 0 0;padding-left:19px}
.abox li{margin:4px 0}
.hidden{display:none}
/* card images. Radiology is dark — the plate sits on black in both themes so the
   window/level the radiologist chose is what you actually see. */
.cimgs{display:grid;gap:10px;margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cimgs.n1{grid-template-columns:1fr;max-width:540px;margin-left:auto;margin-right:auto}
.cimg{margin:0;position:relative;background:#000;border:1px solid var(--line);
  border-radius:8px;overflow:hidden}
.cimg img{display:block;width:100%;height:auto;max-height:360px;object-fit:contain;background:#000}
.cimgs.n1 .cimg img{max-height:440px}
.cimg .pl{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.7);color:#fff;
  font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:4px 7px;
  border-radius:4px;letter-spacing:.06em}
.imgnote{margin-top:9px;font-size:12px;color:var(--tx2);font-style:italic;text-align:center}
.credits{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:12.5px;color:var(--tx2);line-height:1.55}
.credits .ct{margin:0 0 8px}
.credits .ct:last-child{margin-bottom:0}
.credits .pl{font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--panel2);border:1px solid var(--line);color:var(--tx2);
  padding:2px 6px;border-radius:4px;margin-right:6px}
.credits a{color:var(--accent);text-decoration:none}
.credits a:hover{text-decoration:underline}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grades button{padding:11px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
  color:var(--tx);cursor:pointer;font-family:inherit;font-size:13px;font-weight:550}
.grades button small{display:block;font-weight:400;font-size:10.5px;color:var(--tx3);margin-top:2px}
.grades button:nth-child(1):hover{border-color:var(--bad);color:var(--bad)}
.grades button:nth-child(2):hover{border-color:var(--warn);color:var(--warn)}
.grades button:nth-child(3):hover{border-color:var(--good);color:var(--good)}
.grades button:nth-child(4):hover{border-color:var(--accent);color:var(--accent)}

/* mcq */
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  color:var(--tx);padding:11px 14px;border-radius:8px;margin-bottom:7px;cursor:pointer;
  font-family:inherit;font-size:14px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--panel2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--panel2))}
.opt b{display:inline-block;width:19px;color:var(--tx3)}
.rat{margin-top:12px;padding:14px;background:var(--panel2);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.6}
.rat b{color:var(--accent)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
/* No sticky headers. .scroll uses overflow-x:auto, which makes overflow-y compute to auto,
   turning it into a scroll container — a sticky th with a top offset then pins itself that far
   DOWN inside the table and covers the first data row. Tables here are short; sticky buys nothing. */
th{color:var(--tx2);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;
  background:var(--panel)}
tbody tr:hover{background:var(--panel2)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* mechanism map */
.cascade{display:grid;gap:9px}
.step{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 13px;font-size:13.5px}
.step .lbl{font-weight:620;font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.step .inh{margin-top:6px}
.arrow{text-align:center;color:var(--tx3);font-size:15px;line-height:1}
.drug{cursor:pointer}
.drug:hover{border-color:var(--accent)}
input[type=search],input[type=date],select{background:var(--panel2);border:1px solid var(--line);
  color:var(--tx);padding:8px 11px;border-radius:7px;font-family:inherit;font-size:13.5px}
input[type=search]{width:100%}
details{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px 14px;margin-bottom:8px}
summary{cursor:pointer;font-weight:560;font-size:14px}
details[open] summary{margin-bottom:9px;color:var(--accent)}
.note{font-size:12.5px;color:var(--tx2);line-height:1.6}
.warnbox{background:color-mix(in srgb,var(--warn) 10%,var(--panel));border:1px solid var(--warn);
  border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:14px}
.warnbox b{color:var(--warn)}
.empty{text-align:center;padding:48px 20px;color:var(--tx2)}
.empty .big{font-size:34px;margin-bottom:10px}
.prog{font-size:12.5px;color:var(--tx2);margin-bottom:10px}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:1px 6px;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--tx2)}
/* atlas */
.dg{width:100%;height:auto;display:block;max-height:78vh}
.dg .rg path,.dg .rg ellipse,.dg .rg rect,.dg .rg circle{
  fill:none;stroke:var(--tx2);stroke-width:5;stroke-linecap:round;cursor:pointer;transition:.12s}
.dg .rg.fill path,.dg .rg.fill ellipse,.dg .rg.fill rect{
  fill:color-mix(in srgb,var(--accent) 16%,transparent);stroke:var(--line);stroke-width:1.5}
.dg .rg.fill.lsa ellipse{fill:color-mix(in srgb,var(--purple) 42%,transparent)}
.dg .rg.fill.ach ellipse{fill:color-mix(in srgb,var(--bad) 38%,transparent)}
.dg .rg.fill.par path{fill:color-mix(in srgb,var(--accent) 30%,transparent)}
.dg .rg.fill.circ path{fill:color-mix(in srgb,var(--warn) 34%,transparent)}
.dg .rg.node rect{fill:var(--panel2);stroke:var(--line);stroke-width:1.5}
.dg .rg.node.hi rect{fill:color-mix(in srgb,var(--good) 20%,var(--panel2));stroke:var(--good)}
.dg .rg:hover path,.dg .rg:hover ellipse,.dg .rg:hover rect,.dg .rg:hover circle{
  stroke:var(--accent);stroke-width:7}
.dg .rg.fill:hover path,.dg .rg.fill:hover ellipse,.dg .rg.fill:hover rect{
  fill:color-mix(in srgb,var(--accent) 45%,transparent);stroke:var(--accent);stroke-width:2.5}
.dg .rg.sel path,.dg .rg.sel ellipse,.dg .rg.sel rect{
  fill:color-mix(in srgb,var(--accent) 55%,transparent);stroke:var(--accent);stroke-width:3}
.dg .rg.ok path,.dg .rg.ok ellipse,.dg .rg.ok rect{fill:color-mix(in srgb,var(--good) 55%,transparent);stroke:var(--good)}
.dg .rg.no path,.dg .rg.no ellipse,.dg .rg.no rect{fill:color-mix(in srgb,var(--bad) 55%,transparent);stroke:var(--bad)}
.dg .outline{fill:none;stroke:var(--tx3);stroke-width:2}
.dg .st{fill:var(--tx);opacity:.28}
.dg .st2{fill:var(--purple);opacity:.4}
.dg .ar{stroke:var(--tx3);stroke-width:2;fill:none;marker-end:url(#ah)}
.dg text{pointer-events:none;font-family:inherit}
.dg .dt{fill:var(--tx);font-size:13px;font-weight:650;text-anchor:middle}
.dg .dl{fill:var(--tx2);font-size:10.5px;text-anchor:middle}
.dg .dn{fill:var(--tx);font-size:11.5px;font-weight:560;text-anchor:middle}
.dg .dh{fill:var(--tx3);font-size:11px;font-weight:700;text-anchor:middle;letter-spacing:.09em}
.atlaswrap{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
@media(max-width:860px){.atlaswrap{grid-template-columns:1fr}}
.dgpick{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.dgpick button{background:var(--panel2);border:1px solid var(--line);color:var(--tx2);
  padding:6px 11px;border-radius:20px;cursor:pointer;font-family:inherit;font-size:12.5px}
.dgpick button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.detail{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:15px;font-size:13.5px;line-height:1.62}
.detail h3{margin:0 0 8px;font-size:14.5px;color:var(--accent)}
.detail .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin:12px 0 3px;font-weight:650}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:26px;max-width:560px;width:100%;position:relative;font-size:14px;line-height:1.62;
  max-height:88vh;overflow-y:auto;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.modalx{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--tx3);
  font-size:24px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:6px;font-family:inherit}
.modalx:hover{background:var(--panel2);color:var(--tx)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* disclaimer + credits */
.disclaimer{margin:0 0 14px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);font-size:13px;color:var(--tx2)}
.credlist{margin:0;padding-left:20px;font-size:13px;line-height:1.55;color:var(--tx2)}
.credlist li{margin-bottom:8px}
.credlist code{font-size:11.5px;color:var(--tx3)}
/* resources */
.res{border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:10px;background:var(--panel2)}
.res h4{margin:0 0 3px;font-size:14.5px}
.res h4 a{color:var(--accent);text-decoration:none}
.res h4 a:hover{text-decoration:underline}
.res .meta{font-size:11.5px;color:var(--tx3);margin-bottom:7px}
.res p{margin:0;font-size:13px;line-height:1.6;color:var(--tx2)}
.verdict{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;
  text-transform:uppercase;letter-spacing:.05em;margin-left:7px;vertical-align:1px}
.v-buy{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.v-maybe{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.v-skip{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.v-free{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
@media(max-width:620px){
  .grades{grid-template-columns:repeat(2,1fr)}
  .qtext{font-size:17px}
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
  </marker>
</defs></svg>
<header>
  <h1>Vascular Neurology <span>· Board Trainer</span></h1>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <div class="hdr-meta">
    <span id="hdrDays"></span>

</header>
<main>
  <div class="view on" id="v-dash"></div>

  <div class="view" id="v-mech"></div>

<script>
/* ============================================================
   CONTENT
   ============================================================ */
const CARDS = [
// ============ DECK: Foundations (tier 1 — deliberately medical-student level) ============
// A real starting point for anyone rusty on the basics, not a board-level deck with an
// encouraging note attached. Start here. It is meant to feel easy.
{id:"f01",deck:"Foundations",tier:1,tags:["basics"],q:"What are the two arterial systems that supply the brain, and what does each cover?",a:"<b>Anterior circulation</b> — the two internal carotid arteries. Supplies most of the cerebral hemispheres: frontal, parietal and most temporal lobes.<br><br><b>Posterior circulation</b> — the two vertebral arteries joining to form the basilar. Supplies the brainstem, cerebellum, occipital lobes and thalamus."},
{id:"f02",deck:"Foundations",tier:1,tags:["basics"],q:"What are the three main cerebral arteries on each side?",a:"Anterior cerebral artery (ACA), middle cerebral artery (MCA) and posterior cerebral artery (PCA)."},
{id:"f03",deck:"Foundations",tier:1,tags:["basics"],q:"Which two arteries does the internal carotid divide into?",a:"The anterior cerebral artery and the middle cerebral artery. The MCA is the direct continuation and carries most of the flow — which is why most emboli end up there."},
{id:"f04",deck:"Foundations",tier:1,tags:["basics"],q:"What forms the basilar artery?",a:"The two vertebral arteries join at the pontomedullary junction to form the single midline basilar artery."},
{id:"f05",deck:"Foundations",tier:1,tags:["basics"],q:"What is the circle of Willis for?",a:"It is a ring of communicating vessels at the base of the brain that connects the anterior and posterior circulations, and the left and right sides. Its purpose is collateral flow: if one vessel narrows or closes, blood can reach the territory from another direction."},
{id:"f06",deck:"Foundations",tier:1,tags:["basics"],q:"In one sentence, what is an ischaemic stroke?",a:"Brain tissue dies because its blood supply is blocked — most often by a clot, either formed locally on a diseased artery or carried there from elsewhere."},
{id:"f07",deck:"Foundations",tier:1,tags:["basics"],q:"What distinguishes a TIA from a stroke?",a:"Both are caused by interrupted blood supply. In a TIA the symptoms resolve and there is no infarction on imaging; in a stroke tissue has died. Modern definitions are tissue-based rather than time-based — the old 24-hour rule has been abandoned."},
{id:"f08",deck:"Foundations",tier:1,tags:["basics"],q:"Name the two broad mechanisms by which an artery to the brain gets blocked.",a:"<b>Thrombosis</b> — a clot forms in place, usually on an atherosclerotic plaque.<br><b>Embolism</b> — a clot forms elsewhere (heart, aortic arch, carotid) and travels downstream until it lodges."},
{id:"f09",deck:"Foundations",tier:1,tags:["cortex"],q:"Where is the primary motor cortex, and what is the homunculus?",a:"The precentral gyrus, immediately in front of the central sulcus. The homunculus is the body map laid along it: the <b>leg and foot are at the top and fold over onto the medial surface</b>, while the <b>arm, hand and face are on the lateral convexity</b>, face lowest."},
{id:"f10",deck:"Foundations",tier:1,tags:["cortex"],q:"Why does that homunculus layout matter for stroke?",a:"Because it maps directly onto arterial territories. The ACA runs over the medial surface, so it supplies the <b>leg</b>. The MCA covers the lateral convexity, so it supplies the <b>face and arm</b>. This single relationship explains most territory questions."},
{id:"f11",deck:"Foundations",tier:1,tags:["cortex"],q:"Which lobe does each of these sit in — Broca's area, Wernicke's area, primary visual cortex?",a:"Broca's area: inferior <b>frontal</b> lobe. Wernicke's area: posterior superior <b>temporal</b> lobe. Primary visual cortex: <b>occipital</b> lobe, around the calcarine sulcus."},
{id:"f12",deck:"Foundations",tier:1,tags:["cortex"],q:"In most people, which hemisphere is dominant for language?",a:"The left, in roughly 95% of right-handers and the majority of left-handers. This is why a left hemisphere stroke tends to produce aphasia and a right hemisphere stroke tends to produce neglect."},
{id:"f13",deck:"Foundations",tier:1,tags:["cortex"],q:"What is the difference between Broca's and Wernicke's aphasia?",a:"<b>Broca's</b> — effortful, sparse, non-fluent speech, but comprehension is preserved. The patient knows what he wants to say and cannot get it out, and is usually frustrated.<br><b>Wernicke's</b> — fluent but meaningless speech with poor comprehension. The patient is often unaware anything is wrong."},
{id:"f14",deck:"Foundations",tier:1,tags:["basics"],q:"Why does a stroke on one side of the brain cause weakness on the other side of the body?",a:"The corticospinal tract crosses the midline at the pyramidal decussation in the lower medulla. A lesion above that point therefore causes weakness on the opposite side."},
{id:"f15",deck:"Foundations",tier:1,tags:["brainstem"],q:"What is a 'crossed' finding, and why does it localise to the brainstem?",a:"Ipsilateral cranial nerve signs with contralateral limb findings. It happens because cranial nerve nuclei act on the same side at that level, while the long tracts have not yet crossed. Crossed findings mean brainstem until proven otherwise."},
{id:"f16",deck:"Foundations",tier:1,tags:["brainstem"],q:"What are the three levels of the brainstem, top to bottom, and what sits behind them?",a:"Midbrain, pons, medulla — with the cerebellum sitting behind, connected by the three cerebellar peduncles."},
{id:"f17",deck:"Foundations",tier:1,tags:["brainstem"],q:"What are the main functions carried by the brainstem?",a:"The long motor and sensory tracts pass through it; cranial nerves III to XII arise from it; and it houses the reticular activating system that maintains consciousness, plus cardiorespiratory control."},
{id:"f18",deck:"Foundations",tier:1,tags:["basics"],q:"What does the thalamus do, in one line?",a:"It is the relay station: nearly all sensory information passes through it on the way to the cortex, and it also participates in memory, arousal and attention."},
{id:"f19",deck:"Foundations",tier:1,tags:["basics"],q:"What is the internal capsule and why does a small stroke there cause a big deficit?",a:"A compact white matter bundle carrying motor and sensory fibres between the cortex and the brainstem/cord. Because the fibres are packed tightly together, a tiny infarct can produce a dense hemiplegia."},
{id:"f20",deck:"Foundations",tier:1,tags:["basics"],q:"What is a lacunar infarct?",a:"A small infarct in deep brain tissue caused by disease of a single small perforating artery, typically from chronic hypertension and diabetes. It produces deficits without cortical signs."},
{id:"f21",deck:"Foundations",tier:1,tags:["basics"],q:"What are 'cortical signs', and why do they matter?",a:"Aphasia, neglect, visual field loss, apraxia, agnosia — functions that require cerebral cortex. Their <b>presence</b> points to a cortical (large vessel) stroke; their <b>absence</b> with a hemiparesis points to a small deep (lacunar) infarct."},
{id:"f22",deck:"Foundations",tier:1,tags:["basics"],q:"What is a homonymous hemianopia?",a:"Loss of the same half of the visual field in both eyes — for example the right half of vision in each eye. It localises behind the optic chiasm, on the side opposite the field loss."},
{id:"f23",deck:"Foundations",tier:1,tags:["basics"],q:"What does the cerebellum do, and what happens when it is damaged on one side?",a:"It coordinates movement and balance. Damage causes <b>ipsilateral</b> incoordination — limb ataxia, dysmetria, intention tremor, and a tendency to fall toward the side of the lesion. Cerebellar connections cross twice, which is why the effect is same-sided."},
{id:"f24",deck:"Foundations",tier:1,tags:["basics"],q:"What is Horner syndrome and what are its three signs?",a:"Interruption of the sympathetic supply to the eye. Ptosis (drooping lid), miosis (small pupil) and anhidrosis (reduced sweating) on the same side."},
{id:"f25",deck:"Foundations",tier:1,tags:["basics"],q:"Name the main modifiable risk factors for ischaemic stroke.",a:"Hypertension (the single biggest), diabetes, hyperlipidaemia, smoking, atrial fibrillation, obesity and physical inactivity, excess alcohol, and obstructive sleep apnoea."},
{id:"f26",deck:"Foundations",tier:1,tags:["basics"],q:"Why does atrial fibrillation cause stroke?",a:"The fibrillating atrium does not contract effectively, so blood stagnates — particularly in the left atrial appendage — and clots form. These embolise to the brain, typically producing large cortical infarcts."},
{id:"f27",deck:"Foundations",tier:1,tags:["haemostasis"],q:"What are the two arms of haemostasis?",a:"<b>Primary haemostasis</b> — platelets adhere, activate and aggregate to form an initial plug.<br><b>Secondary haemostasis</b> — the coagulation cascade generates thrombin, which converts fibrinogen to fibrin and stabilises the plug."},
{id:"f28",deck:"Foundations",tier:1,tags:["haemostasis"],q:"What is a platelet, and what is unusual about it?",a:"A small cell fragment shed from megakaryocytes that plugs vascular injury. Critically, it has <b>no nucleus</b>, so it cannot synthesise new protein — which is why irreversible drugs like aspirin disable it for its entire lifespan."},
{id:"f29",deck:"Foundations",tier:1,tags:["haemostasis"],q:"Roughly how long does a platelet live?",a:"About 7 to 10 days. Around 10% of the circulating pool is replaced each day."},
{id:"f30",deck:"Foundations",tier:1,tags:["haemostasis"],q:"What are the three steps of platelet plug formation?",a:"<b>Adhesion</b> — platelets stick to exposed collagen and von Willebrand factor at the injury.<br><b>Activation</b> — they change shape and release granules containing ADP and thromboxane, recruiting more platelets.<br><b>Aggregation</b> — activated GPIIb/IIIa receptors bind fibrinogen, cross-linking platelets to each other."},
{id:"f31",deck:"Foundations",tier:1,tags:["haemostasis"],q:"In one sentence, what does the coagulation cascade produce and why?",a:"A series of enzyme activations that ends in <b>thrombin</b>, which converts soluble fibrinogen into insoluble fibrin — the mesh that turns a loose platelet plug into a stable clot."},
{id:"f32",deck:"Foundations",tier:1,tags:["haemostasis"],q:"What is the difference between an antiplatelet and an anticoagulant, in plain terms?",a:"<b>Antiplatelets</b> act on platelets — primary haemostasis. They are used mainly for arterial clots, which are platelet-rich ('white clots'), such as most non-cardioembolic strokes.<br><b>Anticoagulants</b> act on the clotting cascade. They are used mainly for venous and cardiac-source clots, which are fibrin-rich ('red clots'), such as atrial fibrillation and DVT."},
{id:"f33",deck:"Foundations",tier:1,tags:["haemostasis"],q:"What does a thrombolytic do, and how is that different from an anticoagulant?",a:"A thrombolytic <b>dissolves a clot that already exists</b>, by converting plasminogen to plasmin which digests fibrin. An anticoagulant only <b>prevents further clot</b> from forming — it does not break down what is already there."},
{id:"f34",deck:"Foundations",tier:1,tags:["drugs"],q:"Name the main classes of antiplatelet drug and one example of each.",a:"<ul><li>COX-1 inhibitor — aspirin</li><li>P2Y12 (ADP receptor) blocker — clopidogrel</li><li>Phosphodiesterase inhibitor — dipyridamole</li><li>GPIIb/IIIa blocker — tirofiban</li></ul>"},
{id:"f35",deck:"Foundations",tier:1,tags:["drugs"],q:"Name the main classes of anticoagulant and one example of each.",a:"<ul><li>Vitamin K antagonist — warfarin</li><li>Heparins (act via antithrombin) — unfractionated heparin, enoxaparin</li><li>Direct thrombin inhibitor — dabigatran</li><li>Direct factor Xa inhibitor — apixaban</li></ul>"},
{id:"f36",deck:"Foundations",tier:1,tags:["drugs"],q:"What does INR measure and which drug does it monitor?",a:"A standardised prothrombin time, reflecting the extrinsic and common pathways. It is used to monitor <b>warfarin</b>. It does not usefully measure the direct oral anticoagulants."},
{id:"f37",deck:"Foundations",tier:1,tags:["drugs"],q:"What does 'DOAC' stand for and which drugs are in the class?",a:"Direct Oral AntiCoagulant. Dabigatran (direct thrombin inhibitor) plus apixaban, rivaroxaban and edoxaban (direct factor Xa inhibitors). They act directly on a single factor, unlike warfarin and heparin which act indirectly."},
{id:"f38",deck:"Foundations",tier:1,tags:["imaging"],q:"Why is a non-contrast head CT the first scan in acute stroke?",a:"It is fast and universally available, and its job is to answer one question: <b>is there blood?</b> Distinguishing haemorrhage from ischaemia determines whether thrombolysis is possible at all."},
{id:"f39",deck:"Foundations",tier:1,tags:["imaging"],q:"Which MRI sequence shows acute infarction earliest, and how fast?",a:"<b>DWI</b> — diffusion-weighted imaging. It becomes positive within minutes of onset, long before changes appear on CT."},
{id:"f40",deck:"Foundations",tier:1,tags:["imaging"],q:"What is CT angiography used for in acute stroke?",a:"To find a large vessel occlusion — a clot in a proximal artery such as the terminal ICA, MCA M1 or basilar — because those are the patients who may benefit from mechanical thrombectomy."},
{id:"f41",deck:"Foundations",tier:1,tags:["basics"],q:"What is the NIHSS?",a:"The National Institutes of Health Stroke Scale, a 0–42 point standardised examination scoring stroke severity across level of consciousness, gaze, fields, facial and limb power, ataxia, sensation, language, dysarthria and neglect. Higher is worse."},
{id:"f42",deck:"Foundations",tier:1,tags:["basics"],q:"What is the penumbra?",a:"Tissue around the infarct core that is critically underperfused but not yet dead. It is functionally silent but structurally alive, and it is what reperfusion treatment is trying to save. Without restored flow it progressively becomes core."},
{id:"f43",deck:"Foundations",tier:1,tags:["basics"],q:"What does 'watershed' or 'borderzone' mean?",a:"The territory at the far edge of two arterial supplies, where perfusion pressure is lowest. These regions suffer first when blood pressure or flow drops globally, so watershed infarcts point to hypoperfusion rather than embolism."},
{id:"f44",deck:"Foundations",tier:1,tags:["basics"],q:"Which is more common, ischaemic or haemorrhagic stroke?",a:"Ischaemic, by a wide margin — roughly 85% of strokes. The remainder are haemorrhagic: intracerebral haemorrhage and subarachnoid haemorrhage."},
{id:"f45",deck:"Foundations",tier:1,tags:["basics"],q:"Why can you not tell ischaemic from haemorrhagic stroke on clinical examination alone?",a:"Because both produce sudden focal neurological deficits from the same anatomical territories. Headache, vomiting and depressed consciousness are more common with haemorrhage but are not reliable. Imaging is mandatory before any antithrombotic or thrombolytic is given."},
// ============ DECK: Neurovascular anatomy ============
{id:"a01",deck:"Anatomy",tags:["ICA"],q:"Name the seven segments of the internal carotid artery in order.",a:"C1 cervical → C2 petrous → C3 lacerum → C4 cavernous → C5 clinoid → C6 ophthalmic → C7 communicating (Bouthillier classification)."},
{id:"a02",deck:"Anatomy",tags:["ICA"],q:"Which ICA segment gives off the ophthalmic artery?",a:"C6, the ophthalmic segment — just distal to the distal dural ring."},
{id:"a03",deck:"Anatomy",tags:["ICA"],q:"Which two branches arise from the communicating (C7) segment of the ICA?",a:"The posterior communicating artery and the anterior choroidal artery, in that order, before the terminal bifurcation into ACA and MCA."},
{id:"a04",deck:"Anatomy",tags:["AChA"],q:"What does the anterior choroidal artery supply?",a:"<ul><li>Posterior limb of the internal capsule (and genu)</li><li>Optic tract</li><li>Lateral geniculate body</li><li>Medial globus pallidus</li><li>Uncus and part of the hippocampus</li><li>Tail of the caudate and choroid plexus</li></ul>"},
{id:"a05",deck:"Anatomy",tags:["AChA"],q:"What is the classic clinical triad of anterior choroidal artery infarction?",a:"Contralateral hemiplegia, hemianesthesia, and homonymous hemianopia — with cortical functions preserved."},
{id:"a06",deck:"Anatomy",tags:["ACA"],q:"What territory does the anterior cerebral artery supply?",a:"Medial surface of the frontal and parietal lobes, the paracentral lobule (leg and foot motor/sensory cortex), the supplementary motor area, and the anterior four-fifths of the corpus callosum."},
{id:"a07",deck:"Anatomy",tags:["ACA","perforators"],q:"Where does the recurrent artery of Heubner arise, and what does it supply?",a:"Arises near the A1–A2 junction and doubles back. Supplies the anterior limb of the internal capsule, head of the caudate, and anterior putamen."},
{id:"a08",deck:"Anatomy",tags:["ACA","perforators"],q:"Why does a Heubner infarct cause face and arm weakness rather than leg weakness?",a:"Because Heubner supplies the anterior limb of the internal capsule and basal ganglia, not the medial cortex. The ACA-equals-leg rule applies to the cortical territory, not to this perforator — which is precisely why it is tested."},
{id:"a09",deck:"Anatomy",tags:["MCA"],q:"Which MCA segment gives rise to the lateral lenticulostriate arteries?",a:"M1, the horizontal/sphenoidal segment."},
{id:"a10",deck:"Anatomy",tags:["MCA","perforators"],q:"What do the lateral lenticulostriate arteries supply?",a:"Putamen, globus pallidus, external capsule, posterior limb of the internal capsule, corona radiata, and body of the caudate."},
{id:"a11",deck:"Anatomy",tags:["MCA"],q:"What are the four MCA segments?",a:"M1 horizontal (sphenoidal) → M2 insular → M3 opercular → M4 cortical."},
{id:"a12",deck:"Anatomy",tags:["MCA"],q:"What does the superior division of the MCA supply, and what deficit follows occlusion?",a:"Lateral frontal cortex including the precentral gyrus and Broca area. Occlusion gives face and arm weakness greater than leg, with a non-fluent (Broca) aphasia if dominant."},
{id:"a13",deck:"Anatomy",tags:["MCA"],q:"What does the inferior division of the MCA supply, and what deficit follows occlusion?",a:"Temporal and inferior parietal cortex including Wernicke area and Meyer loop. Occlusion gives fluent (Wernicke) aphasia if dominant, superior quadrantanopia, and neglect if non-dominant — typically without weakness."},
{id:"a14",deck:"Anatomy",tags:["PCA"],q:"Name the four segments of the posterior cerebral artery.",a:"P1 precommunicating → P2 ambient → P3 quadrigeminal → P4 calcarine."},
{id:"a15",deck:"Anatomy",tags:["PCA","perforators"],q:"Which artery arises from P1 and supplies the paramedian thalamus?",a:"The paramedian thalamoperforating arteries. When a single dominant trunk supplies both sides it is called the artery of Percheron."},
{id:"a16",deck:"Anatomy",tags:["thalamus"],q:"Name the four arterial territories of the thalamus and their parent vessels.",a:"<ul><li><b>Tuberothalamic (polar)</b> — from the posterior communicating artery</li><li><b>Paramedian</b> — from P1</li><li><b>Inferolateral (thalamogeniculate)</b> — from P2</li><li><b>Posterior choroidal</b> — from P2</li></ul>"},
{id:"a17",deck:"Anatomy",tags:["variants"],q:"What is a fetal PCA?",a:"A variant in which the posterior cerebral artery is supplied predominantly or entirely by the internal carotid through a large posterior communicating artery, with a hypoplastic or absent P1. It makes the occipital lobe vulnerable to anterior circulation disease."},
{id:"a18",deck:"Anatomy",tags:["variants"],q:"Why does the artery of Percheron produce a bilateral infarct from a single occlusion?",a:"Because in that variant one dominant thalamoperforating trunk arising from a single P1 supplies the paramedian territory of both thalami, and often the rostral midbrain as well."},
{id:"a19",deck:"Anatomy",tags:["vertebral"],q:"Name the four segments of the vertebral artery.",a:"V1 preforaminal (origin to C6) → V2 foraminal (C6 to C2) → V3 extraspinal/atlantic (C2 to the dura) → V4 intradural."},
{id:"a20",deck:"Anatomy",tags:["vertebral"],q:"Which vertebral artery segment gives off PICA, and which gives the anterior spinal artery?",a:"Both arise from V4, the intradural segment. The paired anterior spinal contributions merge into a single midline vessel."},
{id:"a21",deck:"Anatomy",tags:["cerebellum"],q:"Which cerebellar artery supplies the lateral medulla and inferior cerebellum?",a:"PICA — though the lateral medullary syndrome is more often caused by vertebral artery occlusion than by occlusion of PICA itself."},
{id:"a22",deck:"Anatomy",tags:["cerebellum"],q:"Which artery supplies the inner ear, and from what does it arise?",a:"The labyrinthine (internal auditory) artery, usually a branch of AICA. This is why AICA infarction can cause deafness."},
{id:"a23",deck:"Anatomy",tags:["cerebellum"],q:"What does the superior cerebellar artery supply?",a:"The superior cerebellar hemisphere, superior vermis, dentate nucleus, and superior cerebellar peduncle."},
{id:"a24",deck:"Anatomy",tags:["brainstem"],q:"State the four midline 'M' structures of the brainstem.",a:"<ul><li><b>M</b>otor pathway (corticospinal tract)</li><li><b>M</b>edial lemniscus</li><li><b>M</b>edial longitudinal fasciculus</li><li><b>M</b>otor cranial nerve nuclei that divide into 12 — III, IV, VI, XII</li></ul>"},
{id:"a25",deck:"Anatomy",tags:["brainstem"],q:"State the four lateral 'S' structures of the brainstem.",a:"<ul><li><b>S</b>pinocerebellar tract</li><li><b>S</b>pinothalamic tract</li><li><b>S</b>ensory nucleus of the trigeminal nerve</li><li><b>S</b>ympathetic tract (descending)</li></ul>"},
{id:"a26",deck:"Anatomy",tags:["brainstem"],q:"Which cranial nerves localize to the medulla, pons, and above the pons?",a:"Medulla: IX, X, XI, XII. Pons: V, VI, VII, VIII. Above the pons (midbrain and forebrain): I, II, III, IV."},
{id:"a27",deck:"Anatomy",tags:["brainstem"],q:"Which arteries supply the medial versus lateral brainstem?",a:"Medial (paramedian) structures are supplied by paramedian perforators arising directly from the basilar or vertebral trunk. Lateral structures are supplied by short and long circumferential arteries, including PICA, AICA and SCA."},
{id:"a28",deck:"Anatomy",tags:["cord"],q:"What does the anterior spinal artery supply, and what is spared?",a:"The anterior two-thirds of the cord — corticospinal tracts, spinothalamic tracts, and anterior horns. The dorsal columns are spared because they are supplied by the paired posterior spinal arteries."},
{id:"a29",deck:"Anatomy",tags:["cord"],q:"What is the artery of Adamkiewicz?",a:"The dominant radicular artery supplying the lower thoracic and lumbar cord. It usually arises between T9 and L2 and more often from the left. It is the vessel at risk in aortic surgery and dissection."},
{id:"a30",deck:"Anatomy",tags:["venous"],q:"What does the vein of Labbé drain, and where does it terminate?",a:"The inferior anastomotic vein — it drains the lateral temporal cortex into the transverse sinus."},
{id:"a31",deck:"Anatomy",tags:["venous"],q:"What structures does the deep cerebral venous system drain, and what happens when it thromboses?",a:"Internal cerebral veins and the vein of Galen drain into the straight sinus, carrying blood from the deep grey matter. Thrombosis produces bilateral thalamic and basal ganglia edema, often with rapid decline in consciousness."},
{id:"a32",deck:"Anatomy",tags:["venous"],q:"What is the vein of Trolard?",a:"The superior anastomotic vein, connecting the superficial middle cerebral vein to the superior sagittal sinus."},
{id:"a33",deck:"Anatomy",tags:["watershed"],q:"Distinguish cortical from internal borderzone infarcts.",a:"<b>Cortical (external):</b> between ACA-MCA or MCA-PCA cortical territories; wedge-shaped, at the convexity.<br><b>Internal:</b> between the lenticulostriate and deep medullary perforators, in the corona radiata and centrum semiovale; linear 'rosary bead' pattern parallel to the lateral ventricle."},
{id:"a34",deck:"Anatomy",tags:["watershed"],q:"Why does an ACA-MCA borderzone infarct cause proximal arm weakness with distal sparing?",a:"The borderzone crosses the homunculus at the shoulder and proximal arm representation, between the leg (medial, ACA) and hand/face (lateral, MCA) areas. This is the 'man in a barrel' pattern."},
{id:"a35",deck:"Anatomy",tags:["collaterals"],q:"Name the principal collateral pathways to the intracranial circulation.",a:"<ul><li>Circle of Willis (primary)</li><li>Ophthalmic artery from ECA to ICA</li><li>Leptomeningeal (pial) collaterals between ACA, MCA and PCA</li><li>Occipital-to-vertebral muscular anastomoses</li></ul>"},
{id:"a36",deck:"Anatomy",tags:["circle of Willis"],q:"Which vessels form the circle of Willis?",a:"Anterior communicating artery, both A1 segments, both internal carotid termini, both posterior communicating arteries, and both P1 segments."},
{id:"a37",deck:"Anatomy",tags:["circle of Willis"],q:"How often is the circle of Willis anatomically complete?",a:"A minority of people — most have at least one hypoplastic or absent component. Incompleteness is the rule, and it is why collateral capacity varies so much between patients."},
{id:"a38",deck:"Anatomy",tags:["occipital"],q:"Why is the macula spared in PCA occipital infarction?",a:"The occipital pole, which represents the macula, receives collateral supply from distal MCA branches in addition to the PCA."},
// ============ DECK: Stroke syndromes ============
{id:"s01",deck:"Syndromes",tags:["medulla"],q:"A patient has ipsilateral facial numbness, contralateral body numbness, Horner syndrome, hoarseness and ipsilateral ataxia — with normal strength. Localize and name the vessel.",a:"Lateral medulla — Wallenberg syndrome. Most often vertebral artery occlusion rather than PICA. Strength is normal because the pyramid is medial."},
{id:"s02",deck:"Syndromes",tags:["medulla"],q:"Contralateral hemiparesis sparing the face, contralateral loss of vibration and position sense, and tongue deviating toward the lesion. Where and which vessel?",a:"Medial medulla — Dejerine syndrome. Anterior spinal artery or vertebral perforators. The three medial structures: pyramid, medial lemniscus, hypoglossal."},
{id:"s03",deck:"Syndromes",tags:["pons"],q:"Which single finding best distinguishes AICA territory infarction from Wallenberg syndrome?",a:"Deafness. The labyrinthine artery arises from AICA. Ipsilateral peripheral facial weakness also favors AICA, since the facial nucleus is pontine."},
{id:"s04",deck:"Syndromes",tags:["midbrain"],q:"Contrast Weber, Benedikt and Claude syndromes.",a:"All three have an ipsilateral third nerve palsy.<ul><li><b>Weber</b> — ventral, cerebral peduncle: contralateral hemiparesis</li><li><b>Benedikt</b> — tegmentum, red nucleus: contralateral tremor or chorea</li><li><b>Claude</b> — tegmentum, superior cerebellar peduncle: contralateral ataxia</li></ul>"},
{id:"s05",deck:"Syndromes",tags:["pons"],q:"What are the components of one-and-a-half syndrome?",a:"An ipsilateral horizontal gaze palsy (abducens nucleus or PPRF) plus an ipsilateral internuclear ophthalmoplegia (MLF). The only preserved horizontal movement is abduction of the contralateral eye."},
{id:"s06",deck:"Syndromes",tags:["pons"],q:"How is consciousness preserved in locked-in syndrome, and what movement remains?",a:"The lesion is confined to the ventral pons, sparing the reticular activating system in the tegmentum. Vertical gaze and blinking survive because those centres are in the midbrain, above the lesion."},
{id:"s07",deck:"Syndromes",tags:["gaze"],q:"In a hemispheric stroke the eyes deviate toward the lesion. What happens with a pontine gaze palsy?",a:"The eyes deviate away from the lesion, toward the hemiparesis. A destructive pontine lesion knocks out the ipsilateral gaze centre, so the contralateral one drives the eyes away."},
{id:"s08",deck:"Syndromes",tags:["lacunar"],q:"Name the five classic lacunar syndromes and their usual locations.",a:"<ul><li>Pure motor hemiparesis — posterior limb internal capsule, corona radiata, basis pontis</li><li>Pure sensory stroke — ventral posterolateral thalamus</li><li>Sensorimotor stroke — thalamocapsular</li><li>Ataxic hemiparesis — basis pontis or internal capsule</li><li>Dysarthria–clumsy hand — basis pontis or genu of the internal capsule</li></ul>"},
{id:"s09",deck:"Syndromes",tags:["lacunar"],q:"What single exam feature most reliably separates a lacunar from a cortical stroke?",a:"The absence of cortical signs — no aphasia, neglect, visual field cut, or apraxia. A lacunar infarct affects face, arm and leg roughly equally without them."},
{id:"s10",deck:"Syndromes",tags:["ACA"],q:"What produces akinetic mutism after stroke?",a:"Bilateral medial frontal injury, typically bilateral ACA territory infarction from an azygos ACA or after anterior communicating artery aneurysm rupture."},
{id:"s11",deck:"Syndromes",tags:["PCA"],q:"Explain the anatomy of alexia without agraphia.",a:"Left PCA infarction destroys the left visual cortex and the splenium. The patient sees only with the right hemisphere, and the splenial lesion disconnects that visual information from left-hemisphere language areas. Writing is intact because language output is untouched — he cannot read what he has just written."},
{id:"s12",deck:"Syndromes",tags:["PCA"],q:"What is Anton syndrome?",a:"Cortical blindness with denial of the deficit, from bilateral occipital infarction. The patient confabulates visual experience."},
{id:"s13",deck:"Syndromes",tags:["thalamus"],q:"Describe Dejerine-Roussy syndrome and its time course.",a:"Inferolateral thalamic (thalamogeniculate) infarction causes contralateral hemisensory loss, followed weeks to months later by severe spontaneous burning pain, allodynia and hyperpathia as sensation partially recovers."},
{id:"s14",deck:"Syndromes",tags:["thalamus"],q:"A patient becomes abruptly hypersomnolent with vertical gaze palsy and dense amnesia, but has no weakness. What is the lesion?",a:"Bilateral paramedian thalamic infarction, classically from artery of Percheron occlusion, often with rostral midbrain involvement."},
{id:"s15",deck:"Syndromes",tags:["cerebellum"],q:"How do you distinguish a cerebellar infarct from vestibular neuritis at the bedside?",a:"The HINTS examination. A <i>normal</i> head impulse test, direction-changing nystagmus, or a skew deviation each point to a central cause. Paradoxically, an abnormal head impulse is reassuring for a peripheral lesion."},
{id:"s16",deck:"Syndromes",tags:["cerebellum"],q:"When does malignant swelling peak after a large cerebellar infarct, and why does it matter?",a:"Around 48 to 96 hours. The posterior fossa tolerates mass effect poorly, so brainstem compression and obstructive hydrocephalus can develop rapidly — decompression may be needed in a patient who looked stable on arrival."},
{id:"s17",deck:"Syndromes",tags:["venous"],q:"What features suggest a venous rather than arterial infarct?",a:"An infarct that crosses arterial territories, is hemorrhagic out of proportion to its size, sits parasagittally or bitemporally, presents with headache and seizures, and occurs in a young, pregnant or peripartum patient."},
{id:"s18",deck:"Syndromes",tags:["venous"],q:"Which CVST pattern produces bilateral leg weakness, and why?",a:"Superior sagittal sinus thrombosis, causing bilateral parasagittal venous infarction of the medial motor cortex where the leg is represented."},
{id:"s19",deck:"Syndromes",tags:["watershed"],q:"What mechanism should you suspect in a borderzone infarct, and what is the management implication?",a:"Hypoperfusion — severe carotid stenosis or occlusion, cardiac arrest, or profound hypotension — rather than embolism. Blood pressure should generally be supported, not lowered."},
{id:"s20",deck:"Syndromes",tags:["cord"],q:"A patient develops sudden back pain, paraplegia, loss of pain and temperature, but retains vibration and proprioception. Localize.",a:"Anterior spinal artery syndrome (Beck syndrome). Dorsal column sparing is the signature. Consider aortic dissection or aortic surgery as the cause."},
{id:"s21",deck:"Syndromes",tags:["ICA"],q:"What ocular symptom accompanies carotid disease, and what causes it?",a:"Amaurosis fugax — transient monocular visual loss from embolism to the ophthalmic artery, a branch of the ICA. Monocular visual loss localizes to the eye or optic nerve, not the cortex."},
{id:"s22",deck:"Syndromes",tags:["MCA"],q:"What is the significance of gaze deviation toward the side of a hemiparesis?",a:"It is unexpected for a hemispheric lesion and should redirect you to the brainstem, or raise the possibility of a seizure with a contraversive gaze deviation."},
// ============ DECK: Antithrombotics ============
{id:"p01",deck:"Antithrombotics",tags:["aspirin"],q:"By what molecular mechanism does aspirin inhibit platelets, and why does the effect last so long?",a:"It irreversibly acetylates a serine residue in the COX-1 active site, blocking thromboxane A2 synthesis. Platelets are anucleate and cannot resynthesize COX-1, so inhibition persists for the platelet lifespan of 7–10 days — long after the drug has cleared."},
{id:"p02",deck:"Antithrombotics",tags:["aspirin"],q:"Roughly what fraction of the platelet pool is replaced each day, and why does that matter clinically?",a:"About 10%. It sets the rate of recovery of platelet function after aspirin is stopped and underlies preoperative hold periods."},
{id:"p03",deck:"Antithrombotics",tags:["P2Y12"],q:"Why is clopidogrel's antiplatelet effect variable between patients?",a:"It is a prodrug requiring two-step hepatic oxidation, largely by CYP2C19. Loss-of-function alleles yield poor metabolizers with reduced active metabolite and blunted platelet inhibition. Around 85% of absorbed drug is also shunted to an inactive metabolite by esterases."},
{id:"p04",deck:"Antithrombotics",tags:["P2Y12"],q:"Which P2Y12 inhibitors require metabolic activation and which do not?",a:"<b>Prodrugs:</b> clopidogrel (two CYP steps) and prasugrel (one CYP step).<br><b>Directly active:</b> ticagrelor and cangrelor."},
{id:"p05",deck:"Antithrombotics",tags:["P2Y12"],q:"Which P2Y12 inhibitors bind reversibly?",a:"Ticagrelor and cangrelor. Clopidogrel and prasugrel form irreversible covalent bonds and inhibit for the platelet lifespan."},
{id:"p06",deck:"Antithrombotics",tags:["P2Y12"],q:"Why is prasugrel contraindicated in patients with prior stroke or TIA?",a:"Its more potent and consistent P2Y12 blockade produced a net clinical harm in that population, driven by intracranial hemorrhage."},
{id:"p07",deck:"Antithrombotics",tags:["P2Y12"],q:"What characteristic side effect does ticagrelor cause, and by what mechanism?",a:"Dyspnea, attributed to inhibition of cellular adenosine uptake and consequent adenosine accumulation. It is usually benign but a common reason for discontinuation."},
{id:"p08",deck:"Antithrombotics",tags:["dipyridamole"],q:"What is dipyridamole's dual mechanism?",a:"It inhibits phosphodiesterase, so cAMP and cGMP accumulate, and it blocks adenosine reuptake, raising extracellular adenosine which further raises platelet cAMP. High cAMP suppresses platelet activation."},
{id:"p09",deck:"Antithrombotics",tags:["GPIIbIIIa"],q:"Why are GPIIb/IIIa inhibitors the most potent antiplatelet class?",a:"They block the final common pathway — fibrinogen cross-bridging between platelets — so no upstream agonist can produce aggregation. That potency is also why they carry the highest bleeding risk."},
{id:"p10",deck:"Antithrombotics",tags:["heparin"],q:"How does unfractionated heparin work?",a:"A specific pentasaccharide sequence binds antithrombin and causes a conformational change that accelerates antithrombin's inhibition of thrombin and factor Xa roughly a thousandfold. Heparin is a catalyst; antithrombin does the inhibiting."},
{id:"p11",deck:"Antithrombotics",tags:["heparin"],q:"Why does low molecular weight heparin inhibit factor Xa more than thrombin?",a:"Inhibiting thrombin requires the heparin chain to bridge antithrombin and thrombin simultaneously, which needs at least 18 saccharide units. Inhibiting Xa needs only antithrombin binding. Shorter LMWH chains retain anti-Xa activity but lose the bridging capacity."},
{id:"p12",deck:"Antithrombotics",tags:["heparin"],q:"Why does fondaparinux have no anti-thrombin (anti-IIa) activity at all?",a:"It is only the synthetic pentasaccharide — far too short to bridge antithrombin to thrombin. It produces pure factor Xa inhibition."},
{id:"p13",deck:"Antithrombotics",tags:["heparin","HIT"],q:"What is the pathophysiology of heparin-induced thrombocytopenia, and how does it present?",a:"IgG antibodies against heparin–platelet factor 4 complexes cross-link platelet Fc receptors, causing platelet activation and consumption. It presents with thrombocytopenia and <i>thrombosis</i>, not bleeding, typically 5–10 days after exposure."},
{id:"p14",deck:"Antithrombotics",tags:["HIT"],q:"How is heparin-induced thrombocytopenia managed?",a:"Stop all heparin, including flushes and coated catheters, and start a non-heparin anticoagulant such as argatroban, bivalirudin or fondaparinux. Do not start warfarin alone while the platelet count is low — it risks venous limb gangrene."},
{id:"p15",deck:"Antithrombotics",tags:["warfarin"],q:"What is warfarin's molecular target and downstream effect?",a:"It inhibits vitamin K epoxide reductase (VKORC1), preventing regeneration of reduced vitamin K. Without it, factors II, VII, IX and X and proteins C and S cannot be gamma-carboxylated and are functionally inactive."},
{id:"p16",deck:"Antithrombotics",tags:["warfarin"],q:"Why is warfarin transiently prothrombotic when started?",a:"Protein C, a natural anticoagulant, has a much shorter half-life than factors II, IX and X, so it falls first. The result is a brief net procoagulant window — the mechanism of warfarin-induced skin necrosis and the reason for parenteral overlap."},
{id:"p17",deck:"Antithrombotics",tags:["warfarin"],q:"Why does the INR rise before warfarin is therapeutically effective?",a:"Factor VII has the shortest half-life of the vitamin K–dependent factors and drives the prothrombin time. The INR therefore reflects VII depletion days before factor II (prothrombin), which carries most of the antithrombotic effect, has fallen."},
{id:"p18",deck:"Antithrombotics",tags:["DOAC"],q:"Which DOAC is a direct thrombin inhibitor, and which are factor Xa inhibitors?",a:"Dabigatran inhibits thrombin (IIa). Apixaban, rivaroxaban and edoxaban inhibit factor Xa — the '-xaban' suffix marks the class."},
{id:"p19",deck:"Antithrombotics",tags:["DOAC"],q:"Which DOAC is most renally cleared, and which is least?",a:"Dabigatran is the most renally dependent at roughly 80%. Apixaban is the least at roughly 27%, which is why it is generally favored in significant chronic kidney disease."},
{id:"p20",deck:"Antithrombotics",tags:["DOAC"],q:"Which DOAC can be removed by hemodialysis, and why?",a:"Dabigatran, because it has low plasma protein binding. The factor Xa inhibitors are highly protein bound and are not meaningfully dialyzable."},
{id:"p21",deck:"Antithrombotics",tags:["reversal"],q:"Match each anticoagulant to its specific reversal agent.",a:"<ul><li>Unfractionated heparin → protamine (complete)</li><li>LMWH → protamine (partial, ~60%)</li><li>Fondaparinux → no protamine reversal</li><li>Warfarin → vitamin K plus 4-factor PCC</li><li>Dabigatran → idarucizumab</li><li>Apixaban / rivaroxaban → andexanet alfa, or 4F-PCC</li></ul>"},
{id:"p22",deck:"Antithrombotics",tags:["reversal"],q:"Why must vitamin K be given alongside PCC for warfarin reversal?",a:"PCC replaces circulating factors within minutes but is consumed within hours, while warfarin still blocks VKORC1. Vitamin K restores endogenous synthesis over hours. Omitting it produces rebound coagulopathy."},
{id:"p23",deck:"Antithrombotics",tags:["reversal"],q:"How does andexanet alfa work?",a:"It is a catalytically inactive modified recombinant factor Xa that retains inhibitor binding, acting as a decoy that sequesters apixaban and rivaroxaban away from native factor Xa."},
{id:"p24",deck:"Antithrombotics",tags:["reversal"],q:"How does idarucizumab work, and what does it not reverse?",a:"A monoclonal antibody fragment binding dabigatran with affinity far exceeding dabigatran's affinity for thrombin. It has no effect on factor Xa inhibitors."},
{id:"p25",deck:"Antithrombotics",tags:["lytics"],q:"What makes tenecteplase pharmacologically different from alteplase?",a:"Three engineered modifications give it a longer half-life (permitting single-bolus administration), greater fibrin specificity, and resistance to plasminogen activator inhibitor-1."},
{id:"p26",deck:"Antithrombotics",tags:["lytics"],q:"What does 'fibrin specificity' mean for a thrombolytic?",a:"The agent's catalytic efficiency for converting plasminogen to plasmin rises sharply in the presence of fibrin, so lysis is concentrated at the clot rather than producing a systemic lytic state."},
{id:"p27",deck:"Antithrombotics",tags:["lytics"],q:"Which thrombolytic complication is associated with ACE inhibitors?",a:"Orolingual angioedema, which is more frequent in patients taking ACE inhibitors. It can be hemi-orolingual, contralateral to the infarct."},
{id:"p28",deck:"Antithrombotics",tags:["factor XI"],q:"What is the therapeutic rationale for factor XI inhibition?",a:"Factor XI contributes substantially to pathological thrombus propagation but relatively little to normal hemostatic plug formation — so inhibiting it may uncouple antithrombotic benefit from bleeding risk. The clinical observation behind this: congenital factor XI deficiency causes mild, mostly trauma-related bleeding, yet appears to protect against thrombosis."},
{id:"p28b",deck:"Antithrombotics",tags:["factor XI"],q:"Why did factor XI inhibition succeed in non-cardioembolic stroke but fail in atrial fibrillation?",a:"The results split by population, and the split is the point.<ul><li><b>Atrial fibrillation:</b> asundexian was <i>inferior</i> to apixaban (OCEANIC-AF, stopped early). A DOAC remains standard.</li><li><b>Non-cardioembolic stroke / high-risk TIA:</b> asundexian added to antiplatelet therapy cut recurrent stroke ~26% with no increase in ISTH major bleeding (OCEANIC-STROKE, 2026) — the first successful phase III of the class.</li></ul>Milvexian's LIBREXIA-STROKE is ongoing, results expected late 2026; LIBREXIA-ACS stopped early for futility."},
{id:"p29",deck:"Antithrombotics",tags:["APS"],q:"Which anticoagulant is preferred in antiphospholipid syndrome, and why?",a:"Warfarin. A direct oral anticoagulant performed worse than warfarin in triple-positive antiphospholipid syndrome, with excess thrombotic events."},
{id:"p30",deck:"Antithrombotics",tags:["valves"],q:"What is the only acceptable oral anticoagulant for a mechanical heart valve?",a:"Warfarin. Dabigatran caused excess thromboembolism and bleeding in mechanical valve patients and is contraindicated; the factor Xa inhibitors are not established for this indication either."},
{id:"p31",deck:"Antithrombotics",tags:["DAPT"],q:"Why is long-term dual antiplatelet therapy avoided after stroke?",a:"Trials of prolonged aspirin-plus-clopidogrel showed the bleeding hazard accumulates steadily while the ischemic benefit is concentrated in the first weeks. Extended DAPT increased hemorrhage without net benefit."},
{id:"p32",deck:"Antithrombotics",tags:["DAPT"],q:"What is the general principle governing DAPT duration after minor stroke or high-risk TIA?",a:"Short-course DAPT started early captures the period of highest recurrence risk, then steps down to monotherapy. <b>Confirm the exact duration and agent against the current guideline</b> — the specific windows have shifted between trials and recommendations."},
{id:"p33",deck:"Antithrombotics",tags:["cascade"],q:"Which pathway does the PT/INR measure, and which does the aPTT measure?",a:"PT/INR measures the extrinsic and common pathways (tissue factor, VII, X, V, II, fibrinogen). aPTT measures the intrinsic and common pathways (XII, XI, IX, VIII, X, V, II, fibrinogen)."},
{id:"p34",deck:"Antithrombotics",tags:["cascade"],q:"Which clotting factor cross-links fibrin, and what activates it?",a:"Factor XIII, activated by thrombin. It covalently cross-links fibrin monomers into a stable clot."},
{id:"p35",deck:"Antithrombotics",tags:["cascade"],q:"Name the vitamin K–dependent clotting factors and anticoagulant proteins.",a:"Factors II, VII, IX and X, plus proteins C and S. The mnemonic 1972 gives the factors."},
{id:"p36",deck:"Antithrombotics",tags:["dissection"],q:"What is the evidence-based approach to antithrombotic choice in cervical artery dissection?",a:"Randomized comparisons have not shown clear superiority of anticoagulation over antiplatelet therapy, and event rates were low in both arms. Either is generally acceptable. <b>Confirm against current guidance</b>, as newer data continue to accumulate."},
{id:"p37",deck:"Antithrombotics",tags:["CVST"],q:"Should cerebral venous sinus thrombosis be anticoagulated when there is already hemorrhage?",a:"Yes. Venous hemorrhagic infarction results from the outflow obstruction itself, so anticoagulation treats the cause. Pre-existing hemorrhage is not a contraindication."},
{id:"p38",deck:"Antithrombotics",tags:["ICAS"],q:"What did the trial evidence establish about stenting for symptomatic intracranial atherosclerosis?",a:"Aggressive medical management — dual antiplatelet therapy for a defined period, high-intensity statin, and risk factor control — outperformed percutaneous stenting, which carried a high periprocedural stroke rate. SAMMPRIS established this and <b>CASSISS</b> confirmed it (8.0% vs 7.2%, P=0.82), with long-term follow-up reinforcing the result."},
// ============ DECK: What changed (2024–2026) ============
{id:"u01",deck:"Updates",tier:3,tags:["CREST-2","carotid"],q:"What did CREST-2 show for asymptomatic high-grade carotid stenosis?",a:"The two arms <b>split</b>.<ul><li><b>Stenting</b> plus intensive medical management beat medical management alone — 2.8% vs 6.0%, P=0.02</li><li><b>Endarterectomy</b> did not — 3.7% vs 5.3%, P=0.24</li></ul>Intensive medical management meant systolic BP ≤130 and LDL ≤70 with lifestyle coaching."},
{id:"u02",deck:"Updates",tier:3,tags:["CREST-2"],q:"In CREST-2, what did 'intensive medical management' actually consist of?",a:"Cardiovascular risk factor management with drugs plus lifestyle coaching, targeting a <b>systolic blood pressure ≤130 mmHg</b> and <b>LDL cholesterol ≤70 mg/dL</b>. This was the comparator both revascularisation arms had to beat — and only stenting did."},
{id:"u03",deck:"Updates",tier:3,tags:["anticoagulation","timing"],q:"What replaced the 1-3-6-12 day rule for starting anticoagulation after a cardioembolic stroke?",a:"Trial evidence that <b>early initiation is safe</b>. OPTIMAS found starting a DOAC within <b>4 days</b> non-inferior to day 7–14. ELAN started within 48 hours for minor and moderate strokes and day 6–7 for major strokes. Across ELAN, OPTIMAS and START, symptomatic intracranial haemorrhage was very rare in both arms. The old rule was expert consensus, never trial-derived."},
{id:"u04",deck:"Updates",tier:3,tags:["thrombectomy","MeVO"],q:"What did DISTAL, ESCAPE-MeVO and DISCOUNT show about thrombectomy for distal and medium vessel occlusions?",a:"<b>All three were neutral or negative.</b> ESCAPE-MeVO: mRS 0–1 in 41.6% with thrombectomy vs 43.1% without, with <i>more</i> symptomatic haemorrhage (5.4% vs 2.2%) and higher mortality (13.3% vs 8.4%). DISTAL found no reduction in disability or death. DISCOUNT was halted early for safety and futility. The benefit established for proximal large vessel occlusion does not extend distally."},
{id:"u05",deck:"Updates",tier:3,tags:["AF","device-detected"],q:"What is the net effect of anticoagulating device-detected subclinical atrial fibrillation?",a:"Pooling ARTESiA and NOAH-AFNET 6: roughly a <b>32% relative reduction in stroke</b> against roughly a <b>62% relative increase in major bleeding</b>. NOAH-AFNET 6 stopped early for excess bleeding with a trend toward futility. The current framing is shared decision-making — device-detected AF is not the same entity as clinical AF."},
{id:"u06",deck:"Updates",tier:3,tags:["colchicine"],q:"Did colchicine reduce recurrent stroke?",a:"No, not in the short term. <b>CHANCE-3</b> was neutral — any stroke at 90 days in 6.3% on colchicine vs 6.5% on placebo (P=0.79), with neutral secondary outcomes. CONVINCE showed a trend on a composite vascular endpoint but was underpowered for stroke alone. Meta-analyses suggest possible benefit only beyond six months. Not standard of care."},
{id:"u07",deck:"Updates",tier:3,tags:["dissection"],q:"What did STOP-CAD add to the antiplatelet-versus-anticoagulant question in cervical artery dissection?",a:"Anticoagulation gave a <b>non-significantly lower</b> ischaemic stroke risk at 30 and 180 days but <b>more major haemorrhage by 180 days</b>. The useful refinement is by subgroup: <b>occlusive</b> dissections did better with anticoagulation, <b>non-occlusive</b> dissections did better with antiplatelet. Switching to antiplatelet at around 30 days may capture early benefit without later bleeding."},
{id:"u08",deck:"Updates",tier:3,tags:["ICH","INTERACT3"],q:"What are the components of the INTERACT3 care bundle for intracerebral haemorrhage?",a:"A goal-directed protocol combining:<ul><li>Early intensive systolic BP lowering to a target under 140 mmHg</li><li>Glucose control</li><li>Fever control to a temperature ≤37.5°C</li><li>Rapid reversal of anticoagulation</li></ul>It improved functional recovery with a common odds ratio of 0.86. The bundle worked where its individual components had repeatedly failed."},
{id:"u09",deck:"Updates",tier:3,tags:["ICH","ENRICH"],q:"What did ENRICH show about surgery for intracerebral haemorrhage, and in which patients?",a:"Early <b>minimally invasive trans-sulcal parafascicular surgery</b> improved mRS at 180 days, with 30-day mortality of 9.3% versus 18.0%. Critically, the benefit was concentrated in <b>lobar</b> haemorrhage and not in deep haemorrhage — do not generalise it."},
{id:"u10",deck:"Updates",tier:3,tags:["ICH","anticoagulation"],q:"What did PRESTIGE-AF show about restarting anticoagulation after intracerebral haemorrhage in atrial fibrillation?",a:"DOACs <b>significantly reduced ischaemic stroke</b> but caused a <b>substantial increase in recurrent intracerebral haemorrhage</b> and other major bleeding — part of the benefit is handed straight back. ENRICH-AF separately stopped enrolling patients with <b>lobar</b> ICH because of excess recurrent haemorrhage."},
{id:"u11",deck:"Updates",tier:3,tags:["ICH","CAA"],q:"Why is lobar intracerebral haemorrhage the high-risk group for anticoagulation?",a:"Because much of it is caused by <b>cerebral amyloid angiopathy</b>, which re-bleeds. This is the same logic as the microbleed rule: <b>strictly lobar</b> microbleeds suggest CAA, whereas <b>deep</b> microbleeds in basal ganglia, thalamus and pons suggest hypertensive arteriopathy."},
{id:"u12",deck:"Updates",tier:3,tags:["LAAO"],q:"What did OPTION and CHAMPION-AF show about left atrial appendage occlusion?",a:"The same pattern in both: <b>non-inferior for efficacy, superior for bleeding</b>. OPTION found occlusion non-inferior to oral anticoagulation after AF ablation for death, stroke or systemic embolism, and superior for non-procedure-related bleeding. CHAMPION-AF found it comparable at three years with the same bleeding advantage. A genuine alternative now, though not yet a blanket first-line replacement."},
{id:"u13",deck:"Updates",tier:3,tags:["ICAS","CASSISS"],q:"What did CASSISS confirm about intracranial stenting?",a:"That SAMMPRIS was right. No difference in the primary endpoint between stenting and medical therapy (8.0% vs 7.2%, P=0.82) in 70–99% stenosis, reinforced by long-term follow-up. Any late benefit is offset by periprocedural ischaemic and haemorrhagic risk. Aggressive medical management remains the answer."},
{id:"u14",deck:"Updates",tier:3,tags:["guideline"],q:"Name the three practices the 2026 AHA/ASA acute stroke guideline reversed.",a:"<ul><li><b>No</b> intensive systolic BP lowering below 140 — even after complete reperfusion</li><li><b>No</b> tight glycaemic control (the old 80–130 target) — it increases severe hypoglycaemia without benefit</li><li><b>No</b> adjuvant antithrombotic drugs to enhance thrombolysis</li></ul>All three are reversals of intuitively appealing practice, which is exactly what makes them testable."},
// ============ DECK: Imaging and diagnostics ============
// Diagnostic procedures is 22-28% of the ABPN blueprint. Every card here carries a real clinical plate from
// an open-access journal article; the published caption is withheld until the
// answer is shown, because captions routinely name the diagnosis outright.
// Images live in images/ and are credited in images/CREDITS.md.
{id:"i01",deck:"Imaging",tier:2,tags:["CT","ischaemia"],q:"This non-contrast CT (axial and sagittal) was obtained in a patient with sudden reduced consciousness and quadriparesis. What abnormality does the ventral pontine hyperattenuation represent, and why is recognising it on a plain CT clinically urgent?",a:"<b>Hyperdense basilar artery sign</b> — a focus of increased attenuation lying in the midline anterior to the pons represents acute thrombus within the basilar artery.<br>The density is due to fresh clotted, red-cell-rich thrombus within the vessel lumen, seen on the axial slice and confirmed as a linear structure hugging the ventral pons on the sagittal reformat.<br>This is easy to miss on unenhanced CT because it is subtle, but it signals large-vessel occlusion of the posterior circulation, which carries a high risk of brainstem infarction and death if untreated.<br>Any suspicion should prompt urgent CT angiography to confirm the occlusion and trigger emergency reperfusion therapy.",img:[{f:"PMC4771644_12245_2016_104_Fig1_HTML.png",cap:"a Non-contrast CT (axial view) showing the hyperdense basilar artery sign (arrow). b Non-contrast CT (sagittal view) with the hyperdense basilar artery seen anterior to the pons",src:"Aryasinghe L et al., International journal of emergency medicine (2016)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4771644",lic:"CC BY",alt:"Axial non-contrast CT at the pontine level shows a subtle rounded focus of increased attenuation in the midline anterior to the brainstem, and the sagittal reformat confirms a line"}]},
{id:"i02",deck:"Imaging",tier:2,tags:["CT","ischaemia"],q:"A patient develops sudden right-sided weakness. On the initial non-contrast CT, one vessel appears denser than its counterpart on the opposite side. Which vessel is this, what does the increased density mean, and does it prove there is already a completed infarct?",a:"<b>Hyperdense left MCA sign</b> — the M1 segment of the left middle cerebral artery, running through the sylvian fissure, is denser than the normal right MCA.<br>This increased attenuation reflects acute clotted blood (thrombus/embolus) occluding the vessel lumen.<br>It is one of the earliest CT signs of large-vessel occlusion and can appear within minutes of symptom onset, before any parenchymal hypodensity develops.<br>Importantly it marks arterial occlusion, not proof of infarction — tissue may still be salvageable, so it should prompt urgent vascular imaging and consideration of reperfusion therapy rather than being read as an established stroke.",img:[{f:"PMC2765171_IJRI-19-135-g008.png",cap:"Hyperdense MCA sign. Noncontrast axial CT scans (A, B) of the brain in a patient with sudden-onset right hemiparesis show hyperattenuation of the left middle cerebral artery (arrows). This is suggestive of occlusion of the artery. This is one of the signs of acute stroke but does not necessarily represent infarction",src:"Chavhan GB et al., The Indian journal of radiology & imaging (2009)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2765171",lic:"CC BY",alt:"Two sequential axial non-contrast CT slices show a linear focus of increased attenuation within the left sylvian fissure corresponding to the horizontal (M1) segment of the left MC"}]},
{id:"i03",deck:"Imaging",tier:2,tags:["CT","ischaemia"],q:"Panel A shows a dense linear structure in the proximal MCA; panel B shows a small round dense dot in the sylvian fissure of a different patient. Why does the same underlying pathology look linear in one case and round in the other?",a:"<b>Both are thrombosed segments of the MCA on non-contrast CT</b>, imaged in different planes relative to the vessel.<br>In panel A the slice runs roughly along the M1 segment, so the clotted, hyperdense vessel is seen in cross-section along its length — the classic linear <b>hyperdense MCA sign</b>.<br>In panel B the thrombosed vessel is a smaller distal branch within the sylvian fissure, cut end-on, so it appears as a small round hyperattenuating focus — the <b>MCA 'dot sign'</b>.<br>Both indicate acute intraluminal thrombus and are early markers of large- or medium-vessel occlusion, visible before infarct hypodensity develops.",img:[{f:"PMC4013049_pone.0096123.g001.png",cap:"Hyperdense artery sign on noncontrast CT.(A) Transverse CT scan showing a proximal hyperdense artery sign (arrow) in the M1 segment of MCA. (B) Noncontrast CT showing a distal hyperdense artery sign in the sylvian fissure (arrowhead), which was also referred to as the MCA dot sign.",src:"Li Q et al., PloS one (2014)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4013049",lic:"CC BY",alt:"Panel A shows a dense curvilinear focus in the proximal M1 segment of the MCA; panel B (different case) shows a small round dense focus within the sylvian fissure representing a mo"}]},
{id:"i04",deck:"Imaging",tier:2,tags:["CT","ischaemia"],q:"This posterior fossa CT was obtained in a patient with sudden vertigo and ataxia. What is the large area of low attenuation, and what early complication should be actively monitored for given its location?",a:"<b>Left cerebellar infarction</b> — a well-defined area of hypoattenuation replacing normal cerebellar parenchyma on the left, consistent with an established territorial infarct (typically PICA territory).<br>Cerebellar infarcts sit within the tight confines of the posterior fossa, so even a moderate volume of oedema can compress the fourth ventricle and brainstem.<br>The key complication to watch for clinically and on follow-up imaging is <b>obstructive hydrocephalus</b> from fourth ventricular compression, which may require external ventricular drainage or decompressive craniectomy.<br>Serial CT is used because deterioration can be rapid despite a deceptively reassuring initial presentation.",img:[{f:"PMC4394571_AJM-5-42-g005.png",cap:"Computed tomography (CT) brain shows large hypodense area (arrow) at the left cerebellum representing infarction",src:"Elsharawy M et al., Avicenna journal of medicine (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4394571",lic:"CC BY-NC-SA",alt:"Single axial non-contrast CT at the posterior fossa level shows a large, well-demarcated area of hypoattenuation occupying the left cerebellar hemisphere."}]},
{id:"i05",deck:"Imaging",tier:2,tags:["CT","ischaemia"],q:"No arrow is provided. Comparing the two sylvian fissures on this non-contrast CT, is there a vascular abnormality, and how would you confirm your suspicion?",a:"<b>Hyperdense left MCA sign</b> — the vessel running through the left sylvian fissure is denser than its mirror-image counterpart on the right, suggesting acute intraluminal thrombus in the M1 segment.<br>Spotting this reliably depends on direct side-to-side comparison at the same slice level, since the density difference is often only a shade greater than normal flowing blood.<br>Because subtle hyperdensity can be mimicked by a high haematocrit or vessel calcification, the next step is <b>CT angiography</b> to directly confirm a filling defect/occlusion before committing to a diagnosis of large-vessel occlusion.<br>The sign is sensitive early but not specific, so it should prompt further vascular imaging rather than stand alone as a diagnosis.",img:[{f:"PMC2994109_CCR-6-175_F1.png",cap:"Hyperdense artery sign on CT scan showing a thrombus in the middle cerebral artery.",src:"Ustrell X et al., Current cardiology reviews (2010)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2994109",lic:"CC BY",alt:"Single axial non-contrast CT showing a subtle linear area of increased density along the left sylvian fissure, slightly denser than the vessel on the right, with no annotation."}]},
{id:"i06",deck:"Imaging",tier:2,tags:["CT","ischaemia"],q:"This post-procedure CT follows placement of an external ventricular drain for a cerebellar stroke. What two abnormalities explain why the drain was needed, and what tiny clue on the scan confirms the drain is in place?",a:"<b>Left cerebellar infarction with mass effect causing obstructive hydrocephalus</b> — hypoattenuation replaces the left cerebellar hemisphere, and the swollen tissue pushes and compresses the fourth ventricle toward the right.<br>Fourth ventricular compression blocks CSF outflow, causing upstream (obstructive) hydrocephalus, which is why an external ventricular drain (EVD) was inserted.<br>A tiny focus of air within the ventricular system is the giveaway that a drain has been placed, since air enters the ventricle along the drain tract during the procedure.<br>This combination — large cerebellar infarct plus mass effect — is exactly the scenario where posterior fossa decompression or CSF diversion can be lifesaving.",img:[{f:"PMC3271624_JNRP-3-74-g002.png",cap:"Post EVD non contrast CT brain showing left-sided cerebellar infarct with a mass effect pushing the brainstem to the right, chinking of fourth ventricle and hydrocephalus. Also seen is air within the ventricle following the EVD",src:"Gupta S et al., Journal of neurosciences in rural practice (2012)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3271624",lic:"CC BY-NC-SA",alt:"Single axial non-contrast CT shows hypoattenuation in the left cerebellar hemisphere with the fourth ventricle compressed/shifted to the right, and a small hyperdense focus of air"}]},
