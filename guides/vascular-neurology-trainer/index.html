{id:"i107",deck:"Imaging",tier:2,tags:["anatomy","DSA"],q:"This aneurysm arises just as the internal carotid artery makes its anterior genu, the sharp upward bend beneath the anterior clinoid process. Which named ICA segment is this, and which named artery typically originates near this point?",a:"<b>The paraophthalmic (ophthalmic) segment of the internal carotid artery</b>, immediately after it exits the cavernous sinus through the dural ring.<br>The <b>ophthalmic artery</b> normally arises from the ICA at or just beyond this genu, which is why aneurysms here are often called ophthalmic-segment or paraclinoid aneurysms.<br>Their proximity to the optic nerve and medially-directed projection explain why they can erode into or bulge towards the sphenoid sinus.",img:[{f:"PMC5224415_Neurosciences-21-60-g005.png",cap:"Left internal carotid artery oblique cerebral angiogram showing an aneurysm arising from the paraophthalmic segment of the internal carotid artery that projects anteriorly and medially into the sphenoid sinus.",src:"Al-Jehani HM et al., Neurosciences (Riyadh, Saudi Arabia) (2016)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5224415",lic:"CC BY-NC-SA",alt:"A single lateral catheter angiogram of the internal carotid artery showing a rounded outpouching from the anterior wall of the ICA at the point where the vessel curves sharply upwa"}]},
{id:"i108",deck:"Imaging",tier:2,tags:["anatomy","DSA"],q:"One panel shows an oblique vessel arising from the cavernous internal carotid artery and coursing posteriorly to join the basilar artery, in a different position and trajectory to the normal posterior communicating artery. What embryological remnant is this, and why does it matter clinically?",a:"<b>A persistent trigeminal artery</b> — the most common of the carotid-vertebrobasilar anastomoses that normally regress once the posterior communicating arteries and vertebrobasilar system mature in utero.<br>It runs from the cavernous ICA, alongside the trigeminal nerve root, to join the basilar artery between the superior cerebellar and anterior inferior cerebellar artery origins, a more proximal and oblique course than the true PComm (which joins the P1 segment posteriorly).<br>It matters clinically because it is associated with other vascular anomalies such as aneurysms, and because occluding the parent ICA (e.g. during a balloon test occlusion) can unexpectedly compromise posterior circulation flow.",img:[{f:"PMC2731872_kjr-10-519-g001.png",cap:"Giant cavernous aneurysm with persistent trigeminal and otic arteries in 54-year-old woman.A. Lateral image of right internal carotid artery shows giant cavernous sinus aneurysm and persistent primitive trigeminal artery (arrow).B. Three-dimensional rotational angiographic reconstructions of right internal carotid artery demonstrate persistent trigeminal artery, which arose from aneurysm sac, near normal origin…",src:"Zhang CW et al., Korean journal of radiology (2009)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2731872",lic:"CC BY-NC",alt:"A six-panel series of catheter angiograms of the carotid and vertebrobasilar circulation; one panel shows a large cavernous ICA aneurysm with an additional oblique vessel running f"}]},
{id:"i109",deck:"Imaging",tier:2,tags:["anatomy","MRA"],q:"Three different pairs of cerebellar arteries arise along the vertebrobasilar system in this normal MRA. Listed from most caudal (near the vertebral artery) to most cranial (near the basilar tip), name them.",a:"<b>Posterior inferior cerebellar artery (PICA)</b> arises most caudally, from the distal vertebral artery.<br><b>Anterior inferior cerebellar artery (AICA)</b> arises next, from the proximal-to-mid basilar artery.<br><b>Superior cerebellar artery (SCA)</b> arises most cranially, just below the basilar tip and posterior cerebral artery origins.<br>This craniocaudal order (PICA lowest, AICA middle, SCA highest) lets each vessel be identified reliably on a vertebrobasilar MRA even without labels.",img:[{f:"PMC3759058_TSWJ2013-620162.001.png",cap:"Oblique coronal view maximum intensity projection (MIP) (a) and volume-rendered (VR) (b) time-of-flight (TOF) magnetic resonance (MR) angiography images show normal anatomy of the vertebrobasilar circulation in a 20-year-old woman. Thick long arrows = right and left posterior inferior cerebellar arteries (PICAs), thin long arrows = right and left anterior inferior cerebellar arteries (AICAs), thick short arrows =…",src:"Akgun V et al., TheScientificWorldJournal (2013)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3759058",lic:"CC BY",alt:"Two projections (an oblique coronal MIP and a volume-rendered image) of a time-of-flight MR angiogram of the vertebrobasilar circulation, showing the basilar artery dividing into p"}]},
{id:"i110",deck:"Imaging",tier:2,tags:["anatomy","DSA"],q:"The right ICA injection fills both anterior cerebral arteries, but the left ICA injection fills only the middle cerebral artery with no anterior cerebral artery seen at all. What anatomical variant explains this asymmetry, rather than left-sided ACA occlusion?",a:"<b>An aplastic (absent) left A1 segment.</b><br>When one A1 segment fails to develop, that side's anterior cerebral artery territory is instead supplied across an intact anterior communicating artery from the contralateral ICA, which is why the right-sided injection opacifies both ACAs.<br>Because the left A1 never formed, the left ICA injection has nowhere to send contrast into the ACA territory, mimicking an occlusion despite there being no acute pathology.<br>This is a recognised normal variant that should not be mistaken for A1 occlusion or ACA territory infarction on a single-injection angiogram.",img:[{f:"PMC2438371_1752-1947-2-188-3.png",cap:"Right and left internal carotid artery angiograms. (A) Right internal carotid artery angiogram demonstrating the internal carotid artery dividing into middle and anterior cerebral arteries with the latter additionally supplying the left anterior cerebral artery territory. (B) Left internal carotid artery angiogram revealing the internal carotid artery branching into the middle carotid artery with absent contrast…",src:"Menezes BF et al., Journal of medical case reports (2008)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2438371",lic:"CC BY",alt:"Two separate lateral internal carotid artery angiograms from the same patient: the right-sided injection opacifies both anterior cerebral arteries as well as the right middle cereb"}]},
{id:"i111",deck:"Imaging",tier:2,tags:["vasculopathy","MRI"],q:"This T2 sagittal MRI shows swelling and high signal in the lower brainstem and cervical cord, with no discrete mass. Before assuming a tumour or myelitis, what vascular cause should be considered, and what would you look for elsewhere to support it?",a:"<b>Venous congestive myelopathy from a dural arteriovenous fistula</b> should be considered.<br>The cord/brainstem is diffusely swollen and T2-hyperintense without a discrete enhancing mass, which is a recognised mimic of tumour or myelitis.<br>Look for dilated, serpentine flow voids along the cord surface on the same or adjacent sequences, and confirm with spinal catheter angiography before proceeding to biopsy, since misdiagnosis is a well-described pitfall.",img:[{f:"PMC2722015_jkms-21-958-g001.png",cap:"T2-weighted sagittal MRI shows hyperintense lesions consistent with edema in the lower brainstem (arrow) and cervical spinal cord.",src:"Akkoc Y et al., Journal of Korean medical science (2006)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2722015",lic:"CC BY-NC",alt:"Sagittal T2-weighted cervical spine MRI with an arrow pointing to increased signal and mild swelling within the lower brainstem/upper cervical cord, consistent with venous congesti"}]},
{id:"i112",deck:"Imaging",tier:2,tags:["vasculopathy","DSA"],q:"On this external carotid angiogram, dilated tortuous veins opacify at the same time as the feeding artery. What does that timing tell you about the lesion, and how does it differ from a typical parenchymal AVM?",a:"<b>It indicates a direct arteriovenous shunt — a dural arteriovenous fistula</b> — rather than a nidus-type AVM.<br>In a fistula, contrast passes straight from artery to vein with no intervening tangle of abnormal vessels, so draining veins fill early as smooth, dilated, tortuous channels.<br>A pial AVM instead has a compact nidus of abnormal vessels between artery and vein, seen as a tangled 'bag of worms' before venous filling occurs.",img:[{f:"PMC2722015_jkms-21-958-g002.png",cap:"Selective right external carotid artery angiogram (lateral projection) shows a dural arteriovenous (arrow) fistula fed by the branches of the occipital artery, and draining into the perimedullary veins (arrowheads) around the brainstem and cervical spinal cord.",src:"Akkoc Y et al., Journal of Korean medical science (2006)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2722015",lic:"CC BY-NC",alt:"Lateral DSA after right external carotid artery injection showing a fistulous point (arrow) fed by an occipital artery branch, with early opacification of dilated, tortuous perimed"}]},
{id:"i113",deck:"Imaging",tier:2,tags:["vasculopathy","CT"],q:"The midbrain on this CT is rotated away from the side with the extra-axial collection, with the crus cerebri pushed against the tentorium. What complication does this brainstem distortion risk, and why might the resulting weakness be clinically misleading?",a:"<b>Uncal/transtentorial herniation</b>, with the midbrain at risk of compression against the tentorial edge.<br>The crus cerebri contralateral to the haematoma can be compressed against the tentorium (Kernohan's notch phenomenon), damaging the corticospinal tract on the side opposite to what you would expect.<br>This produces hemiparesis <b>ipsilateral</b> to the mass lesion — a false-localising sign that can mislead bedside lateralisation of the pathology.",img:[{f:"PMC3853108_CRIM.MEDICINE2013-296874.001.png",cap:"CT of the head showing gross posterior and lateral displacement of midbrain with deformity of the crus cerebri (pointed by the arrow) to the left side. The midline is marked with a black line. The subdural hematoma is visible on the right-side.",src:"Panikkath R et al., Case reports in medicine (2013)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3853108",lic:"CC BY",alt:"Axial non-contrast CT at midbrain level showing posterior/lateral displacement of the midbrain, with the crus cerebri (arrow) pushed away from a midline reference line, and a subtl"}]},
{id:"i114",deck:"Imaging",tier:2,tags:["vasculopathy","MRI"],q:"A cluster of small, tortuous dark structures is seen just behind the splenium on this routine T1 scan. What do these signal voids represent, and what further imaging would confirm it?",a:"<b>They represent abnormal, dilated pial/dural veins (flow voids) draining a dural arteriovenous fistula.</b><br>Fast-flowing blood causes signal loss on spin-echo sequences, so a tangle of small dark serpiginous channels near a dural sinus is an indirect sign of an AV shunt rather than normal vasculature.<br>Time-of-flight MRA or catheter DSA is needed to confirm the fistula, map its feeders, and assess for cortical venous reflux, which drives treatment urgency.",img:[{f:"PMC4898229_gr1.png",cap:"40-year-old female with dural arteriovenous fistula. Sagittal T1-weighted image demonstrates flow voids (arrow) of the DAVF posterior to the splenium of the corpus callosum.",src:"Puri AS., Radiology case reports (2010)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4898229",lic:"CC BY-NC-ND",alt:"Sagittal T1-weighted brain MRI with an arrow pointing to a small cluster of serpiginous dark flow-void structures immediately posterior to the splenium of the corpus callosum."}]},
{id:"i115",deck:"Imaging",tier:2,tags:["vasculopathy","MRI"],q:"This T2 MRI shows extensive bilateral cortical/subcortical high signal well beyond the posterior parieto-occipital region usually taught for this condition. What diagnosis should still be considered despite the atypical distribution, and what clinical context supports it?",a:"<b>Posterior reversible encephalopathy syndrome (PRES)</b> remains the likely diagnosis.<br>Although PRES classically favours the parieto-occipital watershed, it frequently extends into frontal and temporal lobes or becomes holohemispheric, as here, because the underlying mechanism — failure of cerebral autoregulation with vasogenic oedema — is not confined to one vascular territory.<br>Severe hypertension, eclampsia, renal failure, or cytotoxic/immunosuppressant drug exposure are classic triggers, and the changes should substantially reverse once the precipitant is treated.",img:[{f:"PMC4307725_wjem-16-5-g003.png",cap:"Initial T2 weighted magnetic resonance imaging of Patient 3 on second emergency department visit, showing increased T2 intensity throughout the cortical and subcortical gray matter of the bilateral frontal, parietal, occipital and posterior temporal lobes.",src:"Thompson RJ et al., The western journal of emergency medicine (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4307725",lic:"CC BY",alt:"Axial T2-weighted MRI showing widespread, confluent increased signal through the cortex and subcortical white matter of both hemispheres, involving frontal, parietal, occipital and"}]},
{id:"i116",deck:"Imaging",tier:2,tags:["vasculopathy","DSA"],q:"This pelvic angiogram, in a patient with slowly progressive bilateral leg numbness and cramps, shows an abnormal draining vein extending cranially from a sacral vessel. What is the diagnosis, and why is it an important mimic of more common causes of gradual myelopathy in older patients?",a:"<b>Sacral spinal dural arteriovenous fistula (SDAVF)</b> draining into a dilated filum terminale vein.<br>The abnormal vein opacifying alongside the artery, rather than the artery ending in a normal capillary blush, indicates a direct AV shunt causing venous hypertension in the cord.<br>Because it causes a slowly progressive myelopathy in older patients, it is commonly mistaken for degenerative lumbar stenosis or cauda equina syndrome, and diagnosis is often delayed until spinal MRI shows cord oedema with perimedullary flow voids prompting angiography.",img:[{f:"PMC4559784_kjr-16-1119-g006.png",cap:"Sacral SDAVF with arterial feeding from left internal iliac artery of 67-year-old male suffering from progressive numbness, soreness and muscle cramps in bilateral lower extremities for 2 years.Left internal iliac angiogram in frontal view shows sacral SDAVF (white arrow) draining toward spinal canal via dilated filum terminale vein (arrowheads). Reproduced with permission from Chen et al. Eur J Radiol…",src:"Jeng Y et al., Korean journal of radiology (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4559784",lic:"CC BY-NC",alt:"Frontal DSA of the left internal iliac artery showing an arteriovenous shunt (arrow) with an abnormal, dilated tortuous vein (arrowheads) draining cranially toward the spinal canal"}]},
{id:"i117",deck:"Imaging",tier:2,tags:["vasculopathy","MRI"],q:"Several tortuous dark structures track along the surface of the cord on this sagittal T2 image, but the cord itself shows no obvious high signal. Does the absence of cord oedema exclude a vascular cause, and what do the surface structures most likely represent?",a:"<b>No — a vascular cause cannot be excluded.</b> The serpiginous structures are most consistent with dilated perimedullary veins ('flow voids'), an early or purely angiographic sign of a spinal dural arteriovenous fistula.<br>Congestive myelopathy evolves over time, so flow voids can be seen before the cord itself becomes oedematous.<br>Because MRI sensitivity alone is imperfect, spinal catheter angiography remains the reference standard when this appearance is seen, even with an otherwise unremarkable cord.",img:[{f:"PMC4559784_kjr-16-1119-g009.png",cap:"13-year-old girl presented with nonspecific intermittent back pain.No definite diagnosis was established. Sagittal T2-weighted spinal MR image shows bulky and discontinuous signal loss (white arrows) at thoracic level without spinal cord edema.",src:"Jeng Y et al., Korean journal of radiology (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4559784",lic:"CC BY-NC",alt:"Sagittal T2-weighted spine MRI showing multiple bulky, serpiginous areas of signal loss (three arrows) running along the dorsal surface of the lower thoracic spinal cord, without o"}]},
{id:"i118",deck:"Imaging",tier:2,tags:["vasculopathy","CT"],q:"This extra-axial collection is crescent-shaped and follows the curve of the skull over a broad area. What feature of its shape distinguishes it from an extradural haematoma, and why does that shape difference occur anatomically?",a:"<b>Subdural haematoma</b> — the collection is crescentic (concave) and spans a wide area of the convexity, unlike the lens-shaped (biconvex), more localised appearance of an extradural haematoma.<br>Subdural blood collects in the potential space between dura and arachnoid, which is not limited by dural attachments at suture lines, so it spreads diffusely over the hemisphere.<br>An extradural haematoma instead strips dura from the inner table and is bounded by sutures where the dura is tightly adherent, producing its classic biconvex shape.",img:[{f:"PMC4601975_gr2.png",cap:"CT scan of the brain shows right temporo-parietal subdural hematoma (arrow).",src:"Hefny AF et al., International journal of surgery case reports (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4601975",lic:"CC BY-NC-ND",alt:"Axial non-contrast CT with an arrow indicating a crescent-shaped, mixed/hyperdense extra-axial collection over the right temporo-parietal convexity, following the inner table of th"}]},
{id:"i119",deck:"Imaging",tier:2,tags:["vasculopathy","MRI"],q:"This unlabelled FLAIR MRI shows bilateral, fairly symmetric high signal at the back of the brain. What single clinical detail would most help distinguish this from bilateral PCA territory infarction, and what feature on this scan already favours PRES over infarction?",a:"<b>PRES</b> is favoured by the symmetric, cortical/subcortical distribution crossing more than one vascular territory, which is unusual for embolic PCA infarction confined to a single arterial territory.<br>Clinically, a history of acute severe hypertension, eclampsia/pre-eclampsia, or recent cytotoxic/immunosuppressive therapy strongly favours PRES, whereas an embolic source or basilar occlusion favours bilateral PCA infarcts.<br>A diffusion-weighted sequence is the key confirmatory step: PRES is usually DWI-negative/ADC-bright (vasogenic oedema), while infarction restricts diffusion.",img:[{f:"PMC5236517_WJG-23-373-g001.png",cap:"Flair hyperintense signal axial view involving the cortex and subcortical white matter involving the parietal and temporal lobes, consistent with posterior reversible encephalopathy syndrome.",src:"John ES et al., World journal of gastroenterology (2017)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5236517",lic:"CC BY-NC",alt:"Axial FLAIR MRI, unannotated, showing bilateral, fairly symmetric hyperintense signal in the cortex and subcortical white matter of the parietal and temporal lobes."}]},
{id:"i120",deck:"Imaging",tier:2,tags:["vasculopathy","MRI"],q:"This patient has extensive confluent white matter hyperintensity, but two panels specifically show involvement of the anterior temporal lobes and external capsules. Why does that distribution matter, given that diffuse white matter change is also common in ordinary hypertensive small vessel disease?",a:"<b>Anterior temporal lobe and external capsule involvement is a relatively specific marker of CADASIL</b>, not typical of sporadic age-related small vessel disease.<br>Ordinary hypertensive/small vessel white matter disease usually spares the anterior temporal poles and external capsules, so their involvement here — combined with a younger patient, migraine history, or family history of stroke/dementia — should raise suspicion for a genetic cerebral small vessel arteriopathy.<br>Confirmation is with NOTCH3 genetic testing (or skin biopsy for granular osmiophilic material), since the imaging pattern alone, while suggestive, is not diagnostic.",img:[{f:"PMC5324276_12916_2017_778_Fig2_HTML.png",cap:"Axial FLAIR MRI: Multifocal/confluent subcortical white matter lesions, with involvement of anterior temporal lobes (a, b), pons (a), external capsules, periventricular and fronto-pariental regions (c), and corpus callosum (d)",src:"Di Donato I et al., BMC medicine (2017)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5324276",lic:"CC BY",alt:"Four-panel axial FLAIR MRI showing confluent subcortical white matter hyperintensities involving the anterior temporal lobes and external capsules bilaterally, the pons, and perive"}]},
{id:"i121",deck:"Imaging",tier:2,tags:["vasculopathy","CT"],q:"This subdural collection shows mixed density rather than uniform hyperdensity, and produces marked midline shift. What does the mixed density suggest about the timing of the bleed, and what would guide the decision for emergency surgery?",a:"<b>Mixed density suggests a hyperacute or actively/recently rebleeding haematoma</b>, with darker (more acute, unclotted) areas admixed with brighter, more established clot.<br>This 'swirl'/mixed-density pattern is associated with ongoing bleeding and a higher risk of rapid expansion.<br>Surgical evacuation is generally indicated when midline shift exceeds clot thickness, when the patient is symptomatic or deteriorating, or when the haematoma is thick (commonly greater than 10mm) — all features suggested by the marked shift seen here.",img:[{f:"PMC2775881_jkms-24-1224-g001.png",cap:"CT scans at the time of admission show a large amount of acute subdural hematoma (ASDH) with thickness of 2.59 cm and a severe midline shift of 2.42 cm.",src:"Lee CH et al., Journal of Korean medical science (2009)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2775881",lic:"CC BY-NC",alt:"Axial non-contrast CT, unannotated, showing a large mixed-density extra-axial collection over the left convexity causing marked midline shift of the falx/ventricles and effacement"}]},
{id:"i122",deck:"Imaging",tier:2,tags:["vasculopathy","MRI"],q:"The abnormal signal marked here is present on both sides but clearly worse on one side than the other. Does this asymmetry argue against PRES, and what does the coronal plane add to appreciating the distribution?",a:"<b>No — asymmetry does not argue against PRES.</b> Although classically described as bilateral and symmetric, PRES is frequently asymmetric or even unilateral in practice.<br>The coronal plane through the ventricular atria confirms the abnormal signal is concentrated posteriorly (parieto-occipital), which can be harder to appreciate on axial slices alone.<br>Management targets the trigger (blood pressure control, delivery in pre-eclampsia, stopping the offending drug), after which the asymmetric changes typically resolve, consistent with the 'reversible' part of PRES.",img:[{f:"PMC3299290_IJPED2012-891094.002.png",cap:"MRI T2 flair image demonstrating findings of posterior reversible encephalopathy syndrome involving bilateral parietal-occipital lobes, left greater than right (arrows).",src:"Cha SD et al., International journal of pediatrics (2012)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3299290",lic:"CC BY",alt:"Coronal FLAIR MRI with two arrows indicating bilateral, asymmetric (left greater than right) hyperintense signal in the parietal-occipital white matter and adjacent cortex at the l"}]},
// ============ END Imaging deck ============

{name:"Abciximab",cls:"Antiplatelet — GPIIb/IIIa inhibitor",kind:"ap",node:"gp2b3a",

 mech:"Monoclonal antibody Fab fragment that binds the GPIIb/IIIa receptor and blocks fibrinogen cross-bridging, the final common step of platelet aggregation.",
 pearl:"Blocking the final common pathway makes GPIIb/IIIa inhibitors the most potent antiplatelet class — and the most hemorrhagic. Their use in acute ischemic stroke has been limited by intracranial bleeding."},
{name:"Eptifibatide",cls:"Antiplatelet — GPIIb/IIIa inhibitor",kind:"ap",node:"gp2b3a",
 target:"Glycoprotein IIb/IIIa receptor",
 mech:"Cyclic heptapeptide that reversibly and competitively blocks the fibrinogen binding site on GPIIb/IIIa.",
 pearl:"Renally cleared and reversible, unlike the antibody-based abciximab."},
{name:"Tirofiban",cls:"Antiplatelet — GPIIb/IIIa inhibitor",kind:"ap",node:"gp2b3a",
 target:"Glycoprotein IIb/IIIa receptor",
 mech:"Small non-peptide reversible competitive antagonist of the GPIIb/IIIa fibrinogen binding site.",
 pearl:"Has been studied in acute stroke and neurointervention more actively than the other agents in this class; treat its role as an area of active investigation rather than settled practice."},
{name:"Vorapaxar",cls:"Antiplatelet — PAR-1 antagonist",kind:"ap",node:"par",

 mech:"Blocks thrombin-mediated platelet activation at PAR-1 without inhibiting thrombin's cleavage of fibrinogen, so it is antiplatelet without being anticoagulant.",
 pearl:"Contraindicated in anyone with a history of stroke, TIA or intracranial hemorrhage because of excess intracranial bleeding. Mechanistically elegant, clinically hazardous in this population."},
// ===== ANTICOAGULANTS =====
{name:"Unfractionated heparin",cls:"Anticoagulant — indirect, antithrombin-dependent",kind:"ac",node:"fIIa",

{name:"Enoxaparin (LMWH)",cls:"Anticoagulant — indirect, antithrombin-dependent",kind:"ac",node:"fXa",

{name:"Warfarin",cls:"Anticoagulant — vitamin K antagonist",kind:"ac",node:"vkor",

{name:"Dabigatran",cls:"Anticoagulant — direct oral anticoagulant",kind:"ac",node:"fIIa",
 target:"Thrombin (factor IIa), direct active-site inhibitor",

{name:"Apixaban",cls:"Anticoagulant — direct oral anticoagulant",kind:"ac",node:"fXa",

{name:"Rivaroxaban",cls:"Anticoagulant — direct oral anticoagulant",kind:"ac",node:"fXa",

{name:"Edoxaban",cls:"Anticoagulant — direct oral anticoagulant",kind:"ac",node:"fXa",

{name:"Argatroban",cls:"Anticoagulant — direct thrombin inhibitor (parenteral)",kind:"ac",node:"fIIa",

{name:"Bivalirudin",cls:"Anticoagulant — direct thrombin inhibitor (parenteral)",kind:"ac",node:"fIIa",

{name:"Abelacimab / milvexian / asundexian",cls:"Anticoagulant — factor XI/XIa inhibitors (investigational class)",kind:"ac",node:"fXI",
 target:"Factor XI or activated factor XIa",
 mech:"Inhibit the contact pathway at factor XI. The rationale is that factor XI contributes substantially to pathological thrombus propagation but relatively little to hemostatic plug formation, which in principle uncouples antithrombotic effect from bleeding risk.",

 pearl:"The results split by population, and that split is the testable point. In ATRIAL FIBRILLATION, asundexian was inferior to apixaban (OCEANIC-AF, stopped early) — a DOAC remains standard. In NON-CARDIOEMBOLIC stroke and high-risk TIA, asundexian added to antiplatelet therapy reduced recurrent stroke by about 26% with no increase in ISTH major bleeding (OCEANIC-STROKE, 2026) — the first successful phase III of the class. Milvexian's LIBREXIA-STROKE is still running with results expected late 2026; LIBREXIA-ACS stopped early for futility. Verify the current regulatory status before applying clinically."},

const VIGNETTES = [
{id:"v01",domain:"Localization",
 stem:"A 68-year-old man develops sudden vertigo, vomiting and hoarseness. Examination shows diminished pinprick on the left side of the face and the right side of the body, a left Horner syndrome, absent gag, and left limb dysmetria. Strength is 5/5 throughout. Which vessel is most likely occluded?",
 choices:["Left vertebral artery","Left posterior inferior cerebellar artery at its origin","Left anterior inferior cerebellar artery","Basilar artery paramedian perforators","Left superior cerebellar artery"],
 answer:0,
 rationale:"This is a left lateral medullary (Wallenberg) syndrome: crossed sensory loss, Horner, bulbar findings from nucleus ambiguus, and ipsilateral ataxia, with <b>normal strength</b> because the pyramid lies medially. Although the syndrome is named for PICA territory, the great majority are caused by <b>vertebral artery</b> occlusion involving the lateral medullary perforators, making that the best answer. AICA would add deafness and facial weakness. SCA produces dysarthria and appendicular ataxia without crossed sensory findings. Basilar paramedian perforators supply medial structures and would cause weakness."},
{id:"v02",domain:"Localization",
 stem:"A 74-year-old woman is found unresponsive. She opens her eyes to voice but does not speak or move her limbs. Vertical eye movements and blinking are preserved and she answers yes/no questions reliably by blinking. Where is the lesion?",
 choices:["Bilateral thalami","Ventral pons","Bilateral medial frontal lobes","Midbrain tegmentum","Reticular activating system in the medulla"],
 answer:1,
 rationale:"This is locked-in syndrome from <b>ventral pontine</b> infarction, usually basilar artery occlusion. Bilateral corticospinal and corticobulbar tracts in the basis pontis are destroyed, producing quadriplegia and anarthria, while the tegmental reticular activating system is spared so consciousness is intact. Vertical gaze and blinking survive because those centres are in the midbrain, above the lesion. Bilateral thalamic infarction would depress consciousness rather than preserve it. Bilateral medial frontal injury gives akinetic mutism, in which the patient does not communicate at all."},
{id:"v03",domain:"Localization",
 stem:"A 61-year-old man has right-sided weakness affecting the face and arm more than the leg, with effortful, sparse speech but preserved comprehension. He cannot repeat phrases. There is no visual field deficit. Which vessel is involved?",
 choices:["Left anterior cerebral artery","Left middle cerebral artery, superior division","Left middle cerebral artery, inferior division","Left recurrent artery of Heubner","Left anterior choroidal artery"],
 answer:1,
 rationale:"Non-fluent aphasia with preserved comprehension and impaired repetition is a <b>Broca aphasia</b>, localizing to the left inferior frontal region supplied by the <b>superior division of the MCA</b>. The accompanying face-and-arm-predominant weakness fits the lateral convexity homunculus. The inferior division would give a fluent aphasia with a field cut and little weakness. ACA would give leg-predominant weakness. Anterior choroidal infarction produces hemiplegia, hemianesthesia and hemianopia without aphasia."},
{id:"v04",domain:"Localization",
 stem:"A 55-year-old woman has abrupt onset of right leg weakness with relative sparing of the arm, no facial weakness, urinary incontinence, and marked apathy with impaired initiation. Which artery is occluded?",
 choices:["Left middle cerebral artery","Left anterior cerebral artery","Left recurrent artery of Heubner","Left lenticulostriate arteries","Left anterior choroidal artery"],
 answer:1,
 rationale:"Leg-predominant weakness with facial sparing, incontinence and abulia is the classic <b>anterior cerebral artery</b> cortical syndrome, reflecting the paracentral lobule (leg homunculus), supplementary motor area, and medial frontal cortex. The distractor worth understanding is Heubner: it is an ACA branch, but it supplies the anterior limb of the internal capsule and caudate, so it produces <b>face and arm</b> weakness — the opposite pattern."},
{id:"v05",domain:"Localization",
 stem:"A 70-year-old man abruptly becomes somnolent. On waking he cannot look up, has a dense anterograde amnesia, and confabulates. Motor strength and sensation are normal. MRI shows symmetric bilateral paramedian thalamic restricted diffusion. What is the anatomic explanation?",
 choices:["Bilateral thalamogeniculate artery occlusion","Occlusion of an artery of Percheron","Deep cerebral venous thrombosis","Bilateral tuberothalamic artery occlusion","Top of the basilar embolism sparing the midbrain"],
 answer:1,
 rationale:"A single dominant paramedian thalamoperforating trunk arising from one P1 and supplying <b>both</b> paramedian thalami is the artery of Percheron. One occlusion therefore produces a symmetric bilateral infarct — impaired consciousness, vertical gaze palsy and amnesia with no motor deficit. Deep venous thrombosis can also give bilateral thalamic lesions, but they are typically edematous and hemorrhagic rather than cleanly diffusion-restricted, and the presentation is subacute with headache."},
{id:"v06",domain:"Localization",
 stem:"A 66-year-old man has sudden inability to read. He writes a sentence to dictation normally but cannot read back what he has written. Naming and comprehension of spoken language are intact. A right homonymous hemianopia is present. Which structures are involved?",
 choices:["Left angular gyrus alone","Left occipital cortex and splenium of the corpus callosum","Left arcuate fasciculus","Left inferior division MCA territory","Bilateral occipital cortices"],
 answer:1,
 rationale:"Alexia without agraphia requires two lesions produced by one <b>left PCA</b> occlusion: destruction of the left visual cortex (giving the right hemianopia) plus interruption of the <b>splenium</b>. Visual information now reaches only the right hemisphere and cannot cross to left-hemisphere language areas — so reading fails. Writing is spared because language output is untouched, which is why he cannot read his own sentence. An angular gyrus lesion would produce alexia <i>with</i> agraphia."},
{id:"v07",domain:"Localization",
 stem:"A 58-year-old man has left-sided weakness of face, arm and leg in equal proportion. There is no aphasia, no neglect, no visual field deficit and no cortical sensory loss. Which lesion best explains this?",
 choices:["Right MCA superior division infarct","Right posterior limb internal capsule lacunar infarct","Right anterior choroidal artery infarct","Right parietal cortical infarct","Right thalamic infarct"],
 answer:1,
 rationale:"Pure motor hemiparesis affecting face, arm and leg <b>equally</b> with a complete absence of cortical signs is the signature of a small deep infarct where the corticospinal fibers are compact — most often the posterior limb of the internal capsule. The absence of cortical signs is the discriminator; a cortical infarct large enough to weaken the whole hemibody would almost always produce aphasia, neglect or a field cut. Anterior choroidal infarction typically adds hemianesthesia and hemianopia."},
{id:"v08",domain:"Localization",
 stem:"A 45-year-old woman presents with a two-week history of worsening headache, then a focal seizure. Examination shows papilledema and mild bilateral leg weakness. CT shows bilateral parasagittal hemorrhagic lesions. What is the diagnosis?",
 choices:["Bilateral ACA territory infarction","Superior sagittal sinus thrombosis","Posterior reversible encephalopathy syndrome","Bilateral watershed infarction","Cerebral amyloid angiopathy"],
 answer:1,
 rationale:"Progressive headache, seizure, papilledema and <b>hemorrhagic lesions that do not respect arterial territories</b> — here bilateral and parasagittal — indicate <b>superior sagittal sinus thrombosis</b>. The parasagittal location explains bilateral leg weakness, since the medial motor cortex represents the legs. Anticoagulation is indicated <i>despite</i> the hemorrhage, because the bleeding is a consequence of venous outflow obstruction."},
{id:"v09",domain:"Localization",
 stem:"A 72-year-old man with severe left carotid stenosis develops episodic right shoulder and proximal arm weakness that worsens when he stands. Hand grip is preserved. MRI shows a linear chain of small infarcts in the left centrum semiovale. What is the mechanism?",
 choices:["Cardioembolism","Artery-to-artery embolism from the carotid plaque","Hemodynamic failure in a borderzone territory","Small vessel lipohyalinosis","Vasculitis"],
 answer:2,
 rationale:"Positional, fluctuating deficits with a <b>rosary-bead pattern of linear infarcts in the centrum semiovale</b> describe an internal borderzone infarct from <b>hemodynamic failure</b> in the setting of hemodynamically significant carotid stenosis. The proximal-arm-with-spared-hand pattern reflects the borderzone crossing the homunculus. The practical implication is the opposite of usual instinct: support the blood pressure rather than lowering it."},
{id:"v10",domain:"Localization",
 stem:"A 63-year-old woman develops right third nerve palsy with a dilated pupil and left-sided ataxia and dysmetria. Strength is preserved. Which syndrome is this?",
 choices:["Weber syndrome","Benedikt syndrome","Claude syndrome","Nothnagel syndrome","Parinaud syndrome"],
 answer:2,
 rationale:"All of Weber, Benedikt and Claude share an ipsilateral third nerve palsy from involvement of the CN III fascicle. The discriminator is what else is hit. <b>Claude</b> involves the superior cerebellar peduncle, giving contralateral <b>ataxia without weakness</b>. Weber is ventral and gives contralateral <b>hemiparesis</b>. Benedikt involves the red nucleus and gives contralateral <b>tremor or chorea</b>. Building these as a contrast set is far more durable than memorizing them separately."},
{id:"v11",domain:"Localization",
 stem:"A 69-year-old man develops acute vertigo, left-sided facial weakness involving the forehead, left-sided hearing loss and tinnitus, left limb ataxia, and decreased pinprick on the right arm and leg. Which artery is occluded?",
 choices:["Left PICA","Left AICA","Left SCA","Left vertebral artery","Basilar apex"],
 answer:1,
 rationale:"<b>Hearing loss is the discriminator.</b> The labyrinthine (internal auditory) artery arises from AICA, so deafness points to AICA rather than PICA. The peripheral-pattern facial weakness (forehead involved) also localizes to the pons, where the facial nucleus lies, rather than the medulla. The crossed spinothalamic finding confirms a lateral brainstem lesion."},
{id:"v12",domain:"Localization",
 stem:"A 60-year-old man has a right hemiparesis, and his eyes are deviated to the right — toward the weak side. Where should you localize?",
 choices:["Left frontal eye field","Right frontal eye field","Left pons","Right pons","Left occipital cortex"],
 answer:2,
 rationale:"In a hemispheric lesion the eyes deviate <b>away</b> from the hemiparesis, toward the lesion. Here they deviate <b>toward</b> the weak side, which is the wrong-way pattern and should redirect you to the <b>pons</b>. A destructive left pontine lesion knocks out the left gaze centre (PPRF/abducens nucleus), so the intact right centre drives the eyes rightward, while the corticospinal tract lesion above the decussation weakens the right side. A seizure with contraversive deviation is the other classic cause of wrong-way eyes."},
{id:"v13",domain:"Antithrombotics",
 stem:"A 71-year-old man has recurrent ischemic events despite adherent clopidogrel therapy. Platelet function testing shows inadequate P2Y12 inhibition. Which mechanism most likely explains this?",
 choices:["Accelerated platelet turnover","Reduced CYP2C19-mediated conversion to the active metabolite","Upregulation of GPIIb/IIIa receptors","Increased thromboxane A2 synthesis via COX-2","Antibody-mediated drug clearance"],
 answer:1,
 rationale:"Clopidogrel is a <b>prodrug</b> requiring two sequential CYP-dependent oxidation steps, predominantly by <b>CYP2C19</b>, to form the active thiol metabolite that irreversibly binds P2Y12. Loss-of-function alleles produce poor metabolizers with reduced active drug and blunted inhibition. This is the reason a directly acting agent such as ticagrelor, which needs no metabolic activation, is the mechanistically logical alternative in a documented loss-of-function carrier."},
{id:"v14",domain:"Antithrombotics",
 stem:"Which property of low molecular weight heparin explains its preferential anti-Xa over anti-IIa activity?",
 choices:["Higher affinity for antithrombin","Loss of the pentasaccharide sequence","Chains too short to bridge antithrombin to thrombin","Direct active-site inhibition of factor Xa","Reduced plasma protein binding"],
 answer:2,
 rationale:"Inhibition of <b>thrombin</b> requires the heparin chain to bind antithrombin and thrombin <i>simultaneously</i>, which needs a chain of at least about 18 saccharide units. Inhibition of <b>factor Xa</b> requires only that antithrombin be activated. Depolymerization retains the antithrombin-binding pentasaccharide but shortens most chains below the bridging threshold, so anti-Xa activity is preserved while anti-IIa falls. Fondaparinux is the logical endpoint of this argument: pure pentasaccharide, pure anti-Xa, zero anti-IIa."},
{id:"v15",domain:"Antithrombotics",
 stem:"A patient on warfarin develops painful skin necrosis three days after initiation without heparin bridging. What is the mechanism?",
 choices:["Direct toxic effect of warfarin on dermal vessels","Rapid decline in protein C creating a transient prothrombotic state","Immune complex vasculitis","Factor VII deficiency causing hemorrhagic infarction of skin","Heparin-induced thrombocytopenia"],
 answer:1,
 rationale:"Warfarin inhibits gamma-carboxylation of the procoagulant factors II, VII, IX, X <i>and</i> the natural anticoagulants <b>protein C and protein S</b>. Protein C has a short half-life and falls before prothrombin, which has a long one. The result is a transient window of net <b>hypercoagulability</b> — microvascular thrombosis in dermal vessels produces skin necrosis. This is the mechanistic justification for parenteral overlap when starting warfarin, and it is closely related to why an early INR rise (driven by short-half-life factor VII) does not mean the patient is yet protected."},
{id:"v16",domain:"Antithrombotics",
 stem:"A patient anticoagulated with dabigatran presents with a large intracerebral hemorrhage. Which reversal strategy is specific to this agent?",
 choices:["Andexanet alfa","Idarucizumab","Protamine sulfate","Vitamin K and 4-factor PCC","Tranexamic acid"],
 answer:1,
 rationale:"<b>Idarucizumab</b> is a monoclonal antibody fragment that binds dabigatran with affinity far exceeding dabigatran's affinity for thrombin, stripping it off its target. It is specific to dabigatran and does nothing for the factor Xa inhibitors, which are addressed by andexanet alfa. Dabigatran is also the one DOAC meaningfully removed by <b>hemodialysis</b>, because of its low protein binding. Protamine reverses heparin; vitamin K plus PCC reverses warfarin."},
{id:"v17",domain:"Antithrombotics",
 stem:"Which anticoagulant is contraindicated in a patient with a mechanical mitral valve?",
 choices:["Warfarin","Dabigatran","Unfractionated heparin","Enoxaparin as a bridge","None of these"],
 answer:1,
 rationale:"<b>Dabigatran</b> is contraindicated in mechanical heart valves, where it produced excess thromboembolic events <i>and</i> excess bleeding compared with warfarin. Mechanical valves remain a <b>warfarin-only</b> oral anticoagulation indication; the factor Xa inhibitors are likewise not established here. Antiphospholipid syndrome is the other setting where warfarin outperformed a DOAC — worth learning as a pair, since both are exceptions to the general drift toward DOACs."},
{id:"v18",domain:"Antithrombotics",
 stem:"A patient develops a platelet count fall from 250 to 70 ×10⁹/L on hospital day 7 of unfractionated heparin, along with a new deep vein thrombosis. What is the correct next step?",
 choices:["Transfuse platelets and continue heparin","Stop heparin and start warfarin alone","Stop all heparin and start argatroban","Reduce the heparin dose and monitor","Stop heparin and give protamine"],
 answer:2,
 rationale:"This is heparin-induced thrombocytopenia — IgG antibodies to heparin–PF4 complexes activate platelets, producing thrombocytopenia with <b>thrombosis rather than bleeding</b>. All heparin must stop, including flushes and coated catheters, and a non-heparin anticoagulant such as <b>argatroban</b>, bivalirudin or fondaparinux started. Starting warfarin alone while the platelet count is low is dangerous — protein C falls first and can precipitate venous limb gangrene. Platelet transfusion adds fuel and is avoided absent life-threatening bleeding."},
{id:"v19",domain:"Antithrombotics",
 stem:"Which feature of tenecteplase relative to alteplase most directly explains its logistical advantage in transferring a patient between hospitals?",
 choices:["Greater fibrin specificity","Resistance to plasminogen activator inhibitor-1","Longer plasma half-life permitting single-bolus dosing","Lower risk of orolingual angioedema","Higher rate of complete recanalization"],
 answer:2,
 rationale:"All of the listed pharmacologic differences are real except the angioedema claim, but the one that produces the <b>logistical</b> advantage is the <b>longer half-life</b>, which allows administration as a single bolus rather than a bolus plus a one-hour infusion. An infusion running during ambulance or helicopter transfer is an operational hazard and a common source of dosing error. This is a good example of an exam item testing which mechanism maps to which consequence, rather than testing the mechanism list itself."},
{id:"v20",domain:"Antithrombotics",
 stem:"A patient receiving intravenous thrombolysis develops swelling of the right side of the tongue and lip 20 minutes into treatment. Which medication most increases the risk of this complication?",
 choices:["Metoprolol","Lisinopril","Atorvastatin","Metformin","Aspirin"],
 answer:1,
 rationale:"Orolingual angioedema during thrombolysis is mediated by bradykinin and complement activation, and its risk is substantially increased by <b>ACE inhibitors</b>, which block bradykinin degradation. It is characteristically <b>hemi-orolingual and contralateral to the infarct</b>. Management centers on airway assessment, since progression can be rapid."},
{id:"v21",domain:"Antithrombotics",
 stem:"Why does fondaparinux have no effect on the thrombin time despite being an effective anticoagulant?",
 choices:["It inhibits factor Xa directly without antithrombin","It is too short to bridge antithrombin to thrombin, so it has no anti-IIa activity","It is rapidly cleared before reaching therapeutic levels","It acts only on platelet-bound thrombin","It inhibits tissue factor rather than the common pathway"],
 answer:1,
 rationale:"Fondaparinux is the synthetic <b>antithrombin-binding pentasaccharide alone</b>. It activates antithrombin, which then inhibits factor Xa — but the molecule is far too short to bridge antithrombin to thrombin, so it produces <b>no anti-IIa activity</b> and does not prolong the thrombin time. Note it acts <i>through</i> antithrombin, so it is an indirect inhibitor, which is why the first option is wrong. It also lacks protamine reversal, the practical price of its design."},
{id:"v22",domain:"Antithrombotics",
 stem:"A 78-year-old woman with atrial fibrillation and a creatinine clearance of 28 mL/min requires oral anticoagulation. On mechanistic grounds, which agent is least dependent on renal clearance?",
 choices:["Dabigatran","Rivaroxaban","Apixaban","Edoxaban","All are equivalent"],
 answer:2,
 rationale:"<b>Apixaban</b> has the lowest renal clearance of the direct oral anticoagulants at roughly a quarter of the dose, versus about 80% for <b>dabigatran</b>, which is the most renally dependent. This makes apixaban the usual mechanistic choice in significant chronic kidney disease. Note also that its dose-reduction criteria depend on a combination of age, weight and creatinine rather than renal function alone — inappropriate dose reduction is a recognized cause of treatment failure. Confirm specific thresholds against current prescribing guidance."},
{id:"v23",domain:"Antithrombotics",
 stem:"Which antiplatelet class blocks the final common pathway of platelet aggregation?",
 choices:["COX-1 inhibitors","P2Y12 receptor antagonists","Phosphodiesterase inhibitors","GPIIb/IIIa receptor antagonists","PAR-1 antagonists"],
 answer:3,
 rationale:"Regardless of which agonist activates the platelet — thromboxane, ADP, thrombin or collagen — aggregation ultimately requires the conformational activation of <b>GPIIb/IIIa</b> so it can bind fibrinogen and cross-link adjacent platelets. Blocking that receptor blocks aggregation no matter what triggered it, which is why the class is the most potent and, correspondingly, the most hemorrhagic. Every other listed class acts upstream on a single activation pathway."},
{id:"v24",domain:"Antithrombotics",
 stem:"A patient with prior ischemic stroke is being considered for an antiplatelet agent after percutaneous coronary intervention. Which agent carries a specific contraindication in this population?",
 choices:["Clopidogrel","Ticagrelor","Prasugrel","Aspirin","Dipyridamole"],
 answer:2,
 rationale:"<b>Prasugrel</b> carries a boxed contraindication in patients with prior stroke or TIA, where its more potent and consistent P2Y12 blockade produced net clinical <b>harm</b> driven by intracranial hemorrhage. This is a case where the pharmacologically 'better' agent is the wrong one because of the population. <b>Vorapaxar</b>, a PAR-1 antagonist, carries an analogous contraindication for the same reason — pairing them makes both easier to retain."},
{id:"v25",domain:"Antithrombotics",
 stem:"Which statement best captures the therapeutic rationale for factor XI inhibition?",
 choices:["Factor XI is the sole initiator of the extrinsic pathway","Factor XI contributes to thrombus propagation more than to hemostasis","Factor XI inhibition reverses established thrombus","Factor XI is the target of warfarin","Factor XI deficiency causes severe spontaneous bleeding"],
 answer:1,
 rationale:"The rationale rests on an observed dissociation: people with congenital factor XI deficiency bleed relatively mildly, mostly after trauma or surgery, yet appear protected from thrombosis. That suggests factor XI is important for <b>propagating</b> pathological thrombus but less essential for forming a hemostatic plug.<br><br><b>The results split by population, and that split is what gets tested.</b> In <i>atrial fibrillation</i>, asundexian was inferior to apixaban (OCEANIC-AF, stopped early) — a DOAC remains standard. In <i>non-cardioembolic stroke and high-risk TIA</i>, asundexian on top of antiplatelet therapy reduced recurrent stroke by roughly 26% with no increase in ISTH major bleeding (OCEANIC-STROKE, 2026), the first successful phase III in the class. Milvexian's LIBREXIA-STROKE is ongoing with results expected late 2026. ABPN's content outline names factor XI inhibitors explicitly, so this is examinable."},
{id:"v29",domain:"Antithrombotics",
 stem:"A 70-year-old man is treated with intravenous thrombolysis for a disabling middle cerebral artery infarct. The team asks whether adding an intravenous antiplatelet or anticoagulant during the thrombolytic infusion would improve recanalization. What does current guidance say?",
 choices:["Add intravenous tirofiban to improve recanalization","Add intravenous heparin at a low fixed dose","Adjuvant antithrombotic drugs are not recommended to enhance thrombolytic outcomes","Add aspirin 325 mg immediately after the bolus","Add argatroban only if the occlusion is intracranial"],
 answer:2,
 rationale:"The 2026 AHA/ASA acute ischemic stroke guideline states that <b>adjuvant antithrombotic drugs are not recommended to enhance the outcomes from thrombolytic therapy</b> — the trials did not demonstrate benefit. This is a change worth knowing precisely, because the mechanistic reasoning (more antithrombotic pressure should mean better recanalization) is seductive and wrong. Antithrombotics after thrombolysis are governed by the usual post-lysis timing rules, which is a separate question from giving them <i>during</i> the infusion to potentiate it."},
{id:"v30",domain:"Antithrombotics",
 stem:"A 62-year-old woman presents 90 minutes after onset of isolated mild dysarthria and clumsiness of one hand. NIHSS is 2 and the deficit is judged non-disabling. She is otherwise a thrombolytic candidate. What is the preferred management?",
 choices:["Intravenous thrombolysis, since she is within the window","Dual antiplatelet therapy rather than thrombolysis","Aspirin monotherapy and observation","Intravenous heparin infusion","Thrombolysis only if perfusion imaging shows mismatch"],
 answer:1,
 rationale:"Trials of thrombolysis in <b>non-disabling</b> deficits did not show benefit, and current guidance prefers <b>dual antiplatelet therapy</b> in this group. The discrimination the exam is testing is <i>disabling versus non-disabling</i>, not the NIHSS number — the 2026 guideline explicitly recommends rapid thrombolysis for eligible patients with <b>disabling</b> deficits <i>regardless of NIHSS score</i>, without requiring advanced imaging selection. A low NIHSS with a disabling deficit (isolated aphasia, or a hand that ends a surgeon's career) still warrants treatment. Judgement about disability, not arithmetic, drives the decision."},
{id:"v26",domain:"Antithrombotics",
 stem:"Aspirin has a plasma half-life of roughly 20 minutes, yet is held for 5 to 7 days before elective neurosurgery. What explains this discrepancy?",
 choices:["Active metabolites persist in plasma for days","It irreversibly acetylates COX-1 in anucleate platelets","It accumulates in the vascular endothelium","It has a large volume of distribution","Enterohepatic recirculation prolongs exposure"],
 answer:1,
 rationale:"The duration of aspirin's effect is a property of the <b>platelet</b>, not the drug. Irreversible acetylation of COX-1 in a cell with no nucleus means the platelet can never resynthesize the enzyme, so inhibition lasts that platelet's 7–10 day lifespan. Recovery depends on production of new platelets — roughly 10% of the pool per day. This decoupling of pharmacokinetics from pharmacodynamics is a favourite exam construct, and the same logic applies to clopidogrel and prasugrel."},
{id:"v27",domain:"Antithrombotics",
 stem:"A patient on warfarin has an INR of 1.9 on day 3 of therapy for a cardioembolic stroke. Why is she not yet adequately anticoagulated despite a rising INR?",
 choices:["The INR is insensitive to warfarin effect","Factor VII has a short half-life and drives the INR before prothrombin falls","Protein C is still elevated","Vitamin K stores have not been depleted","The assay is affected by concurrent heparin"],
 answer:1,
 rationale:"The prothrombin time is most sensitive to <b>factor VII</b>, which has the shortest half-life of the vitamin K–dependent factors. It therefore falls first and pushes the INR up within a day or two — while <b>prothrombin (factor II)</b>, which has a long half-life and carries most of the antithrombotic effect, is still largely intact. Full effect takes roughly five days. Understanding this explains both why bridging exists and why an early therapeutic INR is misleading."},
{id:"v28",domain:"Antithrombotics",
 stem:"Four-factor PCC is given to reverse warfarin in a patient with intracerebral hemorrhage. Why must vitamin K be administered as well?",
 choices:["Vitamin K potentiates PCC binding","PCC does not contain factor VII","PCC is consumed within hours while VKORC1 remains inhibited","Vitamin K reverses the platelet dysfunction caused by warfarin","PCC only works in the presence of vitamin K"],
 answer:2,
 rationale:"PCC repletes circulating factors <b>immediately</b> but those factors are consumed and cleared over hours, and warfarin continues to block VKORC1 so the liver cannot make more. <b>Vitamin K</b> restores endogenous synthesis, but takes hours to work. The two are given together precisely because their time courses are complementary — PCC covers the emergency, vitamin K prevents rebound coagulopathy. Giving PCC alone is a recognized error."},
// ===== IMAGING DIAGNOSTIC =====
// Purpose is to find out whether this 22-28% slice of the exam is weak, not to teach it.
{id:"i01",domain:"Imaging",
 stem:"A patient presents 90 minutes after onset of a right hemiparesis. Non-contrast head CT is reported as showing loss of the insular ribbon and obscuration of the left lentiform nucleus. What do these findings represent?",
 choices:["Chronic small vessel disease","Early ischaemic change from cytotoxic oedema","Acute haemorrhage","Contrast staining","Normal anatomical variation"],
 answer:1,
 rationale:"Loss of the insular ribbon and obscuration of the lentiform nucleus are <b>early ischaemic changes</b> — subtle loss of grey–white differentiation caused by cytotoxic oedema as failing sodium-potassium pumps let water into cells. They appear within the first few hours, well before frank hypodensity. Recognising them matters because they indicate established infarction, and their extent feeds directly into ASPECTS scoring."},
{id:"i02",domain:"Imaging",
 stem:"Which MRI sequence combination confirms that an area of restricted diffusion represents genuinely acute infarction rather than 'T2 shine-through'?",
 choices:["DWI bright with ADC bright","DWI bright with ADC dark","FLAIR bright with T1 bright","GRE dark with DWI dark","T2 bright alone"],
 answer:1,
 rationale:"Acute infarction shows <b>DWI bright with a correspondingly DARK (low) ADC</b>, reflecting true restricted diffusion. If DWI is bright but ADC is also bright, the DWI signal is being carried by underlying T2 hyperintensity — 'T2 shine-through' — and does not indicate acute ischaemia. Always read DWI with its ADC map; this is one of the most reliable imaging discriminations there is."},
{id:"i03",domain:"Imaging",
 stem:"A patient with unknown time of onset has a lesion that is clearly bright on DWI but shows no corresponding signal change on FLAIR. What does this pattern suggest?",
 choices:["The infarct is more than 24 hours old","The infarct is likely within roughly 4.5 hours of onset","The lesion is haemorrhagic","The lesion is a chronic infarct","The study is non-diagnostic"],
 answer:1,
 rationale:"<b>DWI–FLAIR mismatch</b>. DWI turns positive within minutes, whereas FLAIR takes several hours to become abnormal. A lesion visible on DWI but not yet on FLAIR therefore implies the infarct is young — approximately within the thrombolytic window. This is the basis for treating wake-up and unknown-onset stroke, and the 2026 guideline supports thrombolysis in selected such patients using DWI-FLAIR or perfusion mismatch."},
{id:"i04",domain:"Imaging",
 stem:"What does the ASPECTS score assess, and what does a low score indicate?",
 choices:["Perfusion mismatch volume; low means salvageable tissue","Extent of early ischaemic change in the MCA territory; low means more established infarct","Collateral vessel quality; low means good collaterals","Degree of carotid stenosis; low means mild disease","Haemorrhage volume; low means small bleed"],
 answer:1,
 rationale:"ASPECTS is a 10-point topographic score for early ischaemic change across defined MCA territory regions on non-contrast CT. Points are <b>subtracted</b> for each involved region, so a <b>lower score means more established infarction</b> and a normal scan scores 10. It has been used to select patients for reperfusion — though note that thrombectomy has now been extended to some patients with larger cores who would previously have been excluded on ASPECTS grounds."},
{id:"i05",domain:"Imaging",
 stem:"On CT perfusion, an area shows markedly prolonged Tmax but preserved cerebral blood volume. How should this be interpreted?",
 choices:["Infarct core","Ischaemic penumbra","Normal tissue","Haemorrhage","Chronic infarct"],
 answer:1,
 rationale:"Prolonged time-to-maximum with <b>preserved</b> cerebral blood volume indicates tissue that is underperfused but still autoregulating and structurally viable — the <b>penumbra</b>, the target of reperfusion. The infarct core is where blood volume (or cerebral blood flow) has also fallen, indicating autoregulatory failure and irreversible injury. The mismatch between the two defines who may benefit from late reperfusion."},
{id:"i06",domain:"Imaging",
 stem:"Which MRI sequence is most sensitive for detecting cerebral microbleeds?",
 choices:["FLAIR","T1 with gadolinium","Gradient echo or susceptibility-weighted imaging","Diffusion-weighted imaging","MR angiography"],
 answer:2,
 rationale:"<b>GRE and SWI</b> detect the magnetic susceptibility effect of haemosiderin, making them far more sensitive for microbleeds than any other sequence. Their distribution is diagnostically important: <b>strictly lobar</b> microbleeds suggest cerebral amyloid angiopathy, whereas <b>deep</b> microbleeds in basal ganglia, thalamus and pons suggest hypertensive arteriopathy. That distinction changes decisions about anticoagulation."},
{id:"i07",domain:"Imaging",
 stem:"A 70-year-old presents with sudden coma. CT shows bilateral thalamic hypodensity with surrounding oedema and a hyperdense straight sinus. What is the diagnosis?",
 choices:["Artery of Percheron infarction","Deep cerebral venous thrombosis","Bilateral thalamic haemorrhage","Top of the basilar syndrome","Hypoxic-ischaemic injury"],
 answer:1,
 rationale:"Bilateral thalamic involvement has two classic causes, and the imaging separates them. <b>Artery of Percheron</b> infarction gives clean diffusion restriction in the paramedian thalami without venous signs. <b>Deep venous thrombosis</b> gives oedematous, often haemorrhagic thalamic lesions <i>plus</i> evidence of the occluded sinus — here the hyperdense straight sinus (the 'cord sign'). The venous cause is potentially reversible with anticoagulation, so the discrimination matters."},
{id:"i08",domain:"Imaging",
 stem:"Which finding on carotid duplex ultrasound most reliably indicates a haemodynamically significant internal carotid stenosis?",
 choices:["Reduced peak systolic velocity in the stenotic segment","Elevated peak systolic velocity with an elevated ICA/CCA ratio","Absent flow in the external carotid","Increased vessel wall thickness alone","Turbulent flow in the common carotid"],
 answer:1,
 rationale:"Flow accelerates through a narrowing, so a haemodynamically significant stenosis produces an <b>elevated peak systolic velocity</b> in the internal carotid, corroborated by an elevated <b>ICA/CCA peak systolic velocity ratio</b> which corrects for individual variation in cardiac output. The important trap: a <i>near-occlusive</i> or 'string' stenosis can show paradoxically <b>low</b> velocity because flow has collapsed — so a low velocity does not automatically mean mild disease. Confirm specific velocity thresholds against your laboratory's validated criteria."},
{id:"i09",domain:"Imaging",
 stem:"A 38-year-old develops right-sided weakness and aphasia after a week of left-sided neck pain. MRI shows a left hemispheric infarct. Axial fat-suppressed T1 imaging of the neck shows a crescent of high signal in the wall of the left internal carotid artery. What does this represent?",
 choices:["Atherosclerotic plaque","Intramural haematoma from arterial dissection","Vasculitic wall enhancement","Fibromuscular dysplasia","Normal periarterial fat"],
 answer:1,
 rationale:"A crescentic hyperintense rim within the vessel wall on <b>fat-suppressed T1</b> is the classic appearance of <b>intramural haematoma</b> in arterial dissection — methaemoglobin in the wall itself, narrowing the true lumen. Fat suppression is essential, because the surrounding perivascular fat is otherwise bright and hides the finding. The clinical picture fits: a young patient, antecedent neck pain, and an infarct in the territory of the affected vessel. Dissection is a leading cause of stroke in the young, and this sequence is what makes the diagnosis."},
{id:"i10",domain:"Imaging",
 stem:"Which cardiac investigation is most sensitive for detecting a cardiac source of embolism such as a left atrial appendage thrombus or patent foramen ovale?",
 choices:["Transthoracic echocardiography","Transoesophageal echocardiography","Electrocardiogram","Chest radiograph","Cardiac stress testing"],
 answer:1,
 rationale:"<b>Transoesophageal</b> echocardiography places the probe directly behind the left atrium, giving far better visualisation of the <b>left atrial appendage</b>, interatrial septum, and aortic arch atheroma than the transthoracic approach, where those structures sit in the acoustic far field. TTE is the reasonable first test and is adequate for ventricular thrombus and overall function, but a negative TTE does not exclude an atrial or septal source."},
{id:"i11",domain:"Imaging",
 stem:"A patient with an embolic-appearing infarct has a normal ECG and a normal 24-hour Holter monitor. What is the appropriate next step in the search for atrial fibrillation?",
 choices:["Conclude the stroke is not cardioembolic","Prolonged ambulatory cardiac monitoring","Repeat the 24-hour Holter monthly","Start empirical anticoagulation","Proceed directly to TEE only"],
 answer:1,
 rationale:"Paroxysmal atrial fibrillation is intermittent by definition, so a short monitoring window has poor sensitivity. <b>Prolonged monitoring</b> — extended external monitors or an implantable loop recorder — detects substantially more AF than 24 hours of Holter, and detection rates rise steadily with duration. This is why an embolic-appearing infarct with no identified source warrants extended rhythm monitoring rather than a negative-workup label."},
{id:"i12",domain:"Imaging",
 stem:"On non-contrast CT, an acute intracerebral haemorrhage shows an irregular margin and small foci of hypodensity within the haematoma. What is the significance?",
 choices:["It indicates a chronic haemorrhage","These are markers associated with haematoma expansion","It confirms an underlying tumour","It indicates the bleed is venous","It has no prognostic significance"],
 answer:1,
 rationale:"Irregular shape, heterogeneous density and hypodense inclusions within a haematoma (variously described as the swirl, blend, black hole and island signs) are <b>non-contrast CT markers associated with subsequent haematoma expansion</b> — they suggest ongoing or recently active bleeding. The CT angiography 'spot sign' carries the same implication. Expansion is a major determinant of outcome, which is why these findings identify patients needing close monitoring and aggressive early management."},
// ===== WHAT CHANGED — 2024–2026 =====
{id:"n01",domain:"What changed",
 stem:"A 74-year-old with newly diagnosed atrial fibrillation has a moderate-sized left MCA territory infarct. It is now day 3. The team proposes waiting until day 6 to start apixaban, citing the traditional rule based on infarct size. What does current trial evidence support?",
 choices:["Wait until day 6 as proposed","Wait until day 12 given the infarct size","Early initiation is supported and is non-inferior to delayed","Use aspirin indefinitely instead","Bridge with heparin, then start on day 12"],
 answer:2,
 rationale:"The <b>1-3-6-12 day rule</b> was expert consensus, never trial-derived. <b>OPTIMAS</b> found DOAC initiation within <b>4 days</b> non-inferior to day 7–14, and <b>ELAN</b> started within 48 hours for minor and moderate strokes. Across ELAN, OPTIMAS and START, symptomatic intracranial haemorrhage was very rare in both arms. This is a case where the answer taught for a decade is now the wrong one, which is precisely what makes it examinable."},
{id:"n02",domain:"What changed",
 stem:"A 68-year-old is found to have a 75% asymptomatic left internal carotid stenosis. Based on CREST-2, which statement is correct?",
 choices:["Both endarterectomy and stenting reduced stroke versus intensive medical management","Stenting reduced stroke versus intensive medical management; endarterectomy did not","Endarterectomy reduced stroke; stenting did not","Neither intervention beat intensive medical management","Intensive medical management was inferior to both interventions"],
 answer:1,
 rationale:"CREST-2 ran two parallel trials and they <b>split</b>. Adding <b>stenting</b> to intensive medical management reduced the primary endpoint (2.8% vs 6.0%, P=0.02). Adding <b>endarterectomy</b> did not (3.7% vs 5.3%, P=0.24). The result is counterintuitive — endarterectomy is the older, more established operation — which is exactly why it makes a good question. Note also what the comparator was: systolic BP ≤130 and LDL ≤70 with lifestyle coaching."},
{id:"n03",domain:"What changed",
 stem:"A patient has an isolated M3 branch occlusion with an NIHSS of 6. The interventionalist asks whether to proceed with thrombectomy. What do the randomised data show for distal and medium vessel occlusions?",
 choices:["Thrombectomy improves functional outcomes as it does for proximal occlusions","Thrombectomy showed no benefit and signals of harm across three randomised trials","Thrombectomy is beneficial only if thrombolysis was not given","Thrombectomy reduces mortality but not disability","The data are too limited to comment"],
 answer:1,
 rationale:"<b>DISTAL, ESCAPE-MeVO and DISCOUNT were all neutral or negative.</b> ESCAPE-MeVO showed mRS 0–1 in 41.6% with thrombectomy versus 43.1% without, with <i>more</i> symptomatic intracranial haemorrhage (5.4% vs 2.2%) and higher mortality (13.3% vs 8.4%). DISCOUNT was halted early for safety and futility. The lesson is that a benefit established for proximal large vessel occlusion did not transfer distally — a clean example of a plausible extension failing when tested."},
{id:"n04",domain:"What changed",
 stem:"A pacemaker interrogation reveals several atrial high-rate episodes lasting 10 minutes each in an 80-year-old with no history of clinical atrial fibrillation. What does the evidence support?",
 choices:["Anticoagulate exactly as for clinical atrial fibrillation","No anticoagulation is ever indicated for device-detected episodes","A modest stroke reduction offset by increased bleeding, warranting shared decision-making","Aspirin is superior to anticoagulation in this setting","Anticoagulate only if episodes exceed 24 hours"],
 answer:2,
 rationale:"Pooling <b>ARTESiA and NOAH-AFNET 6</b>, anticoagulation gave roughly a <b>32% relative reduction in stroke</b> against roughly a <b>62% relative increase in major bleeding</b>. NOAH-AFNET 6 was stopped early for excess bleeding alongside a trend toward futility. Device-detected AF is a genuinely different entity from clinical AF, and the net benefit is narrow enough that the answer is individualised rather than automatic."},
{id:"n05",domain:"What changed",
 stem:"A 62-year-old presents with a spontaneous lobar intracerebral haemorrhage of 40 mL. Which management approach is supported by recent randomised evidence?",
 choices:["Supportive care alone, as surgery has repeatedly failed","A goal-directed care bundle, and consideration of early minimally invasive evacuation","Immediate craniotomy for all patients","Prophylactic antiseizure medication and observation","Intensive glucose control targeting 80–130 mg/dL"],
 answer:1,
 rationale:"Two positive trials moved ICH away from therapeutic nihilism. <b>INTERACT3</b> showed a <b>care bundle</b> — early intensive systolic BP lowering below 140, glucose control, temperature ≤37.5°C, and rapid anticoagulation reversal — improved functional recovery (common OR 0.86), succeeding where its individual components had failed. <b>ENRICH</b> showed early minimally invasive parafascicular surgery improved 180-day mRS with 30-day mortality 9.3% vs 18.0%, with benefit concentrated in <b>lobar</b> haemorrhage — which this patient has."},
{id:"n06",domain:"What changed",
 stem:"A patient with atrial fibrillation survived a lobar intracerebral haemorrhage six months ago. The family asks about restarting anticoagulation. What does PRESTIGE-AF show?",
 choices:["DOACs reduce ischaemic stroke with no increase in bleeding","DOACs reduce ischaemic stroke but substantially increase recurrent intracerebral haemorrhage","DOACs offer no ischaemic benefit in this population","Anticoagulation is absolutely contraindicated after any intracerebral haemorrhage","Aspirin is equivalent to a DOAC in this setting"],
 answer:1,
 rationale:"PRESTIGE-AF found DOACs <b>significantly reduced ischaemic stroke</b> in ICH survivors with AF, but caused a <b>substantial increase in recurrent intracerebral haemorrhage</b> and other major bleeding — a meaningful part of the benefit is given back. <b>Lobar</b> location is the danger signal, because much lobar haemorrhage reflects cerebral amyloid angiopathy, which re-bleeds; ENRICH-AF separately stopped enrolling lobar ICH patients for excess recurrent haemorrhage."},
{id:"n07",domain:"What changed",
 stem:"A 44-year-old has a spontaneous internal carotid dissection causing complete occlusion of the vessel, with a small infarct. Based on STOP-CAD, which antithrombotic strategy is best supported for this specific patient?",
 choices:["Antiplatelet therapy, as the trials showed equivalence","Anticoagulation, as occlusive dissections fared better with it","Dual antiplatelet therapy for 90 days","No antithrombotic therapy","Thrombolysis"],
 answer:1,
 rationale:"CADISS and TREAT-CAD found antiplatelet and anticoagulant broadly equivalent overall, and STOP-CAD's headline result was similar — anticoagulation gave a non-significantly lower stroke risk at the cost of more major haemorrhage by 180 days. The refinement worth knowing is the <b>subgroup split</b>: <b>occlusive</b> dissections fared better with <b>anticoagulation</b>, while <b>non-occlusive</b> dissections fared better with antiplatelet. This patient has an occlusive dissection. Switching to antiplatelet at around 30 days may capture the early benefit without the later bleeding risk."},
{id:"n08",domain:"What changed",
 stem:"Which statement about colchicine for secondary stroke prevention is correct?",
 choices:["It reduced recurrent stroke at 90 days and is now standard of care","CHANCE-3 was neutral at 90 days and colchicine is not standard of care","It increased stroke risk and is contraindicated","It is beneficial only in cardioembolic stroke","It replaced antiplatelet therapy in atherosclerotic stroke"],
 answer:1,
 rationale:"<b>CHANCE-3</b> was neutral — any stroke at 90 days occurred in 6.3% on colchicine versus 6.5% on placebo (P=0.79), with neutral secondary outcomes. CONVINCE showed a trend on a composite vascular endpoint but was not powered for stroke alone, and meta-analyses suggest any benefit emerges only beyond six months. The general lesson is worth carrying: a positive result in coronary disease does not transfer automatically to stroke."}

/* ============================================================
   STORAGE + SCHEDULER (SM-2, compressed to exam horizon)
   ============================================================ */
const KEY='vnbt_v1';
const DEFAULT_HORIZON=90; // days assumed until the user sets their own exam date
let S = load();

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {examDate:'', sched:{}, log:[], vign:{}, synd:{}, theme:'dark', created:today()};
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function today(){ const d=new Date(); return d.toISOString().slice(0,10); }
function addDays(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5); }
function examDate(){ return S.examDate || addDays(today(), DEFAULT_HORIZON); }
function daysToExam(){ return Math.max(0, daysBetween(today(), examDate())); }

// SM-2. grade: 0=Again 1=Hard 2=Good 3=Easy
function schedule(id, grade){
  const st = S.sched[id] || {ef:2.5, iv:0, reps:0, lapses:0, due:today(), seen:0};
  st.seen++;
  if(grade===0){
    st.reps=0; st.lapses++; st.iv=0; st.ef=Math.max(1.3, st.ef-0.2);
    st.due=today();               // relearn same session
  } else {
    const q=[0,3,4,5][grade];
    st.ef = Math.max(1.3, st.ef + (0.1 - (5-q)*(0.08+(5-q)*0.02)));
    st.reps++;
    if(st.reps===1) st.iv = grade===1?1:(grade===3?3:1);
    else if(st.reps===2) st.iv = grade===1?3:(grade===3?7:4);
    else st.iv = Math.round(st.iv * st.ef * (grade===1?0.7:(grade===3?1.25:1)));
    st.iv = Math.max(1, st.iv);
    // COMPRESSION: never schedule a card past the exam. Pull it back inside the window.
    const room = daysToExam()-1;
    if(room>0 && st.iv>room) st.iv = Math.max(1, Math.floor(room*0.6));
    st.due = addDays(today(), st.iv);
  }
  st.last = today(); st.lastGrade = grade;
  S.sched[id]=st;
  S.log.push({d:today(), id, g:grade});
  if(S.log.length>4000) S.log=S.log.slice(-3000);
  save();
  return st;
}
function dueCards(deck){
  const t=today();
  return CARDS.filter(c=>{
    if(deck && deck!=='all' && c.deck!==deck) return false;
    const st=S.sched[c.id];
    if(!st) return true;
    return st.due<=t;
  });
}
function newCards(deck){
  return CARDS.filter(c=>(!deck||deck==='all'||c.deck===deck) && !S.sched[c.id]);
}
function maturity(c){
  const st=S.sched[c.id];
  if(!st) return 'new';
  if(st.iv>=14) return 'mature';
  if(st.reps>0) return 'young';
  return 'learning';
}

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(a,n){ return shuffle(a).slice(0,n); }
function pct(n,d){ return d? Math.round(100*n/d):0; }

/* ---- card images -------------------------------------------------------
   Every image is a real clinical figure from an open-access journal article,
   downloaded into images/ and credited. Two rules that matter:

   1. The plate shows on the QUESTION side, the source caption only on the
      ANSWER side. Published captions routinely state the diagnosis outright
      ("axial CT demonstrating a large MCA infarct"), so showing the caption
      up front hands you the answer and the card stops testing anything.
   2. Panels are labelled A, B, C and referred to by letter in the question,
      so a multi-panel card can ask about one specific plate.
------------------------------------------------------------------------- */
const PANEL='ABCDEFGH';
function cardImgs(c){
  if(!c.img || !c.img.length) return '';
  const multi=c.img.length>1;
  return `<div class="cimgs n${c.img.length>1?'x':'1'}">`+c.img.map((im,i)=>
    `<figure class="cimg">${multi?`<span class="pl">${PANEL[i]}</span>`:''}
      <img loading="lazy" src="images/${esc(im.f)}" alt="${esc(im.alt||'Clinical imaging plate')}">
     </figure>`).join('')+`</div>
    <p class="imgnote">Source and full caption revealed with the answer.</p>`;
}
function cardCredits(c){
  if(!c.img || !c.img.length) return '';
  const multi=c.img.length>1;
  return `<div class="credits">`+c.img.map((im,i)=>
    `<p class="ct">${multi?`<span class="pl">${PANEL[i]}</span>`:''}${esc(im.cap)}
      <br><a href="${esc(im.u)}" target="_blank" rel="noopener">${esc(im.src)}</a>
      &middot; ${esc(im.lic||'open access')}</p>`).join('')+`</div>`;
}
