{id:"i57",deck:"Imaging",tier:2,tags:["haemorrhage","MRI"],q:"Comparing the GRE and SWI panels at the same brain level, the SWI images appear to show more dark dots than GRE. Why does this happen, and what pitfall does the panel with hatched-arrow markers warn about?",a:"SWI combines magnitude and phase information and uses a longer echo time than standard GRE, which makes it <b>far more sensitive to the susceptibility (blooming) effect of haemosiderin</b>, so it reveals microbleeds that GRE can under-call or miss entirely.<br>However, this increased sensitivity is a double-edged sword: small pial/subarachnoid <b>vessels</b> can also produce dot-like dark foci on SWI and be mistaken for true parenchymal microbleeds.<br>The teaching point for boards is to use SWI as the more sensitive sequence for CMB counting, but to correlate with anatomical location (parenchymal versus subarachnoid/sulcal) before calling a dot a genuine microbleed.",img:[{f:"PMC3859003_jos-15-153-g001.png",cap:"Cerebral microbleeds (CMBs) visualized on gradient-echo (GRE) images and susceptibility-weighted images (SWI). A lobar CMB on a SWI image (white arrow) is only faintly visible on the corresponding GRE image. Vessels located in the subarachnoid space could be mistakenly identified as CMBs on SWI sequence (hatched arrows).",src:"Kim BJ et al., Journal of stroke (2013)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3859003",lic:"CC BY-NC",alt:"Four axial MRI panels comparing GRE and SWI sequences at two brain levels; more, and more conspicuous, small dark punctate foci are visible on the SWI images than on the matched GR"}]},
{id:"i58",deck:"Imaging",tier:2,tags:["haemorrhage","CT"],q:"Within this large area of low density (an established infarct), there is a discrete focus that is brighter than the surrounding tissue. What does this focal hyperdensity within an infarct represent, and what associated finding on this image tells you the lesion is producing significant mass effect?",a:"<b>Haemorrhagic transformation</b> of the ischaemic infarct — reperfusion or breakdown of the blood-brain barrier in infarcted tissue allows blood to leak in, producing a hyperdense focus within an otherwise hypodense (dead) territory.<br>The <b>effaced right lateral ventricle and midline shift towards the left</b> confirm significant mass effect, which is important because haemorrhagic transformation with mass effect changes management (for example, holding anticoagulation/thrombolysis and considering neurosurgical involvement) compared with a bland, non-haemorrhagic infarct.",img:[{f:"PMC3877505_AJNS-8-162b-g002.png",cap:"Plain axial CT scan shows a large right sided temporo-parieto-occipital hypodense area with foci of hyper attenuation within, suggestive of hemorrhagic transformation. The right lateral ventricle is effaced and there is evidence of subfalcine herniation and midline shift",src:"Srikant B et al., Asian journal of neurosurgery (2013)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3877505",lic:"CC BY-NC-SA",alt:"Single axial CT showing a large area of hypodensity in the right temporo-parieto-occipital region (an established infarct) containing a discrete focus of hyperdensity, with effacem"}]},
{id:"i59",deck:"Imaging",tier:2,tags:["haemorrhage","CT"],q:"The hyperdense material here follows the shape of the cisterns and sulci rather than forming a focal round mass. What does this distribution pattern tell you about where the bleeding originated, and what would be the immediate next imaging step to find the cause?",a:"A diffuse pattern that outlines the <b>basal cisterns and sulci</b> (rather than a focal parenchymal clot) is the classic appearance of <b>subarachnoid haemorrhage</b>, most commonly from a ruptured intracranial aneurysm.<br>Blood has also tracked into the ventricular system, indicating intraventricular extension, which increases the risk of acute hydrocephalus.<br>Given this pattern, the essential next step is <b>CT angiography</b> (or catheter angiography) to identify a source aneurysm, since the distribution alone does not localise the ruptured vessel.",img:[{f:"PMC4024817_jkns-55-160-g002.png",cap:"Brain CT (axial view) presents an acute subarachnoid hemorrhage and intraventricular hemorrhage.",src:"Yoon KW et al., Journal of Korean Neurosurgical Society (2014)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4024817",lic:"CC BY-NC",alt:"Single axial CT showing extensive hyperdense material filling the basal cisterns, sylvian fissures and cortical sulci bilaterally, with hyperdensity also present within the ventric"}]},
{id:"i60",deck:"Imaging",tier:2,tags:["haemorrhage","CTA"],q:"The arrow points to an area of irregular, blurred contrast density just outside the smooth vessel outline, rather than a discrete rounded aneurysm sac. What does this appearance signify about the state of bleeding at the time of the scan, and why is it prognostically important?",a:"This represents <b>active contrast extravasation</b> — contrast leaking from the ruptured vessel/aneurysm into the surrounding haematoma at the moment of scanning, analogous to the CT angiography 'spot sign' used to predict haematoma expansion in intracerebral haemorrhage.<br>Its presence indicates the bleed is still active rather than sealed, which is associated with a higher risk of rapid clinical deterioration and often prompts more urgent intervention (endovascular or surgical) rather than a period of watchful monitoring.",img:[{f:"PMC4273003_jkns-56-428-g002.png",cap:"CT angiography showing contrast extravasation (white arrow) on the distal basilar artery.",src:"Kim BC et al., Journal of Korean Neurosurgical Society (2014)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4273003",lic:"CC BY-NC",alt:"A 3D CT angiogram reconstruction of the basilar tip/vertebrobasilar circulation showing an irregular vascular outpouching, with an arrow pointing to an area of ill-defined contrast"}]},
{id:"i61",deck:"Imaging",tier:2,tags:["haemorrhage","CT"],q:"This haematoma sits deep in the basal ganglia rather than in a cortical/lobar location. What is the typical underlying vasculopathy for a haemorrhage in this location, and which small perforating vessels are classically implicated?",a:"A <b>deep basal ganglia haemorrhage</b> is the classic pattern of <b>chronic hypertensive small-vessel disease (hypertensive arteriopathy)</b>.<br>It results from rupture of small perforating <b>lenticulostriate arteries</b>, which are weakened by lipohyalinosis and may form tiny Charcot-Bouchard microaneurysms under chronically elevated pressure.<br>This deep location contrasts with the lobar/cortical pattern seen in cerebral amyloid angiopathy, which is the key localisation distinction tested on boards.",img:[{f:"PMC2687607_kjim-22-51-g001.png",cap:"The brain CT shows the acute hemorrhage in the right basal ganglia.",src:"Oh SJ et al., The Korean journal of internal medicine (2007)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2687607",lic:"CC BY-NC",alt:"Single axial CT showing a large, well-defined, homogeneously hyperdense mass in the right basal ganglia region with surrounding low-density oedema and mild leftward midline shift."}]},
{id:"i62",deck:"Imaging",tier:2,tags:["haemorrhage","MRI"],q:"The dark foci in panel A are located in the thalami rather than the cortex or subcortical white matter. Combined with the periventricular white matter change in panel C, what underlying small-vessel disease does this deep microbleed distribution suggest, and how would the expected pattern differ if the microbleeds were instead lobar?",a:"This pattern — <b>deep (thalamic/basal ganglia) microbleeds</b> plus periventricular white matter hyperintensity — is characteristic of <b>hypertensive small-vessel disease</b>.<br>If the microbleeds were instead concentrated in the <b>cortex/subcortical (lobar) regions</b>, with sparing of the deep grey matter, that pattern would instead point to <b>cerebral amyloid angiopathy</b>.<br>Recognising which compartment the microbleeds occupy is the key discriminator boards test, because it changes the presumed vasculopathy and the associated bleeding risk profile with antithrombotic therapy.",img:[{f:"PMC2854924_jcn-1-177-g001.png",cap:"Brain images of the patient before admission. Three months prior to admission, T2*-weighted GRE MRI showed multiple cerebral microbleeds in the thalamus (A) with no abnormal vasculature in the medulla (B). The fluid-attenuated inversion recovery image showed diffuse periventricular white-matter changes (C).",src:"Kwon HM et al., Journal of clinical neurology (Seoul, Korea) (2005)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2854924",lic:"CC BY-NC",alt:"A) axial T2*/GRE at the level of the thalami with one or two subtle small dark foci in the thalamic region; B) axial T2*/GRE at the level of the medulla with no discrete dark foci;"}]},
{id:"i63",deck:"Imaging",tier:2,tags:["venous","MRI"],q:"This is a post-contrast sagittal T1 image through the skull base and neck. Normally flowing venous blood should enhance brightly here. What do the low-signal areas marked at the sigmoid sinus and jugular vein represent, and why does their signal differ from the vessel around them?",a:"<b>Thrombus within the sigmoid sinus and internal jugular vein.</b><br>Post-contrast T1 relies on flowing blood picking up gadolinium and appearing bright; a static clot does not enhance, so it shows up as a dark filling defect against the bright, opacified lumen.<br>The fact that the defect runs continuously from the sigmoid sinus down into the jugular vein shows that thrombus can propagate outside the dural sinuses proper — a reminder to trace venous thrombosis along its full course rather than stopping at the calvarium.",img:[{f:"PMC4158254_CRIVAM2014-873402.001.png",cap:"Right side: postcontrast MR T1W sagittal images clearly show a low-signal-intensity clot (white arrowheads) at the end of the left and right sigmoid sinuses extending along the jugular vein (black arrowhead).",src:"Altıntaş O et al., Case reports in vascular medicine (2014)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4158254",lic:"CC BY",alt:"Sagittal post-contrast T1-weighted MRI of the skull base and upper neck showing low-signal filling defects (arrowheads) replacing the expected bright contrast-enhanced flow at the"}]},
{id:"i64",deck:"Imaging",tier:2,tags:["venous","MRI"],q:"Two non-contrast sagittal T1 images are shown from the same patient. Both show bright signal tracking along the course of a dural sinus rather than the expected dark flow void. Why does clotted blood appear bright on a plain T1 sequence, and why is that reassuring diagnostically compared with needing contrast or venography?",a:"<b>T1-hyperintense thrombus within the superior sagittal sinus (A) and the torcular/lateral sinus (B).</b><br>A patent sinus should show a dark flow void on T1 because flowing blood produces no signal; here that void is replaced by bright signal.<br>The brightness comes from methaemoglobin in a subacute clot, so this sign can be picked up on an unenhanced scan without needing CT or MR venography.<br>Seeing the same sign at two separate sites in one patient (SSS and torcular region) illustrates that dural sinus thrombosis is often multifocal.",img:[{f:"PMC4194199_PAMJ-17-281-g001.png",cap:"(case 21) Sagittal MR T1 sequences without Gadolinium injection showing: hypersignal of thrombosed SSS on the right (black arrows) (A), hypersignal of thrombosed LLS on the left (white arrow) (B)",src:"Souirti Z et al., The Pan African medical journal (2014)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4194199",lic:"CC BY",alt:"Two sagittal T1-weighted MRI panels: panel A shows an abnormal linear hyperintensity along the expected course of the superior sagittal sinus at the vertex, and panel B shows simil"}]},
{id:"i65",deck:"Imaging",tier:2,tags:["venous","CT"],q:"On this contrast-enhanced CT through the posterior fossa, the marked sinus shows a dark centre ringed by a thin bright rim instead of solid enhancement. What does this ring-and-core appearance signify, and which named sign does it represent?",a:"<b>Empty delta (target) sign in the transverse sinus.</b><br>A normal dural sinus should opacify uniformly with contrast; here the centre stays dark because it is occupied by non-enhancing thrombus, while the thin bright rim represents the enhancing sinus wall and adjacent collateral vessels.<br>Although classically described in the superior sagittal sinus, this same ring pattern can appear in the transverse or other sinuses and is a direct CT sign of sinus thrombosis.",img:[{f:"PMC4194199_PAMJ-17-281-g003.png",cap:"(case 14) CT scan after contrast product injection, axial sequence of the posterior fossa showing empty right lateral sinus (arrow)",src:"Souirti Z et al., The Pan African medical journal (2014)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4194199",lic:"CC BY",alt:"Contrast-enhanced axial CT of the posterior fossa with an arrow pointing to a rounded area near the expected transverse sinus that shows a hypodense centre with a thin enhancing ri"}]},
{id:"i66",deck:"Imaging",tier:2,tags:["venous","CT"],q:"This contrast CT shows a triangular defect in the posterior superior sagittal sinus alongside a large area of hypodensity in the left hemisphere with midline shift. Why does the size and distribution of the hemispheric lesion argue against a single arterial occlusion, and how does the sinus finding tie the two together?",a:"<b>Superior sagittal sinus thrombosis with venous infarction.</b><br>The triangular dark centre with a bright rim in the posterior SSS is the empty delta sign — thrombus surrounded by enhancing collateral/dural vessels.<br>The hemispheric hypodensity is too extensive and swollen to fit a single middle or anterior cerebral artery territory, and the disproportionate mass effect for the apparent 'infarct' size is typical of venous rather than arterial infarction, which is often haemorrhagic and oedematous.<br>Together, an unexplained large infarct plus an empty delta sign should prompt venous sinus thrombosis as the unifying diagnosis rather than two separate problems.",img:[{f:"PMC2964787_JPN-5-32-g002.png",cap:"Contrast-enhanced transverse CT image showing the empty delta sign in the superior sagittal sinus posteriorly, with a large infarct in the lefthemisphere causing a midline shift to the right",src:"Wani NA et al., Journal of pediatric neurosciences (2010)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2964787",lic:"CC BY",alt:"Contrast-enhanced axial CT showing a triangular filling defect (empty delta sign) in the posterior superior sagittal sinus, together with a large hypodense left cerebral hemisphere"}]},
{id:"i67",deck:"Imaging",tier:2,tags:["venous","MRI"],q:"This T2 image shows a small area of high signal in the parasagittal white matter of one hemisphere, close to the midline. Why does its parasagittal, watershed-type location favour a venous rather than an arterial cause, even though no artery territory is outlined here?",a:"<b>Small parasagittal venous infarct/oedema.</b><br>The lesion sits in the strip of brain drained by superficial cortical veins that empty into the superior sagittal sinus, an area that straddles the boundary between anterior and middle cerebral artery territories rather than lying within either one.<br>A lesion confined to a single arterial territory would point to embolic or thrombotic arterial stroke, but a parasagittal watershed pattern like this is a recognised, if subtle, signature of venous congestion or infarction from sagittal sinus thrombosis.",img:[{f:"PMC2964787_JPN-5-32-g003.png",cap:"T2-weighted axial MR image showing a small area of subcortical white matter edema in the left high parietal parasagittal region due to a venous infarct",src:"Wani NA et al., Journal of pediatric neurosciences (2010)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2964787",lic:"CC BY",alt:"Axial T2-weighted MRI showing focal, asymmetric high signal in the left high-parietal subcortical white matter close to the midline, with no other abnormality on the image."}]},
{id:"i68",deck:"Imaging",tier:2,tags:["venous","mixed"],q:"Panel (a) is an MR angiogram of the arteries; panels (b)-(d) show a large haemorrhagic right hemispheric lesion with mass effect on T1 and T2. Given that the arteries in (a) look normal, what does that tell you about the likely mechanism behind the lesion in the other panels, and what should be imaged next?",a:"<b>Large haemorrhagic venous infarct with a normal arterial tree.</b><br>The MR angiogram shows patent, symmetrical major intracranial arteries, which argues against a large-vessel arterial occlusion as the cause of such an extensive lesion.<br>A lesion this large, haemorrhagic, and associated with disproportionate oedema and midline shift, in the setting of normal arteries, should raise suspicion for venous infarction, where impaired outflow rather than blocked inflow produces the damage.<br>The logical next study is not more arterial imaging but a venogram (CTV or MRV) to look for dural sinus or cortical vein thrombosis.",img:[{f:"PMC2997282_PRI2010-132754.001.png",cap:"(a) MRI angiogram showing patent cerebral arteries. ((b), (c), (d)) Sagittal and transverse MRI views, T1 and T2 weighed, depict a large right hemorrhagic lesion with prominent edema and midline shift.",src:"Nudelman RJ et al., Pathology research international (2010)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2997282",lic:"CC BY",alt:"Four MRI panels: a normal-looking MR angiogram showing patent intracranial arteries, a sagittal T1 image with a large right hemispheric mass-like lesion, an axial T1 image showing"}]},
{id:"i69",deck:"Imaging",tier:2,tags:["venous","mixed"],q:"Panel A shows a small bright dot in the midline posterior to the third ventricle on plain CT; panel B shows bilateral, roughly symmetric signal change in the thalami. Why does bilateral thalamic involvement, rather than a one-sided lesion, point specifically to thrombosis of a deep midline structure rather than a cortical vein or lateral sinus?",a:"<b>Straight sinus thrombosis with bilateral thalamic venous infarction.</b><br>The bright focus on the plain CT sits exactly where the straight sinus runs, and a dense clot there is the CT equivalent of the 'cord sign' seen with cortical vein thrombosis.<br>Both thalami drain through the internal cerebral veins into the vein of Galen and then the straight sinus, so occluding this single midline channel cuts off venous outflow from both sides symmetrically — something a unilateral cortical vein or lateral sinus thrombosis could not produce.<br>Bilateral, symmetric thalamic oedema/haemorrhage should therefore prompt a specific search for deep venous system (straight sinus/vein of Galen) thrombosis rather than a lateral sinus problem.",img:[{f:"PMC3555595_wjem-13-491-g001.png",cap:"A. Unenhanced brain computed tomography. Strong hyperintensity within straight sinus due to the presence of an acute clot (arrow) together with subtle hypo-intensity within both thalamomesencephalic junctions. B. Magnetic resonance imaging with Fluid Attenuated Inversion Recovery (FLAIR) sequence. Hemorrhage within both thalami (central hyposignal intensity due to the presence of deoxyhemoglobin and marginal…",src:"Geukens P et al., The western journal of emergency medicine (2012)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3555595",lic:"CC BY-NC",alt:"Panel A is a non-contrast axial CT at the level of the pineal region showing a small hyperdense focus in the expected location of the straight sinus; panel B is an axial FLAIR/T2 i"}]},
{id:"i70",deck:"Imaging",tier:2,tags:["venous","mixed"],q:"This patient has a left-sided subdural haematoma (a) and a left temporal lobe abnormality (b, c) with an asymmetric venous sinus on venography (d). Why might a clinician initially attribute the temporal lobe finding to trauma alone, and what evidence here argues that venous sinus thrombosis is the true underlying cause?",a:"<b>Left transverse sinus thrombosis with associated subdural haematoma and temporal venous infarction.</b><br>A subdural haematoma alone would not usually produce a discrete parenchymal signal abnormality in the adjacent temporal lobe unless there is a separate ischaemic or venous process.<br>The transverse sinus filling defect on the contrast-enhanced image (c) and the asymmetric flow signal on the venogram (d) confirm that outflow from that side of the brain is obstructed, explaining the temporal lobe injury as a venous infarct rather than a simple contusion.<br>This case is a reminder that a sinus thrombosis can itself predispose to subdural bleeding (from stretched bridging veins), so the two findings are linked, not coincidental.",img:[{f:"PMC3709281_SNI-4-85-g001.png",cap:"Case 1. A 38-year-old woman on oral contraceptives presented with headache and difficulty speaking. She had no other significant past medical history. A left frontal subdural hematoma (white arrows, a, b; black arrow, c) and left temporal venous infarct (white arrow, c) with a left transverse sinus thrombosis (black arrow, d) was demonstrated on CT (a) and MR imaging (b, c, d). A hypercoagulable work-up did not…",src:"Akins PT et al., Surgical neurology international (2013)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3709281",lic:"CC BY-NC-SA",alt:"Four-panel figure: (a) coronal non-contrast CT showing a crescentic left-sided subdural collection, (b) axial MRI with arrows marking an area of abnormal signal in the left tempora"}]},
{id:"i71",deck:"Imaging",tier:2,tags:["venous","CTV"],q:"This lateral venogram shows unusually prominent, tortuous scalp and facial veins with an enlarged pterygoid/pharyngeal venous plexus. These are not normally so conspicuous. What underlying process would cause extracranial veins to become this dilated and corkscrew-shaped, and what does it imply about the chronicity of the disease?",a:"<b>Extracranial venous collaterals from chronic dural sinus outflow obstruction.</b><br>When a major intracranial sinus is chronically occluded, blood is forced to find alternative routes out of the skull, recruiting and dilating scalp, facial, and pterygoid/vertebral plexus veins that are normally small and inconspicuous.<br>Their tortuous, 'corkscrew' appearance reflects long-standing, not acute, redirection of flow, so seeing them prominently opacified on a venogram is an indirect sign that the underlying sinus thrombosis has been present for some time and that collateral pathways have had a chance to develop.",img:[{f:"PMC4350201_AIAN-18-121-g003.png",cap:"CT Venogram (reconstructed) showing cork screw scalp veins (black arrow leftwards), dilated superficial temporal vein (red arrow rightwards), facial veins (black arrow rightwards), pterygoid, pharyngeal (black arrow upwards) and vertebral venous plexuses (red arrow leftwards)",src:"Sharma CB et al., Annals of Indian Academy of Neurology (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4350201",lic:"CC BY-NC-SA",alt:"Lateral maximum-intensity-projection CT venogram of the head and upper neck with four arrows highlighting prominent, tortuous ('corkscrew') scalp and facial veins and enlarged pter"}]},
{id:"i72",deck:"Imaging",tier:2,tags:["venous","CT"],q:"This is a trauma CT with a fracture, an extra-axial haematoma, and pneumocephalus near the right occipital bone. Panel D shows an arrow pointing to an unexpectedly bright linear focus along the expected course of the sigmoid sinus. Why is this finding easy to overlook in a trauma setting, and why does it matter clinically?",a:"<b>Traumatic sigmoid sinus thrombosis (the 'dense vein sign').</b><br>The hyperdensity marked in panel D follows the normal course of the sigmoid sinus rather than being an incidental bleed, and its location right next to the occipital fracture is the clue that it represents acute clot rather than a normal vessel.<br>In a busy trauma read, attention is drawn to the fracture, haematoma, and pneumocephalus, so a subtle linear density along a sinus is easy to miss unless specifically sought whenever a fracture crosses a dural venous sinus.<br>Missing it matters because sinus thrombosis can cause venous infarction or raised intracranial pressure, so any fracture line crossing a major sinus should prompt dedicated venographic follow-up.",img:[{f:"PMC4564750_jkns-58-150-g001.png",cap:"Brain computed tomography (CT) showed a linear fracture in the right occipital bone (A) and a suspicious intracranial hematoma (B, white arrow) with pneumocephalus (C) around the fracture site. Additionally, a high-density lesion located in right sigmoid sinus was revealed (D, black arrow, &quot;dense vein sign&quot;).",src:"Yun JH et al., Journal of Korean Neurosurgical Society (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4564750",lic:"CC BY-NC",alt:"Four-panel head CT after trauma: (A) bone-window image, (B) soft-tissue axial CT with an arrow at a right-sided extra-axial haematoma, (C) axial CT showing air within the cranium ("}]},
{id:"i73",deck:"Imaging",tier:2,tags:["venous","MRV"],q:"This coronal MR venogram shows the superior sagittal sinus draining normally at the midline, but the arrow marks a side where the expected bright flow signal at the transverse-sigmoid junction is missing compared with the other side. How do you use side-to-side comparison here to call this abnormal, given that flow signal — not diagnosis — is directly measured?",a:"<b>Left transverse-sigmoid sinus thrombosis.</b><br>MR venography works by detecting flowing blood as bright signal; thrombus produces no flow and therefore no signal, so a normal sinus should look symmetrically bright on both sides.<br>Here, the right transverse-sigmoid sinus opacifies normally, but the left, at the arrow, shows a segment of reduced signal — the asymmetry, not the absolute appearance, is what makes the call.<br>Always compare left and right when reading a venogram, since unilateral absence of an expected sinus is far more specific for thrombosis than assessing one side in isolation.",img:[{f:"PMC5107850_CRINM2016-8314040.001.png",cap:"MRI venography showing right transverse and sigmoid sinus thrombosis (arrow).",src:"Khanal P et al., Case reports in neurological medicine (2016)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5107850",lic:"CC BY",alt:"Coronal MR venogram (time-of-flight) showing the superior sagittal sinus and bilateral cortical/transverse venous structures, with a red arrow indicating a region of diminished or"}]},
{id:"i74",deck:"Imaging",tier:2,tags:["venous","mixed"],q:"Panels A and B show enhancing soft tissue around the mastoid and jugular fossa; panel C is a venogram with an asymmetric transverse sinus. How does the location of the inflammatory changes in A and B help explain which sinus is affected in C, and what underlying process links the two?",a:"<b>Otogenic (mastoiditis-associated) left transverse/sigmoid sinus thrombosis.</b><br>The enhancing soft tissue in the mastoid and jugular fossa in panels A and B indicates local infection/thrombophlebitis, and the left transverse sinus runs directly adjacent to the mastoid air cells.<br>Infection here can spread directly to the adjacent dural sinus wall, provoking thrombosis, which is exactly the diminished flow signal seen on the left side of the venogram in panel C compared with the normally opacified right side.<br>This triad — mastoid infection, skull-base enhancement, and an ipsilateral sinus flow defect — is the classic pattern of secondary (otogenic) cerebral venous thrombosis, distinct from the idiopathic or prothrombotic causes more often tested.",img:[{f:"PMC3124731_jkms-26-962-g001.png",cap:"Cranial MRI of the case. (A) Gadolinium-enhanced fat saturation T1WI revealed left mastoiditis (short arrow) and a filling defect at the left sigmoid sinus (long arrow). (B) The arrow indicates diffuse enhancement in the left jugular fossa and the right side of the clivus, suggesting thrombophlebitis and skull base osteomyelitis. (C) MR venography demonstrated a decreased flow at the left transverse sinus, and an…",src:"Lee SJ et al., Journal of Korean medical science (2011)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3124731",lic:"CC BY-NC",alt:"Three-panel MRI: (A) axial post-contrast fat-saturated T1 at skull-base level with arrows at enhancing mastoid soft tissue, (B) a similar axial slice with an arrow at enhancement n"}]},
{id:"i75",deck:"Imaging",tier:2,tags:["aneurysm","MRI"],q:"This contrast-enhanced axial MRI shows a mass abutting the cavernous sinus at the point the oculomotor nerve exits the brainstem region. If this represents an aneurysm, which vessel is it most likely arising from, and would you expect the pupil to be spared or involved?",a:"<b>Posterior communicating artery (PComm) aneurysm</b>, most likely arising at its junction with the internal carotid artery.<br>The oculomotor nerve runs directly beneath the PComm as it exits the midbrain, so a compressive mass here classically causes a <b>painful third nerve palsy with pupillary involvement</b> (a 'surgical' third nerve palsy) — the parasympathetic pupillary fibres run superficially on the nerve and are compressed first, unlike the ischaemic (pupil-sparing) third nerve palsy of microvascular disease.<br>Any new third nerve palsy, especially with pupil involvement, should prompt urgent vascular imaging to exclude a PComm aneurysm.",img:[{f:"PMC3201077_AJNS-5-70-g001.png",cap:"Contrast MRI head axial section showing an irregularly enhancing mass in the right medial temporal lobe anteriorly in the close proximity to the cavernous sinus and oculomotor nerve (arrow).",src:"Sharma K et al., Asian journal of neurosurgery (2010)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3201077",lic:"CC BY-NC-SA",alt:"Axial contrast-enhanced MRI at the level of the midbrain/temporal lobes showing an irregular, moderately enhancing round mass in the right medial temporal lobe abutting the caverno"}]},
{id:"i76",deck:"Imaging",tier:2,tags:["aneurysm","mixed"],q:"A patient presents with massive intraventricular haemorrhage. The non-contrast CT shows blood filling the ventricles, and the CT angiogram reveals a rounded vascular structure near the choroidal fissure. Why does this pattern of haemorrhage point towards an aneurysm on a small, distal-calibre vessel rather than one of the major circle of Willis arteries?",a:"The aneurysm here arises from the <b>anterior choroidal artery</b>, a small perforator-type vessel that runs directly into the choroid plexus and temporal horn.<br>Because this artery has direct access to the ventricular system, rupture here bleeds preferentially <b>into the ventricles</b> rather than the basal cisterns, unlike AComm or PComm aneurysms which classically produce subarachnoid blood in the suprasellar/sylvian cisterns.<br>Always trace an unusual haemorrhage pattern back to the vessel that plausibly supplies that space.",img:[{f:"PMC3589846_SNI-4-17-g005.png",cap:"Computed tomography (CT). (a) CT shows massive intraventricular hemorrhage, (b) CT with contrast medium revealed enlargement of the cerebral aneurysm, (c) CT angiography showed cerebral aneurysm arising from right anterior choroidal artery, (d) CT angiography coronal image showed cerebral aneurysm (arrow) arising from right anterior choroidal artery (arrow head)",src:"Hayashi K et al., Surgical neurology international (2013)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3589846",lic:"CC BY-NC-SA",alt:"Four-panel CT series: non-contrast CT showing massive intraventricular haemorrhage, contrast CT showing an enlarging round density, and two CT angiogram panels showing a saccular a"}]},
{id:"i77",deck:"Imaging",tier:2,tags:["aneurysm","DSA"],q:"Using the labelled A1, A2 and M1 segments on this angiogram, which named artery gives rise to the aneurysm (arrow), and why does the anterior communicating artery itself fail to opacify on this injection?",a:"The outpouching arises from the <b>right A2 segment</b> of the anterior cerebral artery, just distal to the A1-A2 (anterior communicating) junction — a distal ACA aneurysm rather than a true AComm aneurysm.<br>The anterior communicating artery is not filling because it was sacrificed or occluded at a prior surgery for a separate AComm aneurysm, illustrating why parent-vessel patency must always be checked on follow-up angiography after clipping.<br>Localising an aneurysm to a specific arterial segment, rather than a vague 'ACA region', is what distinguishes a precise angiographic read.",img:[{f:"PMC4653326_SNI-6-560-g004.png",cap:"Digital subtraction angiogram viewed from an anterior-oblique angle. The aneurysm is based on the medial wall of the right A2 approximately 2 mm distal to the A1-A1 junction. The anterior communicating artery, patent at the initial surgery, does not fill at all now. The aneurysm clip (red arrow) is seen in the region the anterior communicating artery aneurysm and artery to be used",src:"Ibrahim TF et al., Surgical neurology international (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4653326",lic:"CC BY-NC-SA",alt:"A labelled digital subtraction angiogram (anterior-oblique) of the anterior circulation with the ICA, A1, A2 and M1 segments annotated; a small oval contrast-filled outpouching (re"}]},
{id:"i78",deck:"Imaging",tier:2,tags:["aneurysm","MRI"],q:"This sagittal MRI shows a rounded structure indenting the floor of the third ventricle from below. Which artery does this lesion most likely arise from, and what non-haemorrhagic presentation could a large lesion in this location cause?",a:"This is a <b>basilar tip (basilar apex) aneurysm</b> — it sits at the top of the basilar artery immediately below the third ventricle floor, exactly where this lesion is indenting the ventricle.<br>Besides subarachnoid haemorrhage if it ruptures, a large unruptured basilar tip aneurysm can compress the hypothalamus/third ventricle floor and cause <b>obstructive hydrocephalus or hypothalamic-pituitary dysfunction</b> from local mass effect.<br>Basilar tip is the most common posterior circulation aneurysm site and is notoriously difficult to access surgically, often favouring endovascular treatment.",img:[{f:"PMC4857316_10.1177_2050313X15578318-fig4.png",cap:"Sagittal view of magnetic resonance imaging (MRI) showing the basilar apex aneurysm pushing up the third ventricle floor (arrow).",src:"Hidaka T et al., SAGE open medical case reports (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4857316",lic:"CC BY-NC",alt:"A sagittal MRI at the level of the third ventricle showing a rounded flow-void structure just below and indenting the floor of the third ventricle, marked by an arrow."}]},
{id:"i79",deck:"Imaging",tier:2,tags:["aneurysm","DSA"],q:"On this lateral vertebral angiogram, where does the outpouching arise relative to the posterior clinoid process, and what does that tell you about which vessel bifurcation is involved?",a:"The rounded sac sits at the very top of the basilar artery, at roughly the level of the posterior clinoid process — this is the <b>basilar tip (basilar bifurcation)</b>, where the basilar artery divides into the two posterior cerebral arteries.<br>Its position right at the apex, rather than off a side branch, distinguishes a basilar tip aneurysm from an SCA or AICA-origin aneurysm lower down the basilar trunk.<br>Basilar tip aneurysms carry a higher rupture risk for their size than many other locations and are a classic indication for endovascular coiling given difficult surgical access.",img:[{f:"PMC2597766_vhrm-4-0931f2.png",cap:"Lateral view of left vertebral angiogram demonstrating aneurysm (maximum diameter of 10 mm) located at the basilar bifurcation as high as the posterior clinoid process.",src:"Kakino S et al., Vascular health and risk management (2008)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2597766",lic:"CC BY-NC",alt:"A lateral vertebral artery angiogram showing a smooth, rounded saccular outpouching arising at the top of the basilar artery at the level of the posterior clinoid, unannotated."}]},
{id:"i80",deck:"Imaging",tier:2,tags:["aneurysm","CTA"],q:"This CT angiogram shows an outpouching at the right MCA. If this aneurysm ruptured, what focal neurological deficit pattern, beyond a global SAH picture, might distinguish it from an AComm or PComm bleed?",a:"MCA bifurcation aneurysms sit within or near the sylvian fissure, so rupture can cause a <b>sylvian fissure haematoma</b> with focal contralateral hemiparesis, hemisensory loss, or (if left-sided) aphasia — a more focal picture than the typical diffuse basal cistern SAH of an AComm bleed.<br>MCA aneurysms are also more prone to an associated intraparenchymal haematoma because the sylvian fissure is a relatively confined space close to brain parenchyma.<br>Focal signs plus SAH is therefore a clue pointing towards an MCA-territory aneurysm even before angiography.",img:[{f:"PMC2905180_OJO-2-57-g006.png",cap:"CT angiography showing a right middle cerebral artery aneurysm (white arrow)",src:"Kakaria AK., Oman journal of ophthalmology (2009)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2905180",lic:"CC BY",alt:"A 3D volume-rendered CT angiogram of the circle of Willis showing a small saccular outpouching at the middle cerebral artery region on the right, marked with an arrow."}]},
{id:"i81",deck:"Imaging",tier:2,tags:["aneurysm","MRI"],q:"A sellar mass is bright on T1 and dark on T2. Why does this signal pattern argue against a straightforward pituitary macroadenoma, and what vascular diagnosis should be excluded before any biopsy or transsphenoidal surgery is planned?",a:"This signal pattern (T1-hyperintense, T2-hypointense) suggests <b>a partially or fully thrombosed aneurysm</b>, usually of the paraclinoid/cavernous internal carotid artery, rather than a typical pituitary adenoma, which is usually iso- to hypointense on T1.<br>The T1 hyperintensity reflects methaemoglobin within layered clot, and the T2 hypointensity reflects haemosiderin and the fibrous wall.<br>Because a thrombosed giant aneurysm can mimic a sellar or parasellar tumour clinically, <b>CT or MR angiography is mandatory before any biopsy or transsphenoidal surgery</b> to avoid catastrophic haemorrhage from inadvertently entering a vascular lesion.",img:[{f:"PMC3110446_OJO-4-32-g002.png",cap:"MRI brain sagittal view. A: T-1 weighted imaging showing a hyperintense mass lesion occupying the sellar region. B: T-2 weighted imaging showing a hypointense lesion. C: Post gadolinium sequence showing heterogenous enhancement of the sellar lesion",src:"Diyora B et al., Oman journal of ophthalmology (2011)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3110446",lic:"CC BY-NC-SA",alt:"Sagittal MRI, three sequences of the sellar/suprasellar region: T1-weighted shows a hyperintense round mass, T2-weighted shows the same mass as hypointense, and a third panel shows"}]},
{id:"i82",deck:"Imaging",tier:2,tags:["aneurysm","DSA"],q:"This angiogram shows three separate aneurysms in the same patient: at the AComm, on M1, and at the MCA bifurcation. If only one of these ruptured, what angiographic and clinical clues, beyond simply picking the biggest sac, would help identify the culprit lesion?",a:"With multiple aneurysms, the ruptured one is usually identified by <b>correlating the distribution of subarachnoid blood on the presenting CT with each aneurysm's location</b> (blood concentrated in the sylvian fissure points to the MCA lesion, interhemispheric/frontal blood points to the AComm lesion), plus <b>morphological features of instability</b> such as an irregular contour or a daughter sac, rather than simply choosing the largest one.<br>Size alone is an unreliable predictor of which aneurysm bled.<br>This case illustrates why complete catheter angiography is performed even after CTA, to catch every aneurysm and plan treatment of the culprit and, often, the others.",img:[{f:"PMC4495085_jcen-17-113-g002.png",cap:"Anterior-posterior view of a right carotid injection angiogram. From right to left, the first arrow indicates a right-filling anterior communicating artery aneurysm. The second arrow indicates a M1 aneurysm. The third arrow indicates a middle cerebral artery (MCA) bifurcation aneurysm. The MCA bifurcation aneurysm was the suspected ruptured aneurysm based on the clinical presentation.",src:"Ahmed O et al., Journal of cerebrovascular and endovascular neurosurgery (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4495085",lic:"CC BY-NC",alt:"An anteroposterior right internal carotid injection angiogram with three yellow arrows marking three separate saccular outpouchings: one at the AComm, one on the M1 segment, and on"}]},
{id:"i83",deck:"Imaging",tier:2,tags:["aneurysm","MRI"],q:"This coronal T2 MRI shows a large, sharply marginated round area of signal void adjacent to the brain. What physical property of flowing blood explains why this lesion appears completely black, and what does that tell you about whether it is thrombosed or patent?",a:"Rapidly flowing blood produces a <b>flow void</b> on standard T2-weighted spin-echo sequences because moving protons are not refocused by the imaging pulses, so the lumen appears signal-black.<br>A uniformly black, sharply marginated round lesion like this therefore represents a <b>patent (non-thrombosed) giant saccular aneurysm</b> with fast turbulent flow throughout the sac, in contrast to a thrombosed aneurysm, which shows mixed, layered signal.<br>Recognising the flow-void pattern avoids mistaking a giant aneurysm for a cyst, calcified lesion, or tumour on an unenhanced sequence.",img:[{f:"PMC4515254_CRIM2015-536191.001.png",cap:"Coronal T2-weighted MR image showing giant saccular aneurysm.",src:"Gungor A et al., Case reports in medicine (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4515254",lic:"CC BY",alt:"A coronal T2-weighted MRI showing a large, well-circumscribed rounded area of signal void adjacent to the brain, unannotated."}]},
{id:"i84",deck:"Imaging",tier:2,tags:["aneurysm","MRI"],q:"This mass shows mixed, layered signal on both T1 and T2 sequences rather than uniform signal throughout. What does this heterogeneity suggest about the internal contents of the lesion, and how does that change the differential from a solid brain tumour?",a:"The layered, mixed-signal appearance reflects <b>thrombus of varying age within the aneurysm sac</b>, an 'onion-skin' pattern of concentric clot with a possible residual flow void centrally if any lumen remains patent.<br>This heterogeneity, rather than the more uniform signal typical of a solid tumour such as a meningioma or schwannoma, should prompt vascular imaging (MRA/CTA) to confirm a <b>giant thrombosed aneurysm</b> before any biopsy is attempted.<br>Giant thrombosed aneurysms can also compress or occlude adjacent vessels, here associated with posterior cerebral artery compromise, producing an ischaemic deficit in addition to mass effect.",img:[{f:"PMC4766803_SNI-7-15-g003.png",cap:"Cranial magnetic resonance imaging axial acquisition (a: T1-weighted; b: T2-weighted) showing an expansive lesion, with heterogeneous signal, suggesting a totally thrombosed giant aneurysm with occlusion of the posterior cerebral artery",src:"de Aguiar GB et al., Surgical neurology international (2016)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4766803",lic:"CC BY-NC-SA",alt:"Two axial MRI panels (T1 and T2-weighted) showing a large, heterogeneous mass with mixed layered signal intensity at the expected location of the right MCA/posterior cerebral arter"}]},
{id:"i85",deck:"Imaging",tier:2,tags:["aneurysm","mixed"],q:"The CT shows a large, well-defined hyperdense mass near the sylvian fissure, and the MRI (same patient) shows a similarly located lobulated lesion compressing the brainstem. What single vascular diagnosis explains both the CT hyperdensity and the MRI lobulation, and why is brainstem compression from a lesion this far anteriorly possible?",a:"This is a <b>giant, partly thrombosed right MCA aneurysm</b> — the CT hyperdensity reflects acute haemorrhage/dense clot within the sac, and the lobulated, heterogeneous MRI appearance reflects thrombus of mixed age layered within the aneurysm wall.<br>Even though the MCA is an anterior circulation vessel, a giant sac several centimetres across can expand medially and posteriorly enough to distort the midbrain and brainstem, producing symptoms that might otherwise suggest a posterior fossa lesion.<br>Giant aneurysms this size behave clinically as much like mass lesions as like typical berry aneurysms, and often present with progressive focal deficits rather than sudden SAH alone.",img:[{f:"PMC5065920_ircmj-18-08-30608-g001.png",cap:"Giant Cerebral Aneurysm on CT and MRI in the Emergency DepartmentA and B, Ruptured right giant MCA aneurysm on CT; C and D, Giant, lobulated, and thrombotic right MCA aneurysm on T2 axial MRI. Brainstem compression is observed.",src:"Koksal V et al., Iranian Red Crescent medical journal (2016)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5065920",lic:"CC BY-NC",alt:"A four-panel comparison: two non-contrast CT panels showing a large hyperdense round mass with a hyperdense rim adjacent to the right sylvian fissure, and two T2-weighted MRI panel"}]},
{id:"i86",deck:"Imaging",tier:2,tags:["aneurysm","DSA"],q:"This 3D vertebral angiogram shows three separate outpouchings along the posterior circulation. Besides the basilar tip, which other named artery gives rise to the other two aneurysms, and why is finding multiple posterior circulation aneurysms clinically significant for treatment planning?",a:"The other two aneurysms arise from the <b>right and left superior cerebellar arteries (SCA)</b>, in addition to the basilar tip aneurysm.<br>Because SCA and basilar tip aneurysms sit close together anatomically and share a common inflow from the distal basilar artery, finding one should prompt a careful angiographic survey of the whole vertebrobasilar system, since a single endovascular or surgical session may need to address several aneurysms at once.<br>Multiplicity of posterior circulation aneurysms also raises the pretest probability of an underlying connective tissue or familial aneurysm syndrome.",img:[{f:"PMC2039855_234_2007_251_Fig2_HTML.png",cap:"Pre- and posttreatment images of two patients with multiple posterior circulation aneurysms. a A 44-year-old man with a ruptured middle cerebral artery aneurysm and four additional aneurysms. 3-D vertebral angiogram reveals right SCA aneurysm (short single arrow), left distal SCA aneurysm (long single arrow) and basilar tip aneurysm (pair of arrows). b Complete occlusion after coiling. c A 61-year-old woman with…",src:"Peluso JP et al., Neuroradiology (2007)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2039855",lic:"CC BY-NC",alt:"A 3D reconstructed vertebral angiogram with three arrows marking three separate saccular aneurysms: one on the right superior cerebellar artery, one on the distal left superior cer"}]},
{id:"i87",deck:"Imaging",tier:2,tags:["aneurysm","mixed"],q:"The CT shows a large calcified, partly thrombosed mass with a central enhancing tubular channel, and the angiogram shows a markedly tortuous, ectatic vascular channel with delayed filling of the normal cortical branches beyond it. What specific type of aneurysm does this tortuous single-channel morphology represent, as opposed to a typical saccular aneurysm?",a:"This is a <b>serpentine (fusiform) aneurysm</b> of the MCA, a rare giant aneurysm subtype in which blood flows through a single, tortuous, worm-like channel surrounded by a large mass of layered thrombus, rather than filling a simple rounded sac off the side of a normal-calibre vessel.<br>The delayed filling of normal cortical branches distal to it reflects a degree of flow-steal and resistance through the tortuous channel, which can itself cause distal ischaemia even without rupture.<br>Serpentine aneurysms are managed differently from saccular aneurysms, often requiring bypass and trapping or thrombectomy of the mass, because simple clipping or coiling of a 'neck' is not anatomically possible.",img:[{f:"PMC2718118_kjr-2-179-g001.png",cap:"A 50-year-old woman with giant intracranial aneurysm.A. Precontrast CT scan shows a large oval-shaped mass with increased attenuation representing thrombus (arrows) and slight peripheral calcification (arrowheads) in the right frontal region. Peripheral edema may also be observed.B. Postcontrast CT scan demonstrates peripheral and central enhancenment. The enhanced central tubular structure represents the…",src:"Park JS et al., Korean journal of radiology (2001)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2718118",lic:"CC BY-NC",alt:"An eight-panel series showing a large right frontal mass that is hyperdense on non-contrast CT with peripheral calcification, shows peripheral and central tubular enhancement on co"}]},
{id:"i88",deck:"Imaging",tier:2,tags:["aneurysm","mixed"],q:"This patient was imaged for an acute ischaemic stroke, and the MR angiogram incidentally reveals a small outpouching at the anterior communicating artery. Does the presence of this small unruptured aneurysm change the acute management of the stroke, and what does its discovery here typically prompt afterwards?",a:"An incidentally discovered small unruptured aneurysm <b>does not change acute stroke management</b> — intravenous thrombolysis or thrombectomy decisions are driven by the stroke itself, since a small unruptured AComm aneurysm does not appreciably raise haemorrhagic risk from thrombolysis.<br>Its discovery does, however, prompt a separate outpatient discussion about <b>elective risk-stratified management</b> (observation versus treatment) based on size, location, and patient risk factors, typically using a validated risk score such as PHASES.<br>This case is a reminder that imaging obtained for stroke workup can uncover unrelated incidental vascular pathology that must be triaged separately from the emergency at hand.",img:[{f:"PMC2940259_crn0001-0020-f01.png",cap:"Baseline CT, MRI during thrombolysis, and delayed angiography. Baseline CT (left top) before intravenous thrombolysis shows a subtle early ischemic sign in the left frontal lobe. Diffusion image (left bottom) during tPA infusion demonstrates a hyperacute ischemia, and MR angiography (right top) shows no arterial occlusions and a suspected small aneurysm at the anterior communicating artery. Delayed cerebral…",src:"Yoneda Y et al., Case reports in neurology (2009)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2940259",lic:"CC BY-NC-ND",alt:"A four-panel workup: non-contrast CT showing no acute abnormality, a diffusion-weighted MRI showing an area of restricted diffusion in the left frontal region, an MR angiogram with"}]},
{id:"i89",deck:"Imaging",tier:2,tags:["aneurysm","CTA"],q:"Using the labelled ACA, MCA and ICA branches on this 3D CT angiogram, trace which vessel the giant aneurysm sac originates from, and describe one clinical feature you would expect if this lesion compresses the adjacent optic apparatus.",a:"The sac originates directly from the <b>internal carotid artery</b> itself, a giant paraclinoid/carotid aneurysm, sitting proximal to where the ACA and MCA branches take off — note that both branches arise from the far side of the sac rather than from within it.<br>Given its size and position near the anterior clinoid and optic canal, a lesion like this can compress the optic nerve or chiasm, producing <b>progressive monocular visual loss or a chiasmal-type visual field defect</b>, rather than the acute painful third nerve palsy seen with smaller PComm aneurysms.<br>Giant ICA aneurysms this size are treated as much for their mass effect on the optic apparatus as for their rupture risk.",img:[{f:"PMC3015168_10143_2010_282_Fig1_HTML.png",cap:"CTA of an internal carotid artery paraclinoid aneurysm and an anterior communicating artery aneurysm",src:"Bai-Nan X et al., Neurosurgical review (2011)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3015168",lic:"CC BY-NC",alt:"A 3D volume-rendered CT angiogram showing a very large, lobulated round aneurysm arising from the left internal carotid artery, with labelled branches for the left ACA, left MCA an"}]},
{id:"i90",deck:"Imaging",tier:2,tags:["cavernous sinus","MRI"],q:"Both panels show the same abnormal orbital structure on different MRI sequences. What is it, and why does its presence point to disease further back in the cavernous sinus rather than in the orbit itself?",a:"<b>Answer: a dilated (here thrombosed) superior ophthalmic vein.</b><br>The superior ophthalmic vein drains forwards from the orbit into the cavernous sinus; when it is enlarged and shows abnormal intraluminal signal (bright on T1, altered on T2) rather than a normal flow void, this implies obstructed or reversed flow at its drainage point.<br><ul><li>Causes include cavernous sinus thrombosis (impaired outflow) or a carotid-cavernous fistula (arterialised, high-pressure inflow)</li><li>The vein is an indirect sign - the primary pathology lies in the cavernous sinus, not the orbit</li></ul>",img:[{f:"PMC3162743_MEAJO-18-256-g001.png",cap:"Coronal T1-weighted (T1WI) and T2-weighted (T2WI) images showing dilated left-sided superior (large white arrow) and inferior (small white arrow) ophthalmic veins with intraluminal T1WI hyperintense and T2WI hypointense signals",src:"Vyas S et al., Middle East African journal of ophthalmology (2011)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3162743",lic:"CC BY-NC-SA",alt:"Two side-by-side coronal MRI panels of the orbits, each with an arrow marking a rounded structure medial to the left globe consistent with a dilated superior/inferior ophthalmic ve"}]},
{id:"i91",deck:"Imaging",tier:2,tags:["cavernous sinus","MRI"],q:"This patient has an enhancing mass in the left cavernous sinus plus abnormal signal in the ophthalmic veins on the same side. How are these two findings mechanistically linked?",a:"<b>Answer: the cavernous sinus mass (meningioma) is compressing venous outflow, secondarily thrombosing the ophthalmic veins.</b><br>Meningiomas are extra-axial, dural-based, avidly enhancing tumours - exactly the pattern seen in the expanded left cavernous sinus here.<br><ul><li>As the tumour enlarges within the sinus it narrows or occludes the venous channels that drain the orbit</li><li>This produces the secondary sign of dilated, thrombosed ophthalmic veins seen on the same image</li><li>Recognising both signs together should prompt a search for a cavernous sinus mass, not just an isolated venous problem</li></ul>",img:[{f:"PMC3162743_MEAJO-18-256-g002.png",cap:"Contrast-enhanced T1-weighted axial magnetic resonance imaging study showing left cavernous sinus meningioma (black arrow) with thrombosed superior (large white arrow) and inferior (small white arrow) ophthalmic veins",src:"Vyas S et al., Middle East African journal of ophthalmology (2011)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3162743",lic:"CC BY-NC-SA",alt:"Axial contrast-enhanced T1 MRI, two adjacent slices, showing an enhancing soft-tissue mass expanding the left cavernous sinus, with arrows also marking abnormally prominent, non-fl"}]},
{id:"i92",deck:"Imaging",tier:2,tags:["cavernous sinus","MRI"],q:"On this coronal post-contrast image, the cavernous sinus region looks enlarged and enhances. What clue on a coronal image helps distinguish venous sinus thrombosis from a discrete unilateral tumour at this location?",a:"<b>Answer: thrombosis tends to cause bilateral (even if asymmetric) convex bulging and heterogeneous enhancement of both cavernous sinuses, rather than a single well-defined enhancing mass on one side.</b><br>Here the expanded, enhancing tissue is seen straddling the midline structures at the skull base, in keeping with bilateral, asymmetric sinus involvement.<br><ul><li>A unilateral, sharply marginated, homogeneously enhancing mass favours a tumour such as meningioma</li><li>Bilateral, irregular expansion with venous engorgement favours thrombosis</li><li>Correlating with clinical signs (fever, orbital congestion, rapid onset) is essential since imaging overlap exists</li></ul>",img:[{f:"PMC3663068_kjo-27-219-g003.png",cap:"Coronal view on 3-D T1-weighted magnetic resonance imaging after administration of gadolinium reveals the cavernous sinus with thrombosis on both sides, but more pronounced on the right side (arrow).",src:"Gutzeit A et al., Korean journal of ophthalmology : KJO (2013)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3663068",lic:"CC BY-NC",alt:"Single coronal post-gadolinium T1 MRI at the level of the sella showing an expanded, enhancing structure lateral to the pituitary with an arrow marking the abnormal cavernous sinus"}]},
{id:"i93",deck:"Imaging",tier:2,tags:["cavernous sinus","MRI"],q:"The arrow marks an area of altered signal lateral to the internal carotid artery on the left. Which cranial nerves travelling through this region would you test first if this were a real lesion, and which is classically most vulnerable?",a:"<b>Answer: III, IV, VI and V1 - the nerves of the lateral wall of the cavernous sinus and superior orbital fissure.</b><br>The marked area sits at the junction of the cavernous sinus and orbital apex, exactly where the oculomotor, trochlear, ophthalmic and abducens nerves converge before entering the orbit.<br><ul><li>A mass here classically causes painful ophthalmoplegia - diplopia, ptosis, and pupil involvement depending on which nerves are compressed</li><li>The abducens nerve (VI) runs freely within the sinus rather than in its lateral wall and is often the first or most severely affected because it lacks dural support</li></ul>",img:[{f:"PMC5340048_JOVR-12-106-g002.png",cap:"Axial constructive interference steady state (CISS) magnetic resonance image (MRI) showing enlarged left cavernous sinus due to a hypointense signal intensity lesion lateral to internal carotid artery (arrow), lesion is extending anteriorly towards the orbital apex.",src:"Wani NA et al., Journal of ophthalmic & vision research (2017)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5340048",lic:"CC BY-NC-SA",alt:"Axial CISS (heavily T2-weighted) MRI through the skull base with an arrow pointing to a subtly different signal region lateral to the internal carotid artery on the left, at the ex"}]},
{id:"i94",deck:"Imaging",tier:2,tags:["cavernous sinus","MRI"],q:"The internal carotid artery appears pushed medially by the enhancing tissue lateral to it. What does this displacement pattern suggest about where the lesion is arising from, and how would encasement instead change that impression?",a:"<b>Answer: displacement suggests an extrinsic dural-based mass (such as a meningioma) expanding the lateral cavernous sinus and pushing the artery aside rather than growing from within it.</b><br>Medial displacement of the cavernous ICA is a classic sign of an adjacent dural-based mass.<br><ul><li>Simple displacement without luminal narrowing is reassuring for a benign, slow-growing lesion</li><li>Encasement (tumour surrounding more than half the artery's circumference) instead suggests a more infiltrative process and is used in grading systems to predict resectability</li></ul>",img:[{f:"PMC5340048_JOVR-12-106-g003.png",cap:"Post-gadolinium enhanced T1-weighted magnetic resonance image (T1W MRI) shows intensely enhancing lesion in the left cavernous sinus (arrow) lateral to medially displaced internal carotid artery. Lesion appears larger as compared to T2-weighted (T2W) coronal image [Figure 1].",src:"Wani NA et al., Journal of ophthalmic & vision research (2017)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5340048",lic:"CC BY-NC-SA",alt:"Single coronal post-gadolinium T1 MRI with an arrow marking an enhancing focus at the skull base lateral to the internal carotid artery on the left."}]},
{id:"i95",deck:"Imaging",tier:2,tags:["cavernous sinus","CT"],q:"The sphenoid sinus and the cavernous sinus are marked as being in direct contact on this CT. Why does that anatomical relationship matter clinically?",a:"<b>Answer: the thin bony wall separating the sphenoid sinus from the cavernous sinus makes sphenoid sinusitis a direct route to septic cavernous sinus thrombosis.</b><br>The image shows abnormal opacification tracking from the sphenoid air cells into the adjacent enlarged, enhancing cavernous sinus.<br><ul><li>Infection can spread by direct extension through the thin sphenoid wall or via the valveless emissary/ophthalmic veins</li><li>This is why sphenoid sinusitis is a recognised, dangerous precursor to septic cavernous sinus thrombosis</li><li>Early cross-sectional imaging is warranted if a patient with sphenoiditis develops eye signs</li></ul>",img:[{f:"PMC3605125_1746-160X-9-9-2.png",cap:"Contrast-enhanced CT. Contrast-enhanced CT showed enhancement and dilation of left cavernous sinus (arrowhead). Sphenoid sinus occupied the low density area. The right sphenoid sinus extended posteriorly to the left sinus and was in contact with both cavernous sinuses (arrow).",src:"Komatsu H et al., Head & face medicine (2013)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3605125",lic:"CC BY",alt:"Single axial CT of the skull base at the level of the sphenoid sinus, with arrows marking an enlarged, enhancing left cavernous sinus and a low-density sphenoid sinus in direct con"}]},
{id:"i96",deck:"Imaging",tier:2,tags:["cavernous sinus","MRI"],q:"Comparing the right and left sides of this coronal image, what is the key asymmetry, and what does it suggest about the underlying pathology?",a:"<b>Answer: the right cavernous sinus is expanded and more rounded than the normal, flatter left side - the pattern of a mass rather than a diffuse process.</b><br>Using the normal contralateral cavernous sinus as an internal control is a fast way to spot subtle unilateral disease.<br><ul><li>A well-defined bulge favours a focal mass (e.g. meningioma, schwannoma) that expands the sinus and can encase the internal carotid artery</li><li>Diffuse bilateral enlargement instead would favour a venous or inflammatory process such as thrombosis</li></ul>",img:[{f:"PMC3683174_SNI-4-74-g002.png",cap:"Coronal T1 weighted magnetic resonance imaging scan showing a complex multilobulated mass centered within the right cavernous sinus and encasing the cavernous internal carotid artery",src:"Nassiri F et al., Surgical neurology international (2013)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3683174",lic:"CC BY-NC-SA",alt:"Single coronal T1 MRI at the skull base showing an asymmetrically enlarged, more rounded soft-tissue region on the right compared with the flatter, normal-appearing left side, at t"}]},
{id:"i97",deck:"Imaging",tier:2,tags:["cavernous sinus","MRI"],q:"Two separate abnormalities are marked here - one at the skull base, one along the adjacent temporal dura. How could a single unifying process, such as sinus thrombosis, produce both findings at once?",a:"<b>Answer: septic cavernous sinus thrombosis can produce both diminished sinus enhancement (from a filling defect/clot) and adjacent dural enhancement (from local spread of infection or reactive inflammation).</b><br>The two arrows mark findings at the same skull-base level, consistent with contiguous spread from the cavernous sinus into the adjacent dura.<br><ul><li>Loss of normal, symmetrical cavernous sinus enhancement is the direct sign of thrombus</li><li>Adjacent dural thickening/enhancement is an indirect sign of associated infective or inflammatory change</li><li>Together they should raise concern for a septic source (e.g. sinusitis, otitis) requiring urgent treatment</li></ul>",img:[{f:"PMC3743519_idr-6-079Fig1.png",cap:"A band of enhancement measuring 6 mm in thickness is seen along the medial margin of the right temporal convexity (arrow #2). Increased T2 signal in the region of the right cavernous sinus with diminshed enhancement is suggestive of cavernous sinus thrombosis (arrow #1).",src:"Clarke M et al., Infection and drug resistance (2013)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3743519",lic:"CC BY-NC",alt:"Single coronal T1 MRI with two numbered arrows, one pointing to the midline skull base structures and one pointing to the adjacent left temporal dura, marking mild asymmetric signa"}]},
{id:"i98",deck:"Imaging",tier:2,tags:["cavernous sinus","MRI"],q:"The marked abnormality here is small and easy to miss. In a patient with painful diplopia, what clinical diagnosis does this location - superior orbital fissure extending into the anterior cavernous sinus - suggest, and why is it a diagnosis of exclusion?",a:"<b>Answer: Tolosa-Hunt syndrome - idiopathic granulomatous inflammation of the cavernous sinus/superior orbital fissure.</b><br>The arrows mark subtle soft-tissue thickening at exactly the site where III, IV, V1 and VI pass, explaining painful ophthalmoplegia.<br><ul><li>Imaging findings can be this subtle, so a normal-looking scan does not exclude the diagnosis</li><li>It is a diagnosis of exclusion - infection, lymphoma, meningioma and other infiltrative lesions at the same site must be ruled out first</li><li>It is classically rapid and dramatic in its response to steroids, which can support the diagnosis retrospectively</li></ul>",img:[{f:"PMC3984061_opth-8-707Fig3.png",cap:"T1 and T2-weighted MRI with gadolinium contrast of the brain and orbits.Notes: Coronal T2-weighted MRI disclosing a 5×9×10 mm abnormal enhancing of the soft tissue in the left superior orbital fissure with mild extension along the anterior aspect of the left cavernous sinus (red arrow) (A), and an axial T1-weighted MRI disclosing mild edema of the left lateral rectus (red arrow) (B).Abbreviations: MRI, magnetic…",src:"Taylor EJ et al., Clinical ophthalmology (Auckland, N.Z.) (2014)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3984061",lic:"CC BY-NC",alt:"Two-panel MRI - coronal T2 (A) and axial T1 (B) - each with a red arrow marking a small area of soft-tissue fullness at the left superior orbital fissure just anterior to the caver"}]},
{id:"i99",deck:"Imaging",tier:2,tags:["cavernous sinus","MRI"],q:"This is a postoperative scan after resection of a large skull-base mass. What does the small enhancing focus marked by the arrow most likely represent, and why is complete resection often not achieved in this region?",a:"<b>Answer: a small residual remnant of tumour left behind at the cavernous sinus margin.</b><br>The marked focus enhances similarly to the original tumour bed but is now small and discrete, consistent with residual rather than recurrent disease so soon after surgery.<br><ul><li>The cavernous sinus contains the internal carotid artery and cranial nerves III-VI, so surgeons often deliberately leave tumour adherent to these structures rather than risk their injury</li><li>This is why cavernous sinus-invading tumours are frequently treated with planned subtotal resection plus adjuvant radiotherapy for the residual</li></ul>",img:[{f:"PMC4945330_cureus-0008-000000000641-i03.png",cap:"Postoperative MR ImagingPostoperative axial MRI with contrast revealing the degree of resection. The pons is completely decompressed. The arrow is depicting a small tumor residual posterior to the cavernous sinus region.",src:"Jean WC et al., Cureus (2016)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4945330",lic:"CC BY",alt:"Single axial post-contrast MRI at the level of the pons with an arrow pointing to a small, discrete enhancing focus just posterior/lateral to the cavernous sinus region, alongside"}]},
{id:"i100",deck:"Imaging",tier:2,tags:["cavernous sinus","MRI"],q:"On panel A, the enhancing mass clearly extends into the left cavernous sinus. What specific structure should you trace through the mass to judge whether the tumour is merely abutting or truly encasing the cavernous segment of the internal carotid artery?",a:"<b>Answer: trace the flow void of the cavernous internal carotid artery through the enhancing tumour.</b><br>If the artery's flow void is largely surrounded by tumour tissue (the basis of the Knosp grading system), it is considered encased and usually cannot be removed en bloc.<br><ul><li>Here the enhancing tissue clearly bridges from the sella into the cavernous sinus, crossing the medial wall</li><li>This pattern is typical of an invasive pituitary adenoma or a primary cavernous sinus meningioma</li><li>Knosp grading on coronal imaging like this directly informs whether surgery can achieve gross total resection</li></ul>",img:[{f:"PMC4954891_jkns-59-405-g005.png",cap:"A : Coronal contrast-enhanced T1-weighted image on 1.5 T MRI shows a well-enhanced mass, which invades the cavernous sinus and encases the internal carotid artery. B : An image of the anatomy below the level of the sylvian fissure is compromised by artifacts in 7.0 T MRI.",src:"Song SW et al., Journal of Korean Neurosurgical Society (2016)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4954891",lic:"CC BY-NC",alt:"Two coronal post-gadolinium T1 MRI panels at the same level: panel A shows a clearly enhancing mass extending from the sellar region into the left cavernous sinus, at the expected"}]},
{id:"i101",deck:"Imaging",tier:2,tags:["cavernous sinus","MRI"],q:"The cavernous sinus enhances overall but shows small non-enhancing gaps within it. What do these gaps represent, and what dedicated venous sequence would you add to confirm the diagnosis?",a:"<b>Answer: the non-enhancing gaps represent thrombus within the cavernous sinus, since clot does not take up contrast the way flowing, enhancing venous blood does.</b><br>This is the direct MRI sign of cavernous sinus thrombosis - a mix of enhancing patent sinus and non-enhancing clotted segments.<br><ul><li>Confirmatory imaging would include MR venography (MRV) or CT venography to directly demonstrate a venous filling defect/non-opacification</li><li>Correlating with the indirect signs (dilated ophthalmic veins, proptosis) strengthens the diagnosis</li></ul>",img:[{f:"PMC3605125_1746-160X-9-9-4.png",cap:"Contrast-enhanced MRI. Contrast-enhanced T1 MRI showed enhancement of the left cavernous sinus with some defects.",src:"Komatsu H et al., Head & face medicine (2013)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3605125",lic:"CC BY",alt:"Single coronal post-gadolinium T1 MRI with two arrows pointing to an area of enhancement at the midline/left skull base that contains small internal filling defects (non-enhancing"}]},
{id:"i102",deck:"Imaging",tier:2,tags:["cavernous sinus","MRI"],q:"Comparing the pre-operative (a, b) and post-operative (c, d) panels, roughly how much of the tumour was removed, and what does the smooth, uniformly enhancing margin of the original mass tell you about its likely histology?",a:"<b>Answer: only part of the tumour was removed - a residual enhancing component remains in the cavernous sinus/petroclival region on the post-operative images (subtotal resection).</b><br>The pre-operative mass has a broad-based, smoothly marginated, uniformly enhancing appearance typical of meningioma rather than the irregular, necrotic pattern of a more aggressive tumour.<br><ul><li>Meningiomas at the petroclivus/cavernous sinus frequently encircle the carotid artery and cranial nerves, making complete resection hazardous</li><li>This is why subtotal resection with residual disease, as shown here, is a common and accepted outcome for this location</li></ul>",img:[{f:"PMC3771372_10143_2013_484_Fig1_HTML.png",cap:"MRI images of petroclivus meningioma. a, b Preoperative contrast MRI images. There is a tumor significant enhancement (white arrow) located at right petroclivus area and extending into right middle fossa, cavernous sinus, and sphenoid sinus. c, d Postoperative contrast MRI images. The tumor was subtotally removed. The intra-sphenoid sinus component of the tumor appears residually (white arrow)",src:"Xiao X et al., Neurosurgical review (2013)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3771372",lic:"CC BY-NC",alt:"Four-panel MRI: pre-operative axial (a) and sagittal (b) post-contrast images showing a very large, homogeneously enhancing extra-axial mass at the skull base extending into the mi"}]},
{id:"i103",deck:"Imaging",tier:2,tags:["cavernous sinus","MRI"],q:"This coronal brain MRI, obtained for another indication, incidentally shows an enlarged tubular structure near the right orbit. What vessel is this most likely to be, and what two cavernous sinus pathologies should it make you consider?",a:"<b>Answer: an enlarged superior ophthalmic vein.</b><br>The vein is normally slit-like in cross-section; here it appears rounded and prominent, indicating elevated pressure or impaired drainage in its downstream target, the cavernous sinus.<br><ul><li>Cavernous sinus thrombosis - impaired venous outflow causes upstream venous engorgement</li><li>Carotid-cavernous fistula - arterialised, high-pressure inflow into the cavernous sinus is transmitted retrogradely into the ophthalmic vein</li><li>This incidental finding should prompt clinical correlation (proptosis, chemosis, bruit) and dedicated vascular imaging</li></ul>",img:[{f:"PMC4022012_CRIID2014-914042.002.png",cap:"Head MRI with enlarged right superior ophthalmic vein.",src:"Swaminath D et al., Case reports in infectious diseases (2014)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4022012",lic:"CC BY",alt:"Single coronal T1 MRI with a yellow arrow pointing to an enlarged, tubular structure in the right periorbital region, consistent with an enlarged superior ophthalmic vein."}]},
{id:"i104",deck:"Imaging",tier:2,tags:["anatomy","CTA"],q:"On these three orthogonal CTA views, an aneurysm (arrow) arises from the internal carotid artery just before its terminal bifurcation. Which named segment of the ICA does it arise from, and what is this type of aneurysm called?",a:"<b>The supraclinoid (communicating) segment of the internal carotid artery.</b><br>The aneurysm sits on the posteromedial wall of the ICA between the ophthalmic artery origin and the terminal bifurcation into A1/M1, exactly where the posterior communicating artery branches off.<br>Because it arises here, this is termed a <b>posterior communicating artery (PComm) aneurysm</b> — one of the classic saccular aneurysm locations, notorious for causing an isolated third-nerve palsy when it enlarges.",img:[{f:"PMC4429184_CRINM2015-694807.001.png",cap:"Preoperative CT-Angiogram. CT: computed tomography, CTA: computed tomographic angiography, PComm: posterior communicating artery. (a) Axial CTA displaying right PComm aneurysm (white arrow). (b) Sagittal CTA image displaying right PComm aneurysm arising from supraclinoid internal carotid artery (white arrow). (c) Coronal CTA image displaying the right PComm aneurysm (white arrow).",src:"Zeiler FA et al., Case reports in neurological medicine (2015)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4429184",lic:"CC BY",alt:"Three CT angiogram views (axial, sagittal, coronal) of the same small saccular outpouching on the right internal carotid artery, marked by a white arrow on each image, sited just b"}]},
{id:"i105",deck:"Imaging",tier:2,tags:["anatomy","mixed"],q:"In the profile-view angiogram, the contrast column in the internal carotid artery ends abruptly with nothing filling beyond that point. Name the anatomical point where this occurs and the two arteries that should normally arise from it.",a:"<b>The ICA terminus (the carotid 'T').</b><br>Just distal to the origins of the posterior communicating and anterior choroidal arteries, the internal carotid artery normally bifurcates into the <b>M1 segment of the middle cerebral artery</b> and the <b>A1 segment of the anterior cerebral artery</b>.<br>Here contrast simply stops at this point because of a terminus occlusion, so neither vessel opacifies. The matching T2* images show the corresponding <b>susceptibility (blooming) vessel sign</b> — a dark focus of deoxyhaemoglobin-rich clot sitting exactly at this bifurcation and at the basilar tip/P1 junction.",img:[{f:"PMC3795632_pone.0076727.g003.png",cap:"Illustrative examples of complex internal carotid artery terminus and basilar artery occlusion.Right internal carotid artery terminus (ICA) occlusion seen on catheter angiogram (profile projection, A). A susceptibility vessel sign (arrow) was present on T2* sequence in the right supraclinoid ICA, seen as a dramatic signal loss by comparison with contralateral ICA (dotted arrow). Clot of the basilar tip (arrow)…",src:"Naggara O et al., PloS one (2013)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3795632",lic:"CC BY",alt:"Two catheter angiogram panels (profile and frontal projections) showing contrast abruptly terminating within the intracranial internal carotid artery and at the basilar tip, paired"}]},
{id:"i106",deck:"Imaging",tier:2,tags:["anatomy","MRV"],q:"In several of these panels one transverse or sigmoid sinus fails to opacify. What feature on MRV helps distinguish a congenital hypoplastic/aplastic sinus (a normal variant) from an acutely thrombosed sinus?",a:"<b>A hypoplastic or aplastic sinus is smoothly narrowed or completely absent along its whole expected course, with no vessel expansion</b>, whereas an acutely thrombosed sinus is typically of <b>normal or increased calibre</b> with an abrupt filling defect.<br><ul><li>Congenital variant: gradual taper or a threadlike/absent segment, usually incidental and asymptomatic.</li><li>Thrombosis: a full or expanded-calibre sinus that simply fails to fill, often with clinical correlates (headache, papilloedema) and sometimes associated cortical vein clot.</li></ul>Recognising this distinction prevents mistaking a normal variant for venous sinus thrombosis.",img:[{f:"PMC5018554_ni-11-92-g001.png",cap:"A. Normal MRV including symmetrical transverse sinuses. B. Hypoplastic left transverse sinus and aplastic left sigmoid sinus (long thin arrow). C. Aplastic right transverse and sigmoid sinus (arrowheads). D. Hypoplastic right transverse sinus (thick arrowhead). E. Aplastic left transverse sinus (long thin arrow) and hypoplastic left sigmoid sinus. F. Aplastic anterior one third superior sagittal sinus (short thin…",src:"Goyal G et al., Neurointervention (2016)",u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5018554",lic:"CC BY-NC",alt:"Six MRV panels (A-F): panel A shows symmetrical, fully opacified transverse sinuses bilaterally, while each of panels B-F shows one transverse and/or sigmoid sinus segment that is"}]},
